<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FleetBoard — fleet-sessions mesh</title>
<style>
  /* ============ tokens ============ */
  :root {
    --bg: #0b0e14;
    --bg-raise: #10141d;
    --surface: #141a26;
    --surface-2: #1a2130;
    --surface-3: #202a3c;
    --border: #232d3f;
    --border-soft: #1c2434;
    --text: #e6ebf4;
    --text-2: #9aa7bd;
    --text-3: #64718a;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

    /* one accent: Needs You */
    --accent: #f5a623;
    --accent-dim: rgba(245, 166, 35, 0.14);
    --accent-line: rgba(245, 166, 35, 0.45);

    /* cool neutrals for everything else */
    --work: #4fa3c7;
    --work-dim: rgba(79, 163, 199, 0.13);
    --wait: #8a93b2;
    --wait-dim: rgba(138, 147, 178, 0.12);
    --stale: #566078;
    --dead: #e0564f;
    --dead-dim: rgba(224, 86, 79, 0.15);
    --ok: #57b98a;
    --ok-dim: rgba(87, 185, 138, 0.14);

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.28);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  svg { display: block; flex: none; }

  /* ============ top bar ============ */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: rgba(11,14,20,.88);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-soft);
    padding: 12px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, #1e2a3e, #141a26);
    border: 1px solid var(--border);
    display: grid; place-items: center;
  }
  .brand h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .brand .sub { font-size: 11.5px; color: var(--text-3); font-family: var(--mono); margin-top: 1px; }
  .topbar-spacer { flex: 1 1 auto; }

  /* node chips */
  .nodes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .node-chip {
    position: relative;
    display: flex; align-items: center; gap: 7px;
    padding: 0 12px; min-height: 44px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    font-family: var(--mono); font-size: 12px;
  }
  .node-chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .node-chip.fresh .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-dim); }
  .node-chip.dead { border-color: rgba(224,86,79,.5); background: linear-gradient(180deg, rgba(224,86,79,.07), var(--surface)); }
  .node-chip.dead .dot { background: var(--dead); animation: deadpulse 1.6s ease-in-out infinite; }
  @keyframes deadpulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(224,86,79,.55); }
    50% { box-shadow: 0 0 0 6px rgba(224,86,79,0); }
  }
  .node-chip .age { color: var(--text-3); font-size: 11px; }
  .node-chip.dead .age { color: var(--dead); }
  .node-chip .nname { font-weight: 600; }

  /* tooltip (CSS, from data-tip) */
  [data-tip] { position: relative; }
  [data-tip]::after {
    content: attr(data-tip);
    position: absolute; top: calc(100% + 8px); right: 0;
    z-index: 60;
    background: #0d1119; border: 1px solid var(--border);
    color: var(--text-2);
    padding: 8px 10px; border-radius: 8px;
    font-family: var(--mono); font-size: 11px; line-height: 1.5;
    width: max-content; max-width: 280px; white-space: normal; text-align: left;
    box-shadow: var(--shadow);
    opacity: 0; transform: translateY(-3px); pointer-events: none;
    transition: opacity .14s ease, transform .14s ease;
  }
  [data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; transform: translateY(0); }
  [data-tip].tip-left::after { right: auto; left: 0; }

  /* demo toggle */
  .demo-toggle {
    display: flex; align-items: center; gap: 9px;
    min-height: 44px; padding: 0 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-md);
    font-size: 12px; color: var(--text-2); font-weight: 600;
  }
  .demo-toggle .track {
    width: 34px; height: 19px; border-radius: 10px;
    background: var(--surface-3); border: 1px solid var(--border);
    position: relative; transition: background .18s ease;
  }
  .demo-toggle .knob {
    position: absolute; top: 1px; left: 1px;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--text-3); transition: transform .18s ease, background .18s ease;
  }
  .demo-toggle.on .track { background: rgba(87,185,138,.25); border-color: rgba(87,185,138,.5); }
  .demo-toggle.on .knob { transform: translateX(15px); background: var(--ok); }
  .demo-toggle.on { color: var(--text); }
  .demo-toggle .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
  .demo-toggle.on .live-dot { background: var(--ok); animation: deadpulse 1.4s ease-in-out infinite; }

  /* ============ totals strip ============ */
  .totals {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 14px 20px 0;
    max-width: 1560px; margin: 0 auto;
  }
  .total-tile {
    display: flex; align-items: baseline; gap: 7px;
    padding: 8px 14px;
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--r-md);
  }
  .total-tile .v { font-family: var(--mono); font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .total-tile .k { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
  .total-tile.hot .v { color: var(--accent); }
  .built-note { margin-left: auto; align-self: center; font-family: var(--mono); font-size: 11px; color: var(--text-3); }

  /* ============ board ============ */
  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(280px, 1fr));
    gap: 16px;
    padding: 16px 20px 48px;
    max-width: 1560px; margin: 0 auto;
    align-items: start;
  }
  .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .col-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    border-radius: var(--r-md);
    background: var(--bg-raise);
    border: 1px solid var(--border-soft);
    position: sticky; top: 72px; z-index: 10;
  }
  .col-head h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); }
  .col-count {
    margin-left: auto;
    font-family: var(--mono); font-size: 11.5px; font-weight: 700;
    min-width: 22px; height: 22px; padding: 0 6px;
    display: grid; place-items: center;
    border-radius: 11px;
    background: var(--surface-3); color: var(--text-2);
  }
  .col-dot { width: 8px; height: 8px; border-radius: 50%; }

  .col.needs .col-head { background: linear-gradient(180deg, rgba(245,166,35,.10), var(--bg-raise)); border-color: var(--accent-line); }
  .col.needs .col-head h2 { color: var(--accent); }
  .col.needs .col-count { background: var(--accent); color: #14100a; }
  .col.needs .col-dot { background: var(--accent); box-shadow: 0 0 8px rgba(245,166,35,.6); }
  .col.working .col-dot { background: var(--work); }
  .col.waiting .col-dot { background: var(--wait); }
  .col.stale .col-dot { background: var(--stale); }
  .col.stale .col-head h2, .col.stale .col-count { color: var(--text-3); }

  .col-empty {
    padding: 22px 14px; text-align: center;
    color: var(--text-3); font-size: 12.5px;
    border: 1px dashed var(--border); border-radius: var(--r-md);
  }

  /* ============ card ============ */
  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    display: flex;
    overflow: hidden;
    transition: border-color .15s ease;
  }
  .card:hover { border-color: var(--surface-3); }
  .card-main { flex: 1 1 auto; min-width: 0; padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 8px; }

  .col.needs .card { border-color: var(--accent-line); background: linear-gradient(180deg, rgba(245,166,35,.05), var(--surface) 55%); }
  .col.needs .card::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
    background: var(--accent); border-radius: 3px 0 0 3px;
  }
  .col.stale .card { opacity: .68; filter: saturate(.7); }
  .col.stale .card:hover { opacity: .92; filter: saturate(1); }

  /* header row */
  .c-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .c-proj { font-weight: 700; font-size: 13.5px; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-host {
    display: flex; align-items: center; gap: 4px;
    font-family: var(--mono); font-size: 10.5px; color: var(--text-3);
    background: var(--bg-raise); border: 1px solid var(--border-soft);
    padding: 3px 7px; border-radius: 6px; flex: none;
  }
  .c-host.host-dead { color: var(--dead); border-color: rgba(224,86,79,.4); }
  .c-status { margin-left: auto; flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; }
  .c-status.working { color: var(--work); background: var(--work-dim); }
  .c-status.working svg { animation: workpulse 2.2s ease-in-out infinite; }
  @keyframes workpulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .c-status.needs_input { color: var(--accent); background: var(--accent-dim); }
  .c-status.waiting { color: var(--wait); background: var(--wait-dim); }
  .c-status.stale { color: var(--stale); background: rgba(86,96,120,.12); }

  /* summary block */
  .c-summary {
    display: flex; flex-direction: column; gap: 4px;
    padding: 8px 10px;
    background: var(--bg-raise);
    border: 1px solid var(--border-soft);
    border-radius: var(--r-md);
    cursor: pointer;
  }
  .s-line { display: flex; gap: 7px; min-width: 0; align-items: baseline; }
  .s-label {
    flex: none; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em;
    color: var(--text-3); width: 34px; padding-top: 1px;
  }
  .s-line.now .s-label { color: var(--work); }
  .col.needs .s-line.next .s-label { color: var(--accent); }
  .s-text { font-size: 12.5px; color: var(--text-2); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s-line.now .s-text { color: var(--text); }
  .card.expanded .s-text { white-space: normal; }
  .c-detail { display: none; padding-top: 6px; margin-top: 4px; border-top: 1px dashed var(--border); }
  .card.expanded .c-detail { display: block; }
  .c-detail .d-note { font-size: 12px; color: var(--text-2); padding: 6px 8px; background: var(--surface-2); border-radius: 6px; margin-bottom: 6px; }
  .c-detail .d-note.warn { color: #f0b8a0; background: rgba(224,86,79,.08); }
  .c-detail .d-sid { font-family: var(--mono); font-size: 10px; color: var(--text-3); word-break: break-all; }
  .c-prov { font-size: 10px; color: var(--text-3); display: flex; gap: 5px; align-items: center; padding-top: 2px; }

  /* numerics row */
  .c-nums { display: flex; flex-wrap: wrap; gap: 5px; }
  .num-chip {
    display: flex; align-items: center; gap: 4px;
    font-family: var(--mono); font-size: 10.5px; color: var(--text-2);
    background: var(--surface-2); border: 1px solid var(--border-soft);
    padding: 3px 7px; border-radius: 6px;
  }
  .num-chip svg { color: var(--text-3); }
  .num-chip.ctx-high { color: #f0b8a0; border-color: rgba(224,86,79,.35); }
  .num-chip.ctx-high svg { color: var(--dead); }
  .num-chip b { font-weight: 600; }

  /* actions row */
  .c-actions { display: flex; align-items: center; gap: 8px; margin-top: 2px; flex-wrap: wrap; }
  .btn-resume {
    display: flex; align-items: center; gap: 7px;
    min-height: 34px; padding: 0 12px;
    background: var(--surface-3); border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: .01em;
    transition: background .14s ease, border-color .14s ease;
  }
  .btn-resume:hover:not(:disabled) { background: #273349; border-color: #33415c; }
  .btn-resume:disabled { opacity: .45; cursor: not-allowed; }
  .col.needs .btn-resume { background: var(--accent); color: #171104; border-color: transparent; }
  .col.needs .btn-resume:hover:not(:disabled) { background: #ffb63c; }
  .tier-badge {
    font-family: var(--mono); font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
    padding: 2px 6px; border-radius: 5px;
  }
  .tier-attach { background: var(--ok-dim); color: var(--ok); }
  .tier-resume { background: var(--work-dim); color: var(--work); }
  .tier-revive { background: rgba(224,86,79,.16); color: #ec8a80; }
  .col.needs .tier-badge { background: rgba(0,0,0,.18); color: #171104; }
  .btn-repair {
    display: flex; align-items: center; gap: 6px;
    min-height: 34px; padding: 0 12px;
    border: 1px solid rgba(224,86,79,.45); border-radius: 8px;
    color: #ec8a80; font-size: 12px; font-weight: 700;
    background: var(--dead-dim);
  }
  .btn-repair:hover { background: rgba(224,86,79,.22); }
  .repair-hint { font-size: 10.5px; color: var(--text-3); flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }

  /* footer */
  .c-foot {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding-top: 8px; border-top: 1px solid var(--border-soft);
    font-size: 10.5px; color: var(--text-3);
  }
  .f-chip {
    display: flex; align-items: center; gap: 4px;
    font-family: var(--mono); font-size: 10px;
    background: var(--bg-raise); border: 1px solid var(--border-soft);
    padding: 2px 7px; border-radius: 5px;
    max-width: 170px;
  }
  .f-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-chip.model { text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
  .f-chip.model.opus { color: #b8a8e8; }
  .f-chip.model.sonnet { color: #8fb8d8; }
  .f-meta { margin-left: auto; display: flex; gap: 8px; font-family: var(--mono); font-size: 10px; }
  .f-meta .sumage { color: var(--text-3); }
  .f-meta .sumage.old { color: #b98d5e; }

  /* LIVE right-edge strip */
  .live-strip {
    flex: none; width: 44px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    background: var(--surface-2);
    border-left: 1px solid var(--border-soft);
    color: var(--text-3);
    transition: background .14s ease, color .14s ease;
  }
  .live-strip:hover { background: var(--surface-3); color: var(--work); }
  .live-strip .live-word {
    writing-mode: vertical-rl; transform: rotate(180deg);
    font-size: 9px; font-weight: 800; letter-spacing: .28em; text-transform: uppercase;
    font-family: var(--mono);
  }
  .card[data-status="working"] .live-strip .live-word { color: var(--work); }
  .card[data-status="working"] .live-strip svg { color: var(--work); animation: workpulse 2.2s ease-in-out infinite; }

  /* ============ drawer ============ */
  .drawer-backdrop {
    position: fixed; inset: 0; z-index: 80;
    background: rgba(5,7,11,.55);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 90;
    width: min(440px, 100vw);
    background: #0d1119;
    border-left: 1px solid var(--border);
    box-shadow: -16px 0 48px rgba(0,0,0,.5);
    transform: translateX(102%);
    transition: transform .24s cubic-bezier(.32,.72,.28,1);
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-soft);
    flex: none;
  }
  .drawer-head .live-pill {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 10px; font-weight: 800; letter-spacing: .18em;
    color: var(--work); background: var(--work-dim);
    padding: 4px 9px; border-radius: 6px;
  }
  .drawer-head .live-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--work); animation: deadpulse 1.3s ease-in-out infinite; }
  .drawer-head .d-title { min-width: 0; }
  .drawer-head .d-title b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drawer-head .d-title span { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  .drawer-close {
    margin-left: auto; flex: none;
    width: 44px; height: 44px; display: grid; place-items: center;
    border-radius: 10px; color: var(--text-3);
  }
  .drawer-close:hover { background: var(--surface-2); color: var(--text); }
  .drawer-sub {
    padding: 8px 16px; flex: none;
    font-family: var(--mono); font-size: 10.5px; color: var(--text-3);
    border-bottom: 1px solid var(--border-soft);
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .transcript {
    flex: 1 1 auto; overflow-y: auto;
    padding: 12px 16px 20px;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.65;
  }
  .t-line { padding: 2px 0; color: var(--text-2); word-break: break-word; animation: linein .25s ease; }
  @keyframes linein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .t-line .t-ts { color: var(--text-3); margin-right: 8px; font-size: 10px; }
  .t-line.t-tool { color: #8fb8d8; }
  .t-line.t-tool::before { content: "⏺ "; color: var(--work); }
  .t-line.t-out { color: var(--text-3); padding-left: 18px; }
  .t-line.t-out::before { content: "⎿ "; color: var(--text-3); }
  .t-line.t-asst { color: var(--text); }
  .t-line.t-think { color: #7d88a3; font-style: italic; }
  .t-cursor { display: inline-block; width: 7px; height: 13px; background: var(--work); vertical-align: -2px; animation: workpulse 1s steps(2) infinite; }
  .drawer-foot {
    flex: none; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border-soft);
    font-size: 10.5px; color: var(--text-3);
    display: flex; align-items: center; gap: 8px;
  }

  /* ============ responsive ============ */
  @media (max-width: 1180px) {
    .board { grid-template-columns: repeat(2, minmax(280px, 1fr)); }
  }
  @media (max-width: 720px) {
    .topbar { padding: 10px 12px; gap: 10px; }
    .topbar-spacer { display: none; }
    .nodes { width: 100%; order: 3; }
    .node-chip { flex: 1 1 0; justify-content: center; padding: 0 6px; }
    .node-chip::after { right: auto; left: 50%; transform: translate(-50%, -3px); }
    .node-chip:hover::after, .node-chip:focus-visible::after { transform: translate(-50%, 0); }
    .totals { padding: 12px 12px 0; }
    .built-note { display: none; }
    .board { grid-template-columns: 1fr; padding: 12px 12px 40px; gap: 20px; }
    .col-head { position: static; }
    .btn-resume, .btn-repair { min-height: 44px; }
    .live-strip { width: 48px; }
    .c-summary { min-height: 44px; }
    [data-tip]::after { display: none; }  /* hover tooltips off on touch; tier badge + expand carry the info */
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#f5a623" stroke-width="1.5" stroke-linecap="round">
        <rect x="1.5" y="2" width="4" height="12" rx="1"/>
        <rect x="6.5" y="2" width="4" height="8" rx="1" stroke="#4fa3c7"/>
        <rect x="11.5" y="2" width="3" height="10" rx="1" stroke="#8a93b2"/>
      </svg>
    </div>
    <div>
      <h1>FleetBoard</h1>
      <div class="sub">fleet-sessions mesh &middot; served from mini</div>
    </div>
  </div>

function colOf(s) {
  if (s.status === 'needs_input') return 'needs';
  if (s.stale) return 'stale';
  return s.status; /* working | waiting */
}

/* ================= node chips ================= */
function nodeTip(name, n) {
  if (n.liveness === 'dead') {
    return name + ' publisher DEAD — last publish ' + fmtAgeSec(n.publishAgeSec) +
      ' ago (silently dead since Jul 5). The host may still be reachable, but no session data is flowing: this is the false-healthy bug the freshness chip exists to catch. ' +
      n.sessions + ' sessions shown from last-known snapshot.';
  }
  return name + ' publisher fresh — last publish ' + fmtAgeSec(n.publishAgeSec) + ' ago · ' + n.sessions + ' sessions reporting.';
}
function renderNodes() {
  $('#nodeChips').innerHTML = Object.entries(FLEET.nodes).map(([name, n]) =>
    '<div class="node-chip ' + esc(n.liveness) + '" role="listitem" tabindex="0" data-tip="' + esc(nodeTip(name, n)) + '">' +
      '<span class="dot"></span>' +
      '<span style="color:var(--text-3)">' + HOST_ICON[name] + '</span>' +
      '<span class="nname">' + esc(name) + '</span>' +
      '<span class="age">' + (n.liveness === 'dead' ? 'DEAD · ' : '') + fmtAgeSec(n.publishAgeSec) + '</span>' +
    '</div>'
  ).join('');
}

/* ================= totals ================= */
function renderTotals() {
  const t = FLEET.totals;
  const needs = state.sessions.filter(s => s.status === 'needs_input').length;
  const tokens = state.sessions.reduce((a,s) => a + s.tokens, 0) + (t.tokensToday - FLEET.sessions.reduce((a,s)=>a+s.tokens,0));
  const cost = state.sessions.reduce((a,s) => a + s.cost, 0) + (t.estCostToday - FLEET.sessions.reduce((a,s)=>a+s.cost,0));
  $('#totals').innerHTML =
    tile(state.sessions.length, 'sessions') +
    tile(needs, 'need you', needs > 0) +
    tile(fmtTokens(tokens), 'tokens today') +
    tile(fmtMoney(cost), 'est cost today') +
    '<span class="built-note">snapshot built ' + esc(FLEET.builtAt.replace('T', ' ').slice(0, 16)) + ' · schema ' + esc(FLEET.schema) + '</span>';
  function tile(v, k, hot) {
    return '<div class="total-tile' + (hot ? ' hot' : '') + '"><span class="v">' + v + '</span><span class="k">' + k + '</span></div>';
  }
}

/* ================= resume wiring ================= */
function resumeCmd(s) {
  const sid = shortSid(s.session_id);
  if (!s.worktreeOk) {
    return 'BLOCKED — worktree missing. Repair runs: git worktree add ~/.omnara/worktrees/' + s.project + '/' + s.branch.split('/').pop() + ' ' + s.branch + ' → then claude --resume ' + sid;
  }
  if (s.resumeTier === 'attach') {
    return 'omnara attach → ' + s.host + ' · claude --resume ' + sid + ' — process alive, reattaches the running session.';
  }
  if (s.resumeTier === 'revive') {
    return '/revive → ' + s.host + ' · distill transcript + fork fresh session off ' + s.branch + ' HEAD. Direct --resume would hit "Prompt is too long" at ' + s.contextPct + '% context.';
  }
  return 'ssh ' + s.host + ' · cd worktree ' + s.project + '/' + s.branch.split('/').pop() + ' · claude --resume ' + sid + ' — restores conversation; env flags NOT restored.';
}

    { id: 'stale',   title: 'Stale',     empty: 'Nothing older than 2h. Clean fleet.' }
  ];
  $('#board').innerHTML = cols.map(c => {
    const items = state.sessions.filter(s => colOf(s) === c.id);
    return '<section class="col ' + c.id + '" aria-label="' + c.title + ' column">' +
      '<div class="col-head"><span class="col-dot"></span><h2>' + c.title + '</h2><span class="col-count">' + items.length + '</span></div>' +
      (items.length ? items.map(cardHTML).join('') : '<div class="col-empty">' + c.empty + '</div>') +
    '</section>';
  }).join('');
  bindCardEvents();
}

function cardHTML(s) {
  const col = colOf(s);
  const statusKey = col === 'stale' ? 'stale' : s.status;
  const hostDead = FLEET.nodes[s.host] && FLEET.nodes[s.host].liveness === 'dead';
  const expanded = state.expanded.has(s.session_id);
  const sumOld = s.summaryAgeMin >= 30;
  const ctxHigh = s.contextPct >= 80;

  const nums = [
    [ICONS.gauge, s.contextPct + '%', 'context used', ctxHigh],
    [ICONS.coins, fmtTokens(s.tokens), 'tokens'],
    [ICONS.clock, s.elapsedActive, 'active'],
    [ICONS.zzz, s.idle, 'idle'],
    [ICONS.msg, String(s.msgs), 'msgs'],
    [ICONS.dollar, fmtMoney(s.cost).slice(1), 'est cost']

    '<span class="num-chip' + (warn ? ' ctx-high' : '') + '" title="' + label + '">' + ic + '<b>' + esc(v) + '</b></span>'
  ).join('');

  const actions = s.worktreeOk
    ? '<button class="btn-resume" data-act="resume" data-sid="' + s.session_id + '" data-tip="' + esc(resumeCmd(s)) + '">' +
        ICONS.resume + '<span>Resume</span>' +
        '<span class="tier-badge tier-' + s.resumeTier + '">' + TIER_LABEL[s.resumeTier] + '</span>' +
      '</button>'
    : '<button class="btn-resume" disabled data-tip="' + esc(resumeCmd(s)) + '">' + ICONS.resume + '<span>Resume</span><span class="tier-badge tier-resume">resume</span></button>' +
      '<button class="btn-repair" data-act="repair" data-sid="' + s.session_id + '" data-tip="' + esc(resumeCmd(s)) + '">' + ICONS.wrench + '<span>Repair</span></button>' +
      '<span class="repair-hint">worktree missing</span>';

  return '<article class="card' + (expanded ? ' expanded' : '') + '" data-sid="' + s.session_id + '" data-status="' + statusKey + '">' +
    '<div class="card-main">' +
      '<div class="c-head">' +
        '<span class="c-proj">' + esc(s.project) + '</span>' +
        '<span class="c-host' + (hostDead ? ' host-dead' : '') + '" title="' + esc(s.host) + (hostDead ? ' — publisher dead, data is last-known' : '') + '">' +
          HOST_ICON[s.host] + esc(s.host) + '</span>' +
        '<span class="c-status ' + statusKey + '" title="' + esc(statusKey.replace('_', ' ')) + '">' + STATUS_ICON[statusKey] + '</span>' +
      '</div>' +
      '<div class="c-summary" data-act="expand" data-sid="' + s.session_id + '" role="button" tabindex="0" aria-expanded="' + expanded + '" aria-label="Session summary, tap to expand">' +
        sLine('now', 'Now', s.summary.now) +
        sLine('next', 'Next', s.summary.next) +
        sLine('goal', 'Goal', s.summary.goal) +
        '<div class="c-detail">' +
          (s.note ? '<div class="d-note' + (col === 'stale' || !s.worktreeOk || s.resumeTier === 'revive' ? ' warn' : '') + '">' + esc(s.note) + '</div>' : '') +
          (s.source ? '<div class="d-note">source: ' + esc(s.source) + '</div>' : '') +
          '<div class="d-sid">session ' + esc(s.session_id) + '</div>' +
        '</div>' +
        '<div class="c-prov">' + ICONS.doc + '<span>AI summary · derived from transcript · ' + fmtSumAge(s.summaryAgeMin) + ' old</span></div>' +
      '</div>' +
      '<div class="c-nums">' + nums + '</div>' +
      '<div class="c-actions">' + actions + '</div>' +
      '<div class="c-foot">' +
        '<span class="f-chip" title="branch / worktree">' + ICONS.branch + '<span>' + esc(s.branch) + '</span></span>' +
        '<span class="f-chip model ' + esc(s.model) + '">' + ICONS.chip + '<span>' + esc(s.model) + '</span></span>' +
        '<span class="f-meta"><span>' + esc(s.lastActivity) + '</span><span class="sumage' + (sumOld ? ' old' : '') + '">summary ' + fmtSumAge(s.summaryAgeMin) + ' old</span></span>' +
      '</div>' +
    '</div>' +
    '<button class="live-strip" data-act="live" data-sid="' + s.session_id + '" aria-label="Open live view of ' + esc(s.project) + '">' +
      ICONS.eye + '<span class="live-word">Live</span>' +
    '</button>' +
  '</article>';

  function sLine(cls, label, text) {
    return '<div class="s-line ' + cls + '"><span class="s-label">' + label + '</span><span class="s-text">' + esc(text) + '</span></div>';
  }
}

function bindCardEvents() {
  document.querySelectorAll('[data-act]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const sid = el.dataset.sid;
      const act = el.dataset.act;
      if (act === 'expand') { toggleExpand(sid); }
      else if (act === 'live') { openDrawer(sid); }
      else if (act === 'resume' || act === 'repair') { flashBtn(el); }
    };
    if (el.dataset.act === 'expand') {
      el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleExpand(el.dataset.sid); } };
    }
  });
}
function toggleExpand(sid) {
  state.expanded.has(sid) ? state.expanded.delete(sid) : state.expanded.add(sid);
  renderBoard();
}
function flashBtn(el) {
  el.style.transform = 'scale(.97)';
  setTimeout(() => { el.style.transform = ''; }, 120);
}

let drawerTimer = null;
let drawerIdx = 0;

function openDrawer(sid) {
  const s = state.sessions.find(x => x.session_id === sid);
  if (!s) return;
  state.drawerSid = sid;
  $('#drawerTitle').textContent = s.project + ' · ' + s.branch;
  $('#drawerMeta').textContent = s.host + ' · ' + s.model + ' · ' + shortSid(s.session_id);
  $('#drawerSub').innerHTML =
    '<span>ctx <b style="color:var(--text-2)">' + s.contextPct + '%</b></span>' +
    '<span>' + fmtTokens(s.tokens) + ' tok</span>' +
    '<span>' + s.msgs + ' msgs</span>' +
    '<span>last activity ' + esc(s.lastActivity) + '</span>';
  const t = $('#transcript');
  t.innerHTML = '';
  drawerIdx = 0;
  $('#drawer').classList.add('open');
  $('#drawerBackdrop').classList.add('open');
  streamNext();
  clearInterval(drawerTimer);
  drawerTimer = setInterval(streamNext, state.demo ? 700 : 1100);
}
function streamNext() {
  const sid = state.drawerSid;
  if (!sid) return;
  const lines = TRANSCRIPTS[sid] || [];
  const s = state.sessions.find(x => x.session_id === sid);
  const t = $('#transcript');
  const cursor = t.querySelector('.t-cursor-line');
  if (cursor) cursor.remove();
  if (drawerIdx < lines.length) {
    const [kind, text] = lines[drawerIdx++];
    const d = document.createElement('div');
    d.className = 't-line t-' + kind;
    const ts = new Date(Date.now() - (lines.length - drawerIdx) * 9000);
    d.innerHTML = '<span class="t-ts">' + String(ts.getHours()).padStart(2,'0') + ':' + String(ts.getMinutes()).padStart(2,'0') + ':' + String(ts.getSeconds()).padStart(2,'0') + '</span>' + esc(text);
    t.appendChild(d);
  } else if (s && (s.status === 'working')) {
    /* live sessions keep ticking with plausible follow-on lines */
    const extras = [
      ['out', 'tokens ' + fmtTokens(s.tokens) + ' · ctx ' + s.contextPct + '%'],
      ['tool', 'Bash(git status --short)'],
      ['out', 'working tree clean'],
      ['think', 'Continuing…']
    ];
    const [kind, text] = extras[Math.floor(Math.random() * extras.length)];
    const d = document.createElement('div');
    d.className = 't-line t-' + kind;
    const ts = new Date();
    d.innerHTML = '<span class="t-ts">' + String(ts.getHours()).padStart(2,'0') + ':' + String(ts.getMinutes()).padStart(2,'0') + ':' + String(ts.getSeconds()).padStart(2,'0') + '</span>' + esc(text);
    t.appendChild(d);
  } else {
    clearInterval(drawerTimer);
    drawerTimer = null;
  }
  if (s && s.status === 'working') {
    const c = document.createElement('div');
    c.className = 't-line t-cursor-line';
    c.innerHTML = '<span class="t-ts">&nbsp;</span><span class="t-cursor"></span>';
    t.appendChild(c);
  }
  t.scrollTop = t.scrollHeight;
}
function closeDrawer() {
  state.drawerSid = null;
  clearInterval(drawerTimer);
  drawerTimer = null;
  $('#drawer').classList.remove('open');
  $('#drawerBackdrop').classList.remove('open');
}
$('#drawerClose').onclick = closeDrawer;
$('#drawerBackdrop').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* ================= demo mode ================= */
let demoTimer = null;
let demoTick = 0;

$('#demoToggle').onclick = () => {
  state.demo = !state.demo;
  const el = $('#demoToggle');
  el.classList.toggle('on', state.demo);
  el.setAttribute('aria-pressed', String(state.demo));
  if (state.demo) {
    demoTimer = setInterval(runDemoTick, 1400);
  } else {
    clearInterval(demoTimer);
    demoTimer = null;
  }
  if (drawerTimer) { clearInterval(drawerTimer); drawerTimer = setInterval(streamNext, state.demo ? 700 : 1100); }
};

function runDemoTick() {
  demoTick++;
  for (const s of state.sessions) {
    if (s.status === 'working' && !s.stale) {
      s.tokens += 900 + Math.floor(Math.random() * 3200);
      s.cost += 0.004 + Math.random() * 0.012;
      if (Math.random() < 0.3) s.msgs += 1;
      if (Math.random() < 0.12 && s.contextPct < 97) s.contextPct += 1;
      s.summaryAgeMin = Math.random() < 0.2 ? 0 : s.summaryAgeMin;
      s.lastActivity = 'just now';
    }
  }
  /* every ~8 ticks the launchd triage session finishes its pass and idles, then wakes again */
  if (demoTick % 8 === 0) {
    const sage = state.sessions.find(s => s.session_id === 'ccd6b7c8-6666-4fff-8aaa-000000000006');
    if (sage) {
      if (sage.status === 'working') {
        sage.status = 'waiting'; sage.idle = '1m'; sage.lastActivity = '1m ago';
        sage.summary.now = 'Hourly pass complete: inbox at zero, 1 draft staged awaiting approval';
      } else {
        sage.status = 'working'; sage.idle = '0m'; sage.lastActivity = 'just now';
        sage.summary.now = 'Hourly GM inbox triage pass: 3 new threads classified, 1 draft staged for approval';
      }
    }
  }
  /* every ~13 ticks the kanban-proposal session pauses for review, then resumes */
  if (demoTick % 13 === 0) {
    const misc = state.sessions.find(s => s.session_id === 'a8187667-686c-4342-85e7-b382a6af6fdd');
    if (misc) {
      misc.status = misc.status === 'working' ? 'waiting' : 'working';
      misc.idle = misc.status === 'waiting' ? '1m' : '0m';
    }
  }
  renderTotals();
  renderBoard();
}
