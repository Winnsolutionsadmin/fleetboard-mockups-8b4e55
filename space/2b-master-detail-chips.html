<!-- fleetboard space view · concept 2b master-detail-chips · Round-2 depth on 01 master-detail: a chip system where every state reads by glyph shape + color + short word, a fixed two-row session card-let, a pulsing red rail on needs_input, muted ended cards with the Resume tier, a tappable DONE-WHEN contract chip, and a ? legend in the header · phone-first, light theme, self-contained -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FleetBoard — Space · master-detail-chips</title>
<style>
:root{
  --brand:#7b68ee; --brand-dark:#5f4dd0; --brand-soft:#efecfd;
  --ink:#2a2e43; --ink-soft:#6b7186; --ink-faint:#9aa1b5;
  --line:#e6e9f2; --ws:#fafbfc; --column:#f3f4f7; --card:#fff;
  --c-needs:#f0555f; --c-needs-bg:#fdeef0;
  --c-work:#4c9aff;  --c-work-bg:#eef5ff;
  --c-wait:#f0a92e;  --c-wait-bg:#fdf6ea;
  --c-stale:#98a1b3; --c-stale-bg:#f3f4f7;
  --ok:#27ae60; --warn:#f0a92e; --bad:#e5484d;
  --shadow:0 1px 3px rgba(42,46,67,.08), 0 1px 2px rgba(42,46,67,.05);
  --h-mactop:#5f4dd0; --h-mini:#0e9994; --h-macbook:#0073ea;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --rail-w:256px;
  --tap:36px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.4;color:var(--ink);background:var(--ws);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.01em}

/* ── shell ─────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100dvh;height:100vh}
.rail{border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
.main{min-width:0;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}

/* ── rail ──────────────────────────────────────────── */
.rail-brand{display:flex;align-items:center;gap:9px;padding:14px 16px 10px;font-weight:700;font-size:13px;letter-spacing:.02em;color:var(--ink)}
.rail-brand .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));display:grid;place-items:center}
.rail-brand .logo svg{width:13px;height:13px}
.rail-brand small{font-weight:500;color:var(--ink-faint);margin-left:auto}
.rail-section{padding:6px 10px 2px 16px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.spaces{display:flex;flex-direction:column;gap:2px;padding:4px 8px 10px}
.space-btn{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 8px;border-radius:8px;text-align:left;width:100%}
.space-btn:hover{background:var(--column)}
.space-btn[aria-current="true"]{background:var(--brand-soft);color:var(--brand-dark)}
.space-key{min-width:30px;height:24px;padding:0 6px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--column);color:var(--ink-soft);flex:none;letter-spacing:.01em}
.space-btn[aria-current="true"] .space-key{background:var(--brand);color:#fff}
.space-btn .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.space-btn .ct{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.space-btn .ct b{color:var(--c-needs);font-weight:700}
.rail-tree{flex:1;overflow:auto;padding:0 8px 16px;border-top:1px solid var(--line)}
.tree-folder{margin-top:8px}
.tree-folder-h{display:flex;align-items:center;gap:7px;padding:6px 8px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.tree-folder-h svg{width:14px;height:14px;color:var(--ink-faint)}
.tree-list{display:flex;align-items:center;gap:8px;min-height:34px;padding:4px 8px 4px 28px;border-radius:7px;width:100%;text-align:left;color:var(--ink)}
.tree-list:hover{background:var(--column)}
.tree-list .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tree-list .ct{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.tree-list .ct b{color:var(--c-needs)}
.tree-list .ct.empty{color:var(--ink-faint);font-style:italic}
.tree-unlinked{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}

/* ── header strip ──────────────────────────────────── */
.hdr{position:sticky;top:0;z-index:20;background:rgba(250,251,252,.92);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.hdr-top{display:flex;align-items:center;gap:12px;padding:14px 24px 0}
.hdr-title{display:flex;align-items:baseline;gap:10px;min-width:0}
.hdr-title h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-title .built{font-size:12px;color:var(--ink-faint);white-space:nowrap}
.legend-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-weight:700;font-size:14px;display:grid;place-items:center;flex:none;box-shadow:var(--shadow);margin-left:auto}
.legend-btn:hover,.legend-btn[aria-expanded="true"]{background:var(--brand-soft);color:var(--brand-dark);border-color:#d6cffb}
.seg{display:none}
.hdr-counts{display:flex;gap:6px;align-items:stretch;padding:10px 24px 0;overflow-x:auto;scrollbar-width:none}
.hdr-counts::-webkit-scrollbar{display:none}
.count{flex:none;display:flex;flex-direction:column;justify-content:center;min-width:92px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:var(--shadow);text-align:left}
.count b{font-size:20px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.count span{font-size:11px;color:var(--ink-soft);white-space:nowrap}
.count.hot b{color:var(--c-needs)}
.count.hot{border-color:#f7c5c9;background:var(--c-needs-bg)}
.count.live b{color:var(--c-work)}
.count.parked b{color:var(--c-wait)}
.count.done b{color:var(--ok)}
.hdr-hosts{display:flex;gap:6px;align-items:center;padding:10px 24px 12px;flex-wrap:wrap}
.hdr-hosts .lbl{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-right:2px}
.host-chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 10px 3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600;color:var(--ink-soft)}
.host-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(39,174,96,.15)}
.host-chip .nm{color:var(--ink)}
.host-chip .age{font-weight:500;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.host-chip.stale{border-style:dashed;background:var(--c-stale-bg)}
.host-chip.stale .dot{background:var(--warn);box-shadow:0 0 0 3px rgba(240,169,46,.18)}
.host-chip.dead .dot{background:var(--bad);box-shadow:0 0 0 3px rgba(229,72,77,.18)}
.host-chip .why{position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:max-content;max-width:260px;padding:8px 10px;border-radius:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:500;line-height:1.35;box-shadow:0 6px 20px rgba(42,46,67,.2);display:none;text-align:left}
.host-chip.open .why,.host-chip:hover .why{display:block}
@media (hover:none){.host-chip:hover .why{display:none}.host-chip.open .why{display:block}}

/* ── content ───────────────────────────────────────── */
.content{padding:16px 24px 120px;max-width:1120px}
.folder{margin-top:20px}
.folder:first-child{margin-top:4px}
.folder-h{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.folder-h svg{width:14px;height:14px}
.folder-h .rule{flex:1;height:1px;background:var(--line)}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;scroll-margin-top:190px}
.list-h{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:#fff}
.list-h h3{margin:0;font-size:14px;font-weight:700}
.list-h .ct{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.list-h .ct b{color:var(--c-needs);font-weight:600}
.list-h .spacer{flex:1}
.list-h .pill{font-size:11px;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.list-empty{padding:22px 16px;color:var(--ink-faint);font-size:13px;display:flex;gap:10px;align-items:center}
.list-empty .z{width:28px;height:28px;border-radius:8px;background:var(--column);display:grid;place-items:center;color:var(--ink-faint)}

/* task */
.task{border-top:1px solid var(--line);position:relative}
.task:first-of-type{border-top:0}
.task.is-hot{background:linear-gradient(90deg,var(--c-needs-bg) 0,rgba(253,238,240,0) 34%);box-shadow:inset 3px 0 0 var(--c-needs)}
.task.is-dispatching{background:linear-gradient(90deg,var(--brand-soft) 0,rgba(239,236,253,0) 40%);box-shadow:inset 3px 0 0 var(--brand)}
.task-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px 10px}
.prio{width:20px;height:20px;margin-top:1px;display:grid;place-items:center;flex:none}
.prio svg{width:14px;height:14px}
.prio.p1{color:var(--bad)}.prio.p2{color:var(--brand)}.prio.p3{color:var(--ink-faint)}
.task-main{min-width:0}
.task-name{margin:0;font-size:14px;font-weight:600;line-height:1.35;letter-spacing:-.005em}
.task-name a{text-decoration:none}
.task-name a:hover{text-decoration:underline;text-decoration-color:var(--brand)}
.task-meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:7px;font-size:12px;color:var(--ink-soft)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft)}
.st .sq{width:8px;height:8px;border-radius:2px;background:var(--ink-faint)}
.st.todo .sq{background:#c9cede}.st.prog .sq{background:var(--c-work)}.st.pdone .sq{background:var(--ok)}

/* ── agent_state chips: glyph square + tint + short word.
      Six different glyph SHAPES so the state reads without color;
      "parked" is the only solid fill, "out of scope" the only dashed one. ── */
.as{position:relative;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px 0 3px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.01em;white-space:nowrap;border:1px solid var(--as-line);background:var(--as-bg);color:var(--as-ink)}
.as .g{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:var(--as-ink);color:#fff;flex:none;font-size:12px;font-weight:800;line-height:1}
.as .g svg{width:11px;height:11px}
.as-needs-triage{--as-bg:var(--c-wait-bg);--as-ink:#9a6408;--as-line:#f6dfae}
.as-ready-for-human{--as-bg:var(--c-needs-bg);--as-ink:#b93540;--as-line:#f7c5c9}
.as-ready-for-agent{--as-bg:var(--c-work-bg);--as-ink:#1e64c8;--as-line:#c7ddff}
.as-in-progress{--as-bg:#e8f7ee;--as-ink:#1d7a43;--as-line:#bfe6cd}
.as-needs-info{--as-bg:var(--c-wait);--as-ink:#fff;--as-line:var(--c-wait)}
.as-needs-info .g{background:#fff;color:var(--c-wait)}
.as-out-of-scope{--as-bg:var(--c-stale-bg);--as-ink:var(--ink-soft);--as-line:var(--c-stale);border-style:dashed}
.as-out-of-scope .g{background:var(--ink-faint)}

/* ── session status pills: round glyph + tint + word.
      needs_input is the only solid red; stale the only dashed; ended the only grey. ── */
.ss{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px 0 4px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--ss-line);background:var(--ss-bg);color:var(--ss-ink);white-space:nowrap}
.ss .g{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;background:var(--ss-ink);color:#fff;flex:none;font-size:10px;font-weight:800;line-height:1}
.ss .g svg{width:9px;height:9px}
.ss-needs_input{--ss-bg:var(--c-needs);--ss-ink:#fff;--ss-line:var(--c-needs)}
.ss-needs_input .g{background:#fff;color:var(--c-needs);animation:ping 1.2s ease-in-out infinite}
.ss-working{--ss-bg:var(--c-work-bg);--ss-ink:#1e64c8;--ss-line:#c7ddff}
.ss-working .g svg{animation:spin 1.6s linear infinite}
.ss-waiting{--ss-bg:var(--c-wait-bg);--ss-ink:#9a6408;--ss-line:#f6dfae}
.ss-stale{--ss-bg:var(--c-stale-bg);--ss-ink:var(--ink-soft);--ss-line:var(--c-stale);border-style:dashed}
.ss-ended{--ss-bg:var(--column);--ss-ink:var(--ink-faint);--ss-line:var(--line)}
@keyframes ping{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}50%{box-shadow:0 0 0 4px rgba(255,255,255,0)}}
@keyframes spin{to{transform:rotate(360deg)}}

.due{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.due svg{width:12px;height:12px}
.due.over{color:var(--bad);font-weight:600}
.due.today{color:var(--warn);font-weight:600}
.due.none{color:var(--ink-faint)}

/* DONE-WHEN mini contract chip — a button; tap shows the contract text */
.dwc{position:relative;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 6px 0 3px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.04em;border:1px solid;background:#fff;white-space:nowrap}
.dwc .g{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;color:#fff;flex:none}
.dwc .g svg{width:9px;height:9px}
.dwc .cv{width:9px;height:9px;opacity:.6}
.dwc.ok{color:#1d7a43;border-color:#bfe6cd}
.dwc.ok .g{background:var(--ok)}
.dwc.ok:hover{background:#e8f7ee}
.dwc.missing{color:#9a6408;border-color:#f6dfae;border-style:dashed;background:var(--c-wait-bg)}
.dwc.missing .g{background:var(--warn)}
.dwc.missing:hover{background:#fbeccb}
.dwc[aria-expanded="true"]{box-shadow:0 0 0 2px var(--brand-soft)}

.assg{display:inline-flex;align-items:center;gap:5px}
.assg .av{width:16px;height:16px;border-radius:50%;background:var(--brand-soft);color:var(--brand-dark);font-size:9px;font-weight:700;display:grid;place-items:center}
.assg .av.j{background:#ffe9d6;color:#b25a12}
.tid{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.ext{display:inline-flex;align-items:center;gap:3px;color:var(--ink-faint);text-decoration:none}
.ext:hover{color:var(--brand-dark)}
.ext svg{width:11px;height:11px}
.task-act{display:flex;align-items:center;gap:8px;flex:none;padding-top:1px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);white-space:nowrap;transition:background .12s,border-color .12s,transform .06s}
.btn:hover:not(:disabled){background:var(--column)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--brand-dark);border-color:var(--brand-dark)}
.btn.primary:disabled{background:var(--column);border-color:var(--line);color:var(--ink-faint)}
.btn.hot{background:var(--c-needs);border-color:var(--c-needs);color:#fff}
.btn.hot:hover:not(:disabled){background:#d9414b;border-color:#d9414b}
.btn.ghost{border-color:transparent;color:var(--ink-soft)}
.btn.ghost:hover:not(:disabled){color:var(--ink)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px;border-radius:7px}
.btn .tier{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--brand-soft);color:var(--brand-dark)}
.btn .tier.revive{background:var(--c-wait-bg);color:#9a6408;border:1px solid #f6dfae}
.btn .tier.resume{background:var(--c-work-bg);color:#1e64c8;border:1px solid #c7ddff}
.btn .tier.attach{background:#e8f7ee;color:#1d7a43;border:1px solid #bfe6cd}
.hint{font-size:11px;color:var(--ink-faint);white-space:nowrap}
.dispatch-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.dispatching{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);padding:0 12px;border-radius:8px;background:var(--brand-soft);color:var(--brand-dark);font-weight:600;font-size:13px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(95,77,208,.25);border-top-color:var(--brand-dark);animation:spin .8s linear infinite}

/* parked question */
.parked{margin:2px 16px 12px 48px;padding:10px 12px;border-radius:10px;background:var(--c-wait-bg);border:1px solid #f6dfae;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.parked .q-ic{width:22px;height:22px;border-radius:6px;background:var(--c-wait);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.parked .q{font-size:13px;color:var(--ink);line-height:1.45}
.parked .q .lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9a6408;margin-bottom:3px}
.parked .q-act{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.parked textarea{width:100%;min-height:64px;margin-top:8px;padding:8px 10px;border:1px solid #e9cf8f;border-radius:8px;font:inherit;font-size:13px;resize:vertical;background:#fff}
.parked.answered{background:#e8f7ee;border-color:#bfe6cd}
.parked.answered .q-ic{background:var(--ok)}
.parked.answered .lbl{color:#1d7a43}

/* ── sessions inline — the join bracket, then a fixed two-row card-let ── */
.sessions{position:relative;margin:0 16px 12px 24px;padding-left:24px}
.sessions::before{content:"";position:absolute;left:9px;top:-4px;bottom:12px;width:2px;border-radius:2px;background:var(--join,var(--line))}
.sess{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;gap:6px 12px;padding:9px 12px;border:1px solid var(--line);border-left:4px solid var(--join,var(--line));border-radius:10px;background:var(--card);margin-top:6px}
.sess::before{content:"";position:absolute;left:-18px;top:50%;width:13px;height:2px;background:var(--join,var(--line));border-radius:2px}
.sess::after{content:"";position:absolute;left:-7px;top:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:var(--join,var(--line));border:2px solid #fff;box-shadow:0 0 0 1px var(--join,var(--line))}
/* row 1: host · status · model · name */
.sess .r1{grid-column:1;display:flex;flex-wrap:wrap;align-items:center;gap:5px 7px;min-width:0}
.host{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px 0 6px;border-radius:6px;color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--hc,#6b7186)}
.host::before{content:"";width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.85)}
.mdl{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:5px;background:var(--column);color:var(--ink-soft);font-size:11px;font-weight:600}
.sname{font-family:var(--mono);font-size:12px;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src{font-size:11px;color:var(--ink-faint)}
/* row 2: Now line · elapsed/idle · summary age */
.sess .r2{grid-column:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:start;min-width:0}
.now{font-size:13px;color:var(--ink);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.now .k{font-weight:700;color:var(--ink-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;margin-right:5px}
.stats{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.stats .k{color:var(--ink-faint);font-weight:600}
.stats .age{color:var(--ink-faint);font-style:italic}
/* actions column */
.sess .act{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px}
.ctx{display:inline-flex;align-items:center;gap:5px}
.ctx .bar{width:44px;height:5px;border-radius:3px;background:var(--column);overflow:hidden}
.ctx .bar i{display:block;height:100%;background:var(--c-work);border-radius:3px}
.ctx.hi .bar i{background:var(--warn)}.ctx.max .bar i{background:var(--bad)}

/* status treatments */
.sess.working{border-color:#c7ddff}
.sess.waiting{border-color:#f6dfae}
/* needs_input: pulsing red left rail + red wash — the one thing that must be seen */
.sess.needs_input{border-color:#f7c5c9;border-left-color:var(--c-needs);background:linear-gradient(90deg,var(--c-needs-bg),#fff 60%);animation:railPulse 1.4s ease-in-out infinite}
.sess.needs_input .now{color:#b93540;font-weight:600}
.sess.needs_input::after{background:var(--c-needs);box-shadow:0 0 0 1px var(--c-needs)}
@keyframes railPulse{0%,100%{border-left-color:var(--c-needs);box-shadow:-1px 0 0 0 rgba(240,85,95,.55), 0 0 0 0 rgba(240,85,95,0)}50%{border-left-color:#f9b8bd;box-shadow:-1px 0 0 0 rgba(240,85,95,.1), 0 0 0 4px rgba(240,85,95,.12)}}
/* stale: dashed, greyed */
.sess.stale{border-style:dashed;border-left-style:solid;background:var(--c-stale-bg)}
.sess.stale .now{color:var(--ink-soft)}
/* ended: everything muted; the Resume tier is the one thing still in color */
.sess.ended{background:var(--ws);border-color:var(--line);border-left-color:#d5d9e4;color:var(--ink-faint)}
.sess.ended::before,.sess.ended::after{background:#d5d9e4;box-shadow:0 0 0 1px #d5d9e4}
.sess.ended .host{opacity:.55;filter:saturate(0)}
.sess.ended .mdl{opacity:.65}
.sess.ended .sname,.sess.ended .now,.sess.ended .stats{color:var(--ink-faint)}
.sess.ended .now .k{color:#c3c8d6}
.sess.ended .ctx .bar i{background:#c3c8d6}
.sess.ended .btn{color:var(--ink-soft)}

/* unlinked bucket */
.unlinked{margin-top:24px;scroll-margin-top:190px}
.unlinked .list{border-style:dashed;background:var(--ws)}
.unlinked .list-h{background:var(--ws)}
.unlinked .list-h h3{display:flex;align-items:center;gap:8px}
.unlinked .list-h h3 .n{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.unlinked .sess{margin:8px 16px}
.unlinked .sess:first-of-type{margin-top:10px}
.unlinked .sess:last-of-type{margin-bottom:12px}
.unlinked .why{padding:8px 16px 0;font-size:12px;color:var(--ink-soft)}
.unlinked .sessions{margin:0;padding:0}
.unlinked .sessions::before{display:none}
.unlinked .sess::before,.unlinked .sess::after{display:none}

/* drawer / sheet / picker */
.scrim{position:fixed;inset:0;background:rgba(42,46,67,.32);z-index:40;opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.scrim.soft{background:rgba(42,46,67,.12)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--card);z-index:50;box-shadow:-12px 0 40px rgba(42,46,67,.18);transform:translateX(102%);transition:transform .2s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-h .t{flex:1;min-width:0}
.drawer-h .t .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:600;display:flex;align-items:center;gap:8px}
.drawer-h .t h2{margin:4px 0 0;font-size:15px;font-family:var(--mono);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-b{flex:1;overflow:auto;padding:16px}
.drawer-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--ws)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;margin:0 0 14px}
.kv dt{color:var(--ink-faint);font-weight:600}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.sum{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.sum > div{padding:10px 12px;border-top:1px solid var(--line)}
.sum > div:first-child{border-top:0}
.sum .k{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:3px}
.sum .now-b{background:var(--brand-soft)}
.sum .now-b .k{color:var(--brand-dark)}
.sum p{margin:0;font-size:13.5px;line-height:1.45}
.sum-age{font-size:11.5px;color:var(--ink-faint);font-style:italic;margin:-6px 0 14px}
.term{background:#1b1e2b;color:#c9d1e6;border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.term .p{color:#8fd3a7}.term .c{color:#7b68ee}.term .dim{color:#6b7186}
.note{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.45}
.note b{color:var(--ink)}
.linkto{font-size:12px;color:var(--ink-soft);margin:0 0 12px}
.linkto a{color:var(--brand-dark)}

.picker{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:min(520px,calc(100vw - 24px));max-height:min(80vh,640px);background:var(--card);border-radius:14px;box-shadow:0 24px 60px rgba(42,46,67,.28);z-index:50;display:none;flex-direction:column;overflow:hidden}
.picker.on{display:flex}
.picker-h{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.picker-h h2{margin:0;font-size:15px}
.picker-h p{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft)}
.picker-h input{width:100%;margin-top:10px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:var(--ws)}
.picker-b{overflow:auto;padding:6px}
.pk-grp{padding:8px 10px 2px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.pk-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:44px;padding:8px 10px;border-radius:8px}
.pk-item:hover{background:var(--column)}
.pk-item .nm{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.pk-item .nm small{display:block;font-family:var(--mono);color:var(--ink-faint);font-size:11px}
.pk-item>svg{width:13px;height:13px;flex:none}
.picker-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

/* ── anchored popovers: legend + DONE-WHEN contract ── */
.pop{position:fixed;z-index:50;width:min(380px,calc(100vw - 24px));max-height:min(72vh,600px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(42,46,67,.24);display:none;flex-direction:column;overflow:hidden}
.pop.on{display:flex}
.pop-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pop-h .t{flex:1;min-width:0}
.pop-h h2{margin:0;font-size:14px;font-weight:700}
.pop-h .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:600}
.pop-b{overflow:auto;padding:4px 14px 12px}
.pop-f{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--ws)}
.lg-sec{padding:10px 0 2px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.lg-row{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;align-items:start;padding:7px 0;border-top:1px solid var(--line)}
.lg-sec + .lg-row{border-top:0}
.lg-row .c{display:flex;align-items:center;min-height:24px}
.lg-row .d{font-size:12.5px;line-height:1.4;color:var(--ink-soft)}
.lg-row .d b{display:block;color:var(--ink);font-weight:600}
.lg-row .swatch{width:100%;height:24px;border-radius:6px;border:1px solid var(--line)}
.lg-row .liv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.lg-row .liv i{width:8px;height:8px;border-radius:50%;display:inline-block}
.contract{margin:10px 0 4px;padding:10px 12px 10px 14px;border-left:3px solid var(--ok);background:#f2faf5;border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.5;color:var(--ink)}
.contract.missing{border-left-color:var(--warn);background:var(--c-wait-bg)}
.contract .lbl{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#1d7a43;margin-bottom:4px}
.contract.missing .lbl{color:#9a6408}
.pop .taskname{font-size:13px;font-weight:600;line-height:1.35;margin:8px 0 0}
.pop .why{font-size:12px;color:var(--ink-soft);line-height:1.45;margin:6px 0 0}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(42,46,67,.28);z-index:60;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* phone sheet (folders nav) — hidden until the Folders button opens it */
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;z-index:50;transform:translateY(105%);transition:transform .2s cubic-bezier(.2,.8,.2,1);max-height:78vh;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(42,46,67,.2);padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet-h{padding:10px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet-h::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.sheet-h h2{margin:6px 0 0;font-size:15px;flex:1}
.sheet-b{overflow:auto;padding:6px 8px 12px}
.sheet-b .tree-list{min-height:44px}

/* ── phone ─────────────────────────────────────────── */
@media (max-width:720px){
  :root{--tap:44px}
  .app{grid-template-columns:1fr;height:auto;min-height:100vh}
  .rail{display:none}
  .main{overflow:visible}
  .hdr{top:0}
  .hdr-top{padding:12px 14px 0;flex-wrap:wrap;gap:8px}
  .hdr-title{flex:1;min-width:0}
  .hdr-title h1{font-size:18px}
  .hdr-title .built{display:none}
  .legend-btn{width:44px;height:44px;order:2;margin-left:0}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;background:var(--column);border-radius:10px;width:100%;order:3}
  .seg button{min-height:44px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-soft)}
  .seg button[aria-current="true"]{background:var(--card);color:var(--brand-dark);box-shadow:var(--shadow)}
  .seg button b{color:var(--c-needs)}
  .hdr-top .folders-btn{order:2}
  .hdr-counts{padding:10px 14px 0}
  .count{min-width:84px;padding:6px 10px}
  .count b{font-size:18px}
  .hdr-hosts{padding:8px 14px 10px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .hdr-hosts::-webkit-scrollbar{display:none}
  .host-chip{min-height:34px;flex:none}
  .host-chip::after{content:"";position:absolute;inset:-5px 0}
  .btn.sm{min-height:44px}
  .ext{padding:15px 6px;margin:-15px -6px}
  .task-name a{display:inline-block;padding:14px 0;margin:-14px 0}
  .dwc::after{content:"";position:absolute;inset:-11px -4px}
  .host-chip .why{position:fixed;left:14px;right:14px;top:auto;bottom:auto;max-width:none;width:auto;margin-top:6px}
  .content{padding:12px 12px 140px}
  .list{scroll-margin-top:230px}
  .list-h{padding:10px 12px}
  .task-row{grid-template-columns:auto minmax(0,1fr);gap:10px;padding:12px 12px 10px}
  .task-act{grid-column:2;justify-content:flex-start;padding-top:8px;width:100%}
  .task-act .btn{flex:1}
  .dispatch-wrap{align-items:stretch;width:100%}
  .dispatch-wrap .btn{width:100%}
  .dispatch-wrap .hint{text-align:center;white-space:normal}
  .dispatching{justify-content:center;width:100%}
  .parked{margin:2px 12px 12px 12px}
  .sessions{margin:0 12px 12px 12px;padding-left:18px}
  .sessions::before{left:5px}
  .sess{grid-template-columns:1fr;grid-template-rows:auto auto auto;padding:10px 12px}
  .sess::before{left:-16px;width:11px;top:22px}
  .sess::after{left:-7px;top:18px}
  .sess .r2{grid-template-columns:1fr}
  .stats{flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap;white-space:normal}
  .sess .act{grid-column:1;grid-row:3;flex-direction:row;align-items:center;justify-content:space-between;margin-top:4px;width:100%}
  .sess .act .btn{flex:1}
  .sess .act .ctx{display:none}
  .drawer{top:auto;left:0;right:0;width:auto;max-height:88vh;border-radius:16px 16px 0 0;transform:translateY(105%);box-shadow:0 -10px 40px rgba(42,46,67,.2);padding-bottom:env(safe-area-inset-bottom)}
  .drawer.on{transform:none}
  .picker{top:auto;bottom:0;left:0;transform:none;width:100%;max-height:82vh;border-radius:16px 16px 0 0}
  .pop{left:0!important;right:0!important;top:auto!important;bottom:0;width:100%;max-height:80vh;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .pop-b{padding:4px 16px 14px}
  .lg-row{grid-template-columns:128px minmax(0,1fr)}
  .tree-list{min-height:44px}
}
@media (min-width:721px){
  .folders-btn{display:none}
  .sheet{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .sess.needs_input{box-shadow:-1px 0 0 0 rgba(240,85,95,.55), 0 0 0 3px rgba(240,85,95,.14)}
}

function sessionTasks(s){ return [...(s.clickupTasks||[]), ...(state.links[s.session_id]||[])]; }
function sessionsFor(taskId){ return SPACE.sessions.filter(s => sessionTasks(s).includes(taskId)).sort((a,b)=>STATUS_RANK[a.status]-STATUS_RANK[b.status]); }
function unlinkedSessions(){ return SPACE.sessions.filter(s => sessionTasks(s).length===0); }
function currentSpace(){ return SPACE.spaces.find(s=>s.id===state.spaceId); }
function spaceTasks(sp){ return sp.folders.flatMap(f=>f.lists.flatMap(l=>l.tasks)); }
function findTask(id){ for(const sp of SPACE.spaces) for(const t of spaceTasks(sp)) if(t.id===id) return {task:t, space:sp}; return null; }
function isLive(s){ return s.status==='working'||s.status==='needs_input'||s.status==='waiting'; }
function needsYou(t){ return t.agent_state==='needs-info' || sessionsFor(t.id).some(s=>s.status==='needs_input'); }
function inProg(t){ return t.agent_state==='in-progress' || t.status==='in progress' || sessionsFor(t.id).some(isLive); }
function rank(t){ return needsYou(t)?0 : inProg(t)?1 : 2; }
function sortTasks(ts){ return [...ts].sort((a,b)=> rank(a)-rank(b) || a.priority-b.priority || String(a.due||'9').localeCompare(String(b.due||'9'))); }
function canDispatch(t){ return t.doneWhen && ['ready-for-agent','needs-triage','ready-for-human'].includes(t.agent_state); }
function stats(sp){
  const tasks = spaceTasks(sp);

  const live = SPACE.sessions.filter(s => isLive(s) && sessionTasks(s).some(id=>ids.has(id)));
  return {
    open: tasks.length,
    needsYou: tasks.filter(needsYou).length,
    live: live.length,
    parked: tasks.filter(t=>t.agent_state==='needs-info').length,

  if(!d) return {cls:'none', text:'no due'};
  const dt = new Date(d+'T12:00:00'); const label = dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  if(d<TODAY){ const days=Math.round((new Date(TODAY+'T12:00:00')-dt)/864e5); return {cls:'over', text:`${label} · ${days}d overdue`}; }
  if(d===TODAY) return {cls:'today', text:`due today`};
  return {cls:'', text:label};
}
function fmtAge(sec){ if(sec<60) return `${sec}s`; if(sec<3600) return `${Math.round(sec/60)}m`; const h=Math.floor(sec/3600), m=Math.round((sec%3600)/60); return m?`${h}h ${m}m`:`${h}h`; }
function fmtTok(n){ return n>=1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'')+'M' : Math.round(n/1e3)+'k'; }
function summaryAge(s){ const m=s.summaryAgeMin; return m<1?'summary <1m old': m<60?`summary ${m}m old`:`summary ${Math.floor(m/60)}h ${m%60}m old`; }
function initials(n){ return n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

/* ── render: task row ─────────────────────────────────────────────────── */
function taskHTML(t){
  const ss = sessionsFor(t.id);
  const due = fmtDue(t.due);
  const stCls = t.status==='to do'?'todo': t.status==='in progress'?'prog':'pdone';
  const hot = needsYou(t);
  const dispatching = state.dispatching.has(t.id);
  let act='';
  if(dispatching){
    act = `<span class="dispatching"><span class="spin" aria-hidden="true"></span>dispatching…</span>`;
  } else if(ss.length===0 && t.agent_state!=='needs-info'){
    if(canDispatch(t)){
      act = `<div class="dispatch-wrap"><button class="btn primary" type="button" data-dispatch="${t.id}">${ICON.play}Dispatch</button><span class="hint">spawns on ${SPACE.self}</span></div>`;
    } else if(!t.doneWhen){
      act = `<div class="dispatch-wrap"><button class="btn primary" type="button" disabled title="Add a DONE-WHEN contract in ClickUp to make this dispatchable">${ICON.play}Dispatch</button><span class="hint">needs DONE-WHEN</span></div>`;
    } else {
      act = `<div class="dispatch-wrap"><button class="btn primary" type="button" disabled>${ICON.play}Dispatch</button><span class="hint">${AS_LABEL[t.agent_state]} — not dispatchable</span></div>`;
    }
  } else if(t.status==='proposed-done'){
    act = `<button class="btn" type="button" data-confirm="${t.id}">${ICON.check}Confirm done</button>`;
  }
  const parked = t.agent_state==='needs-info' ? parkedHTML(t) : '';
  const joinColor = ss.length ? HOST_COLOR[ss[0].host] : 'var(--line)';
  return `<article class="task ${hot?'is-hot':''} ${dispatching?'is-dispatching':''}" id="task-${t.id}">
    <div class="task-row">
      <span class="prio p${t.priority}" title="priority ${t.priority} · ${t.priority===1?'drop everything':t.priority===2?'normal':'whenever'}">${ICON.flag}</span>
      <div class="task-main">
        <h4 class="task-name"><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a></h4>
        <div class="task-meta">
          <span class="st ${stCls}"><span class="sq"></span>${esc(t.status)}</span>
          ${asChip(t.agent_state)}
          ${dwChip(t)}
          <span class="due ${due.cls}">${ICON.cal}${due.text}</span>
          <span class="assg"><span class="av ${t.assignee==='Jarred'?'j':''}">${initials(t.assignee)}</span>${esc(t.assignee)}</span>
          <a class="ext" href="${esc(t.url)}" target="_blank" rel="noopener" title="Open in ClickUp"><span class="tid">${esc(t.id)}</span>${ICON.ext}</a>
        </div>
      </div>
      <div class="task-act">${act}</div>
    </div>
    ${parked}
    ${ss.length ? `<div class="sessions" style="--join:${joinColor}">${ss.map(s=>sessionHTML(s)).join('')}</div>` : ''}
  </article>`;
}
function parkedHTML(t){
  const done = state.answered.has(t.id); const open = state.answering===t.id;
  return `<div class="parked ${done?'answered':''}">
    <span class="q-ic" aria-hidden="true">${done?ICON.check:'?'}</span>
    <div class="q"><span class="lbl">${done?'Answered · session resuming':'Parked — waiting on you'}</span>${esc(t.question)}
      ${done ? '' : open
        ? `<textarea id="ans-${t.id}" placeholder="Type the answer the session should resume on…" aria-label="Answer"></textarea><div class="q-act"><button class="btn primary" type="button" data-send-answer="${t.id}">Send answer</button><button class="btn ghost" type="button" data-cancel-answer="${t.id}">Cancel</button></div>`
        : `<div class="q-act"><button class="btn primary" type="button" data-answer="${t.id}">Answer</button><span class="hint">resumes the parked session with your reply</span></div>`}
    </div>
  </div>`;
}

  $('#content').innerHTML = h;

const isPhone = () => window.matchMedia('(max-width:720px)').matches;
function openScrim(soft){ const s=$('#scrim'); s.classList.toggle('soft', !!soft); s.classList.add('on'); }

  $('#scrim').classList.remove('on','soft');

/* anchor a popover under a button on desktop; bottom sheet on phone (CSS) */
function showPop(pop, btn){
  closeAll();
  state.popAnchor = btn; btn.setAttribute('aria-expanded','true');
  pop.classList.add('on');
  if(!isPhone()){
    const r = btn.getBoundingClientRect(); const w = Math.min(380, window.innerWidth-24);
    const left = Math.min(Math.max(12, r.left), window.innerWidth-w-12);
    pop.style.left = left+'px'; pop.style.right='auto';
    let top = r.bottom+8; const h = pop.offsetHeight;
    if(top+h > window.innerHeight-12) top = Math.max(12, r.top-h-8);
    pop.style.top = top+'px';
  } else { pop.style.left=''; pop.style.right=''; pop.style.top=''; }
  openScrim(true);
  pop.querySelector('[data-close]').focus();
}
function openLegend(btn){ $('#legend-body').innerHTML = legendHTML(); showPop($('#legend'), btn); }
function openDW(id, btn){

    </dl>
    <div class="term">${term}</div>
    ${s.status==='ended' ? `<p class="note"><b>Resume is a ${s.resumeTier}.</b> ${esc(TIER_COPY[s.resumeTier])} It never claims a full restore.</p>` : s.status==='stale' ? `<p class="note"><b>Stale.</b> ${esc(SPACE.hosts[s.host].note||'Host has not published recently')} — what you see here may be out of date.</p>` : ''}`;
  $('#drawer-foot').innerHTML = s.status==='ended'
    ? `<button class="btn primary" type="button" data-resume="${s.session_id}">${ICON.resume}Resume <span class="tier ${s.resumeTier}" style="background:rgba(255,255,255,.22);color:#fff;border-color:transparent">${s.resumeTier}</span></button><button class="btn" type="button" data-close>Close</button>`
    : `<button class="btn ${s.status==='needs_input'?'hot':'primary'}" type="button" data-attach="${s.session_id}">${ICON.open}${s.status==='needs_input'?'Answer in session':'Attach'}</button>${tasks.length?'':`<button class="btn" type="button" data-link="${s.session_id}">${ICON.link}Link task</button>`}<button class="btn" type="button" data-close>Close</button>`;
  const d=$('#drawer'); d.hidden=false; requestAnimationFrame(()=>{ d.classList.add('on'); openScrim(); d.querySelector('[data-close]').focus(); });
}

function openPicker(id){
  const s = SPACE.sessions.find(x=>x.session_id===id); if(!s) return;
  state.pickerFor=id;
  $('#picker-sub').innerHTML = `Attach <span class="mono">${esc(s.name)}</span> (${esc(s.project)} · ${esc(s.branch)}) to a task in ${esc(currentSpace().name)}.`;
  $('#picker-q').value='';
  renderPicker('');
  $('#drawer').classList.remove('on'); $('#drawer').hidden=true;
  $('#picker').classList.add('on'); openScrim(); $('#picker-q').focus();
}
function renderPicker(q){
  const sp=currentSpace(); q=q.trim().toLowerCase(); let h='';
  for(const f of sp.folders) for(const l of f.lists){
    const ts = l.tasks.filter(t=>!q || t.name.toLowerCase().includes(q) || t.id.includes(q));
    if(!ts.length) continue;
    h += `<div class="pk-grp">${esc(f.name)} / ${esc(l.name)}</div>`;
    h += ts.map(t=>`<button class="pk-item" type="button" data-pick="${t.id}"><span class="prio p${t.priority}">${ICON.flag}</span><span class="nm">${esc(t.name)}<small>${esc(t.id)} · ${AS_LABEL[t.agent_state]}</small></span>${ICON.link}</button>`).join('');
  }
  $('#picker-body').innerHTML = h || `<div class="list-empty">No task matches “${esc(q)}”.</div>`;
}
function openSheet(){ const sh=$('#sheet'); sh.hidden=false; requestAnimationFrame(()=>{ sh.classList.add('on'); openScrim(); sh.querySelector('[data-close]').focus(); }); }

/* ── events ───────────────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const b = e.target.closest('button, a'); if(!b) return;
  const d = b.dataset;
  if(d.space){ state.spaceId=d.space; state.answering=null; render(); closeAll(); $('#main').scrollTo({top:0}); window.scrollTo({top:0}); return; }
  if(d.jump){ closeAll(); const el=document.getElementById(d.jump); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(b.id==='folders-btn'){ openSheet(); return; }
  if(b.id==='legend-btn'){ if(state.popAnchor===b){ closeAll(); } else { openLegend(b); } return; }
  if(d.dw){ if(state.popAnchor===b){ closeAll(); } else { openDW(d.dw, b); } return; }
  if(b.classList.contains('host-chip')){ const on=b.classList.toggle('open'); b.setAttribute('aria-expanded',on); document.querySelectorAll('.host-chip.open').forEach(x=>{ if(x!==b){x.classList.remove('open');x.setAttribute('aria-expanded','false');} }); return; }
  if(d.dispatch){ state.dispatching.add(d.dispatch); render(); toast(`Dispatching ${d.dispatch} on ${SPACE.self} — a session will appear under the task once the rail publishes it.`); return; }
  if(d.open){ openDrawer(d.open); return; }
  if(d.attach){ closeAll(); toast(`Attaching to ${SPACE.sessions.find(s=>s.session_id===d.attach).name} (mock)`); return; }
  if(d.resume){ const s=SPACE.sessions.find(x=>x.session_id===d.resume); closeAll(); toast(`Resume (${s.resumeTier}): ${TIER_COPY[s.resumeTier]}`); return; }
  if(d.link){ openPicker(d.link); return; }
  if(d.pick){ const sid=state.pickerFor; (state.links[sid] ||= []).push(d.pick); const t=findTask(d.pick).task; closeAll(); render(); toast(`Linked to “${t.name}”`); document.getElementById('task-'+d.pick)?.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if(d.answer){ state.answering=d.answer; render(); document.getElementById('ans-'+d.answer)?.focus(); return; }
  if(d.cancelAnswer){ state.answering=null; render(); return; }
  if(d.sendAnswer){ const ta=document.getElementById('ans-'+d.sendAnswer); if(!ta.value.trim()){ ta.focus(); toast('Type an answer first.'); return; } state.answered.add(d.sendAnswer); state.answering=null; render(); toast('Answer sent — the parked session resumes with it (mock).'); return; }
  if(d.confirm){ toast(`Confirm done for ${d.confirm} — would move the ClickUp task to done (mock).`); return; }
  if(b.hasAttribute('data-close') || b.id==='scrim'){ closeAll(); return; }
});
$('#scrim').addEventListener('click', closeAll);
$('#picker-q').addEventListener('input', e => renderPicker(e.target.value));
document.addEventListener('keydown', e => { if(e.key==='Escape') closeAll(); });
document.addEventListener('click', e => { if(!e.target.closest('.host-chip')) document.querySelectorAll('.host-chip.open').forEach(x=>{x.classList.remove('open');x.setAttribute('aria-expanded','false');}); }, true);
window.addEventListener('resize', () => { const p=document.querySelector('.pop.on'); if(p && state.popAnchor) showPop(p, state.popAnchor); });

/* the phone Folders sheet must start closed — belt and braces */
$('#sheet').hidden = true; $('#sheet').classList.remove('on');

render();
</script>
</body>
</html>
