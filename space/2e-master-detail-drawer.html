<!-- fleetboard space view · concept 2e master-detail-drawer · 01 master-detail evolved around opening a session: a session chip opens a right-side drawer (bottom sheet on phone) with a live terminal tail, a reply composer for needs_input, tiered Resume for ended sessions and the task rail; the Space view stays visible and dimmed behind it · phone-first, light theme, self-contained -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FleetBoard — Space · master-detail-drawer</title>
<style>
:root{
  --brand:#7b68ee; --brand-dark:#5f4dd0; --brand-soft:#efecfd;
  --ink:#2a2e43; --ink-soft:#6b7186; --ink-faint:#9aa1b5;
  --line:#e6e9f2; --ws:#fafbfc; --column:#f3f4f7; --card:#fff;
  --c-needs:#f0555f; --c-needs-bg:#fdeef0;
  --c-work:#4c9aff;  --c-work-bg:#eef5ff;
  --c-wait:#f0a92e;  --c-wait-bg:#fdf6ea;
  --c-stale:#98a1b3; --c-stale-bg:#f3f4f7;
  --ok:#27ae60; --warn:#f0a92e; --bad:#e5484d;
  --shadow:0 1px 3px rgba(42,46,67,.08), 0 1px 2px rgba(42,46,67,.05);
  --h-mactop:#5f4dd0; --h-mini:#0e9994; --h-macbook:#0073ea;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --rail-w:256px;
  --tap:36px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.4;color:var(--ink);background:var(--ws);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.01em}
[hidden]{display:none!important}
body.lock{overflow:hidden}

/* ── shell ─────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100dvh;height:100vh}
.rail{border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
.main{min-width:0;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}

/* ── rail ──────────────────────────────────────────── */
.rail-brand{display:flex;align-items:center;gap:9px;padding:14px 16px 10px;font-weight:700;font-size:13px;letter-spacing:.02em;color:var(--ink)}
.rail-brand .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));display:grid;place-items:center}
.rail-brand .logo svg{width:13px;height:13px}
.rail-brand small{font-weight:500;color:var(--ink-faint);margin-left:auto}
.rail-section{padding:6px 10px 2px 16px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.spaces{display:flex;flex-direction:column;gap:2px;padding:4px 8px 10px}
.space-btn{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 8px;border-radius:8px;text-align:left;width:100%}
.space-btn:hover{background:var(--column)}
.space-btn[aria-current="true"]{background:var(--brand-soft);color:var(--brand-dark)}
.space-key{min-width:30px;height:24px;padding:0 6px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--column);color:var(--ink-soft);flex:none;letter-spacing:.01em}
.space-btn[aria-current="true"] .space-key{background:var(--brand);color:#fff}
.space-btn .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.space-btn .ct{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.space-btn .ct b{color:var(--c-needs);font-weight:700}
.rail-tree{flex:1;overflow:auto;padding:0 8px 16px;border-top:1px solid var(--line)}
.tree-folder{margin-top:8px}
.tree-folder-h{display:flex;align-items:center;gap:7px;padding:6px 8px;font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:none}
.tree-folder-h svg{width:14px;height:14px;color:var(--ink-faint)}
.tree-list{display:flex;align-items:center;gap:8px;min-height:34px;padding:4px 8px 4px 28px;border-radius:7px;width:100%;text-align:left;color:var(--ink)}
.tree-list:hover{background:var(--column)}
.tree-list .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tree-list .ct{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.tree-list .ct b{color:var(--c-needs)}
.tree-list .ct.empty{color:var(--ink-faint);font-style:italic}
.tree-unlinked{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}

/* ── header strip ──────────────────────────────────── */
.hdr{position:sticky;top:0;z-index:20;background:rgba(250,251,252,.92);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.hdr-top{display:flex;align-items:center;gap:12px;padding:14px 24px 0}
.hdr-title{display:flex;align-items:baseline;gap:10px;min-width:0}
.hdr-title h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-title .built{font-size:12px;color:var(--ink-faint);white-space:nowrap}
.seg{display:none}
.hdr-counts{display:flex;gap:6px;align-items:stretch;padding:10px 24px 0;overflow-x:auto;scrollbar-width:none}
.hdr-counts::-webkit-scrollbar{display:none}
.count{flex:none;display:flex;flex-direction:column;justify-content:center;min-width:92px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:var(--shadow);text-align:left}
.count b{font-size:20px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.count span{font-size:11px;color:var(--ink-soft);white-space:nowrap}
.count.hot b{color:var(--c-needs)}
.count.hot{border-color:#f7c5c9;background:var(--c-needs-bg)}
.count.live b{color:var(--c-work)}
.count.parked b{color:var(--c-wait)}
.count.done b{color:var(--ok)}
.hdr-hosts{display:flex;gap:6px;align-items:center;padding:10px 24px 12px;flex-wrap:wrap}
.hdr-hosts .lbl{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-right:2px}
.host-chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 10px 3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600;color:var(--ink-soft)}
.host-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(39,174,96,.15)}
.host-chip .nm{color:var(--ink)}
.host-chip .age{font-weight:500;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.host-chip.stale{border-style:dashed;background:var(--c-stale-bg)}
.host-chip.stale .dot{background:var(--warn);box-shadow:0 0 0 3px rgba(240,169,46,.18)}
.host-chip.dead .dot{background:var(--bad);box-shadow:0 0 0 3px rgba(229,72,77,.18)}
.host-chip .why{position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:max-content;max-width:260px;padding:8px 10px;border-radius:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:500;line-height:1.35;box-shadow:0 6px 20px rgba(42,46,67,.2);display:none;text-align:left}
.host-chip.open .why,.host-chip:hover .why{display:block}
@media (hover:none){.host-chip:hover .why{display:none}.host-chip.open .why{display:block}}

/* ── content ───────────────────────────────────────── */
.content{padding:16px 24px 120px;max-width:1120px}
.folder{margin-top:20px}
.folder:first-child{margin-top:4px}
.folder-h{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.folder-h svg{width:14px;height:14px}
.folder-h .rule{flex:1;height:1px;background:var(--line)}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;scroll-margin-top:190px}
.list-h{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:#fff}
.list-h h3{margin:0;font-size:14px;font-weight:700}
.list-h .ct{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.list-h .ct b{color:var(--c-needs);font-weight:600}
.list-h .spacer{flex:1}
.list-h .pill{font-size:11px;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.list-empty{padding:22px 16px;color:var(--ink-faint);font-size:13px;display:flex;gap:10px;align-items:center}
.list-empty .z{width:28px;height:28px;border-radius:8px;background:var(--column);display:grid;place-items:center;color:var(--ink-faint)}

/* task */
.task{border-top:1px solid var(--line);position:relative}
.task:first-of-type{border-top:0}
.task.is-hot{background:linear-gradient(90deg,var(--c-needs-bg) 0,rgba(253,238,240,0) 34%)}
.task.is-dispatching{background:linear-gradient(90deg,var(--brand-soft) 0,rgba(239,236,253,0) 40%)}
.task-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px 10px}
.prio{width:20px;height:20px;margin-top:1px;display:grid;place-items:center;flex:none}
.prio svg{width:14px;height:14px}
.prio.p1{color:var(--bad)}.prio.p2{color:var(--brand)}.prio.p3{color:var(--ink-faint)}
.task-main{min-width:0}
.task-name{margin:0;font-size:14px;font-weight:600;line-height:1.35;letter-spacing:-.005em}
.task-name a{text-decoration:none}
.task-name a:hover{text-decoration:underline;text-decoration-color:var(--brand)}
.task-meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:6px;font-size:12px;color:var(--ink-soft)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft)}
.st .sq{width:8px;height:8px;border-radius:2px;background:var(--ink-faint)}
.st.todo .sq{background:#c9cede}.st.prog .sq{background:var(--c-work)}.st.pdone .sq{background:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.chip.as-needs-triage{background:var(--c-wait-bg);color:#9a6408;border:1px solid #f6dfae}
.chip.as-ready-for-human{background:var(--c-needs-bg);color:#b93540;border:1px solid #f7c5c9}
.chip.as-ready-for-agent{background:var(--c-work-bg);color:#1e64c8;border:1px solid #c7ddff}
.chip.as-in-progress{background:#e8f7ee;color:#1d7a43;border:1px solid #bfe6cd}
.chip.as-needs-info{background:var(--c-wait);color:#fff;border:1px solid var(--c-wait)}
.chip.as-out-of-scope{background:var(--c-stale-bg);color:var(--ink-soft);border:1px dashed var(--c-stale)}
.due{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.due svg{width:12px;height:12px}
.due.over{color:var(--bad);font-weight:600}
.due.today{color:var(--warn);font-weight:600}
.due.none{color:var(--ink-faint)}
.dw{display:inline-flex;align-items:center;gap:4px}
.dw svg,.list-empty .z svg,.parked .q-ic svg,.pk-item>svg,.unlinked .list-h h3 svg{width:13px;height:13px;flex:none}
.dw.ok{color:var(--ok)}.dw.missing{color:var(--warn);font-weight:600}
.assg{display:inline-flex;align-items:center;gap:5px}
.assg .av{width:16px;height:16px;border-radius:50%;background:var(--brand-soft);color:var(--brand-dark);font-size:9px;font-weight:700;display:grid;place-items:center}
.assg .av.j{background:#ffe9d6;color:#b25a12}
.tid{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.ext{display:inline-flex;align-items:center;gap:3px;color:var(--ink-faint);text-decoration:none}
.ext:hover{color:var(--brand-dark)}
.ext svg{width:11px;height:11px}
.task-act{display:flex;align-items:center;gap:8px;flex:none;padding-top:1px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);white-space:nowrap;transition:background .12s,border-color .12s,transform .06s}
.btn:hover:not(:disabled){background:var(--column)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--brand-dark);border-color:var(--brand-dark)}
.btn.primary:disabled{background:var(--column);border-color:var(--line);color:var(--ink-faint)}
.btn.ghost{border-color:transparent;color:var(--ink-soft)}
.btn.ghost:hover:not(:disabled){color:var(--ink)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px;border-radius:7px}
.btn .tier{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--brand-soft);color:var(--brand-dark)}
.btn .tier.revive{background:var(--c-wait-bg);color:#9a6408}
.btn .tier.resume{background:var(--c-work-bg);color:#1e64c8}
.btn .tier.attach{background:#e8f7ee;color:#1d7a43}
.hint{font-size:11px;color:var(--ink-faint);white-space:nowrap}
.dispatch-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.dispatching{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);padding:0 12px;border-radius:8px;background:var(--brand-soft);color:var(--brand-dark);font-weight:600;font-size:13px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(95,77,208,.25);border-top-color:var(--brand-dark);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* parked question */
.parked{margin:2px 16px 12px 48px;padding:10px 12px;border-radius:10px;background:var(--c-wait-bg);border:1px solid #f6dfae;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.parked .q-ic{width:22px;height:22px;border-radius:6px;background:var(--c-wait);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.parked .q{font-size:13px;color:var(--ink);line-height:1.45}
.parked .q .lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9a6408;margin-bottom:3px}
.parked .q-act{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.parked textarea{width:100%;min-height:64px;margin-top:8px;padding:8px 10px;border:1px solid #e9cf8f;border-radius:8px;font:inherit;font-size:13px;resize:vertical;background:#fff}
.parked.answered{background:#e8f7ee;border-color:#bfe6cd}
.parked.answered .q-ic{background:var(--ok)}
.parked.answered .lbl{color:#1d7a43}

/* sessions inline — the join, drawn as a bracket */
.sessions{position:relative;margin:0 16px 12px 24px;padding-left:24px}
.sessions::before{content:"";position:absolute;left:9px;top:-4px;bottom:12px;width:2px;border-radius:2px;background:var(--join,var(--line))}
.sess{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:6px}
.sess::before{content:"";position:absolute;left:-15px;top:50%;width:13px;height:2px;background:var(--join,var(--line));border-radius:2px}
.sess::after{content:"";position:absolute;left:-4px;top:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:var(--join,var(--line));border:2px solid #fff;box-shadow:0 0 0 1px var(--join,var(--line))}
.sess[data-sid]{cursor:pointer;transition:box-shadow .12s,border-color .12s}
.sess[data-sid]:hover{box-shadow:0 0 0 3px var(--brand-soft);border-color:#cfc7f7}
.sess.needs_input{border-color:#f7c5c9;background:linear-gradient(90deg,var(--c-needs-bg),#fff 55%)}
.sess.working{border-color:#c7ddff}
.sess.waiting{border-color:#f6dfae}
.sess.stale{border-style:dashed;background:var(--c-stale-bg)}
.sess.ended{background:var(--ws);border-color:var(--line);color:var(--ink-soft)}
.sess.ended .sname{color:var(--ink-soft)}
.sess-main{min-width:0}
.sess-line1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0}
.host{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px 0 6px;border-radius:5px;color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--hc,#6b7186)}
.host::before{content:"";width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.85)}
.sess.ended .host{opacity:.6}
.sstat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.sstat .d{width:8px;height:8px;border-radius:50%}
.sstat.needs_input{color:var(--c-needs)}.sstat.needs_input .d{background:var(--c-needs);animation:pulse 1.2s ease-in-out infinite}
.sstat.working{color:#1e64c8}.sstat.working .d{background:var(--c-work);animation:pulse 2s ease-in-out infinite}
.sstat.waiting{color:#9a6408}.sstat.waiting .d{background:var(--c-wait)}
.sstat.stale{color:var(--ink-soft)}.sstat.stale .d{background:var(--c-stale)}
.sstat.ended{color:var(--ink-faint)}.sstat.ended .d{background:var(--ink-faint)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(76,154,255,.35)}50%{box-shadow:0 0 0 5px rgba(76,154,255,0)}}
.sstat.needs_input .d{animation-name:pulseHot}
@keyframes pulseHot{0%,100%{box-shadow:0 0 0 0 rgba(240,85,95,.45)}50%{box-shadow:0 0 0 6px rgba(240,85,95,0)}}
.sname{font-family:var(--mono);font-size:12px;color:var(--ink)}
.sess-meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.sess-meta .k{color:var(--ink-faint)}
.sess-meta .age{color:var(--ink-faint);font-style:italic}
.sess-now{margin-top:5px;font-size:13px;color:var(--ink);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sess-now .k{font-weight:700;color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-right:5px}
.sess.needs_input .sess-now{color:#b93540;font-weight:500}
.sess.ended .sess-now{color:var(--ink-soft)}
.sess-act{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ctx{display:inline-flex;align-items:center;gap:5px}
.ctx .bar{width:44px;height:5px;border-radius:3px;background:var(--column);overflow:hidden}
.ctx .bar i{display:block;height:100%;background:var(--c-work);border-radius:3px}
.ctx.hi .bar i{background:var(--warn)}.ctx.max .bar i{background:var(--bad)}

/* unlinked bucket */
.unlinked{margin-top:24px;scroll-margin-top:190px}
.unlinked .list{border-style:dashed;background:var(--ws)}
.unlinked .list-h{background:var(--ws)}
.unlinked .list-h h3{display:flex;align-items:center;gap:8px}
.unlinked .list-h h3 .n{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.unlinked .sess{margin:8px 16px}
.unlinked .sess:first-of-type{margin-top:10px}
.unlinked .sess:last-of-type{margin-bottom:12px}
.unlinked .why{padding:8px 16px 0;font-size:12px;color:var(--ink-soft)}
.unlinked .sessions{margin:0;padding:0}
.unlinked .sessions::before{display:none}
.unlinked .sess::before,.unlinked .sess::after{display:none}

/* ── session drawer (concept 2e) ─────────────────── */
.scrim{position:fixed;inset:0;background:rgba(42,46,67,.34);z-index:40;opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(820px,100vw);background:var(--card);z-index:50;box-shadow:-16px 0 48px rgba(42,46,67,.2);transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden;border-left:3px solid var(--hc,var(--brand))}
.drawer.on{transform:none}
.drawer-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px 18px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.drawer-h .t{min-width:0}
.drawer-h .eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.drawer-h .eyebrow .src{font-size:11.5px;color:var(--ink-faint)}
.drawer-h h2{margin:6px 0 0;font-size:17px;font-family:var(--mono);font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-h .sub{margin-top:5px;font-size:12.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.drawer-h .sub a{color:var(--brand-dark);text-decoration:none;display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:100%}
.drawer-h .sub a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38ch}
.drawer-h .sub a:hover span{text-decoration:underline}
.drawer-h .sub a svg{width:12px;height:12px;flex:none}
.drawer-h .x{align-self:start}
.model{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:var(--column);color:var(--ink-soft);font-size:11px;font-weight:600;font-family:var(--mono)}
.stats{display:flex;gap:6px;padding:10px 18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;background:var(--ws);flex:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:none;display:flex;align-items:center;gap:8px;min-height:42px;padding:4px 11px 4px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.stat .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.stat .l{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600;line-height:1.1;margin-top:3px;white-space:nowrap}
.ring{width:26px;height:26px;flex:none}
.ring circle{fill:none;stroke-width:3.2}
.ring .bg{stroke:var(--column)}
.ring .fg{stroke:var(--c-work);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.stat.hi .ring .fg{stroke:var(--warn)}.stat.max .ring .fg{stroke:var(--bad)}
.stat.max .v{color:var(--bad)}
.drawer-b{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) 260px;align-items:start}
.pane{min-width:0;padding:16px 18px 20px}
.tasks-rail{border-left:1px solid var(--line);background:var(--ws);padding:16px 14px 20px;min-width:0;align-self:stretch}
.sec-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec-h .age{font-weight:500;text-transform:none;letter-spacing:0;font-style:italic;margin-left:auto;white-space:nowrap}
.sum{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.sum > div{padding:9px 12px;border-top:1px solid var(--line)}
.sum > div:first-child{border-top:0}
.sum .k{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:2px}
.sum .now{background:var(--brand-soft)}
.sum .now .k{color:var(--brand-dark)}
.sum p{margin:0;font-size:13.5px;line-height:1.45}

/* terminal — the one dark surface, framed by the drawer's light chrome */
.term{--tbg:#161925;background:var(--tbg);color:#c9d1e6;border-radius:12px;overflow:hidden;border:1px solid #2a2f45;margin:0 0 12px;display:flex;flex-direction:column}
.term-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#1f2333;border-bottom:1px solid #2a2f45;font-size:11.5px;color:#9aa3c2;font-weight:600;min-width:0}
.term-bar .dots{display:flex;gap:5px;margin-right:2px;flex:none}
.term-bar .dots i{width:9px;height:9px;border-radius:50%;display:block}
.term-bar .ttl{font-family:var(--mono);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tbadge{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tbadge i{width:6px;height:6px;border-radius:50%}
.tbadge.live{background:rgba(39,174,96,.16);color:#5fdb96}.tbadge.live i{background:#3ecf7a;animation:pulse 1.4s infinite}
.tbadge.ask{background:rgba(240,85,95,.18);color:#ff8a92}.tbadge.ask i{background:#ff6b74;animation:pulseHot 1.2s infinite}
.tbadge.paused{background:rgba(240,169,46,.16);color:#ffcb6b}.tbadge.paused i{background:#f0a92e}
.tbadge.frozen,.tbadge.ended{background:rgba(152,161,179,.16);color:#a3abc4}.tbadge.frozen i,.tbadge.ended i{background:#6b7186}
.term-scroll{max-height:46vh;overflow:auto;padding:12px 14px 10px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;overscroll-behavior:contain}
.tl{display:block}
.tl.user{color:#eef1fb;margin-top:6px}
.tl.user::before{content:"❯ ";color:#8fd3a7;font-weight:700}
.tl.user:first-child{margin-top:0}
.tl.tool{color:#d8ddf0;margin-top:6px}
.tl.tool b{color:#b3a7ff;font-weight:600}
.tl.text,.tl.ok,.tl.err{color:#c9d1e6;margin-top:6px}
.tl.ok{color:#8fd3a7}.tl.err{color:#ff8a92}
.tl.out{color:#7d86a6;padding-left:2ch}
.tl.ask{color:#ffd6da;background:rgba(240,85,95,.11);border-left:2px solid #f0555f;padding:5px 10px;margin:8px 0 4px;border-radius:0 6px 6px 0}
.tl.opt{color:#e8ecf8;padding-left:2ch}
.tl.opt b{color:#8fd3a7;font-weight:600}
.tl.sys{color:#6b7186;font-style:italic;margin-top:6px}
.tl.spin{color:#b3a7ff;margin-top:6px}
.tl.spin .sp{display:inline-block;width:1ch}
.tmux{display:flex;font-family:var(--mono);font-size:11px;line-height:1.8;background:var(--hc,#27ae60);color:#fff;padding:0 8px;white-space:nowrap;overflow:hidden;gap:0}
.tmux .win{background:rgba(0,0,0,.3);padding:0 6px;margin:0 6px 0 4px;font-weight:700}
.tmux .r{margin-left:auto;opacity:.9}
.tmux.dead{background:#2a2f45;color:#8b91ad;font-style:italic}

/* reply composer (needs_input) */
.composer{border:1px solid #f7c5c9;background:var(--c-needs-bg);border-radius:12px;padding:12px;margin-bottom:12px}
.composer .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#b93540;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.composer .lbl .d{width:8px;height:8px;border-radius:50%;background:var(--c-needs);animation:pulseHot 1.2s infinite;flex:none}
.composer .q{font-size:13.5px;line-height:1.45;color:var(--ink);margin-bottom:9px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.opt-btn{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid #f0b3b8;background:#fff;font-size:12.5px;font-weight:600;color:#b93540}
.opt-btn:hover{background:#fff5f6}
.opt-btn[aria-pressed="true"]{background:var(--c-needs);border-color:var(--c-needs);color:#fff}
.composer textarea{width:100%;min-height:72px;padding:9px 11px;border:1px solid #f0b3b8;border-radius:9px;font:inherit;font-size:14px;line-height:1.4;background:#fff;resize:vertical;display:block}
.composer textarea:focus{outline:2px solid var(--c-needs);outline-offset:1px}
.composer .row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.composer .row .hint{white-space:normal}
.composer.sent{background:#e8f7ee;border-color:#bfe6cd}
.composer.sent .lbl{color:#1d7a43}
.composer.sent .lbl .d{background:var(--ok);animation:none}
.composer.sent .q{color:var(--ink-soft);font-style:italic}

/* resume (ended) */
.resume-box{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--ws);margin-bottom:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center}
.resume-box .t{font-size:13px;line-height:1.45;color:var(--ink-soft)}
.resume-box .t b{color:var(--ink);display:block;margin-bottom:2px}
.note{font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.45;padding:10px 12px;border-radius:10px;background:var(--c-stale-bg);border:1px dashed var(--c-stale)}
.note b{color:var(--ink)}

/* task rail */
.trow{display:block;width:100%;text-align:left;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:6px;text-decoration:none;color:inherit}
.trow:hover{border-color:#cfc7f7}
.trow.this{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.trow .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-dark);margin-bottom:4px}
.trow .nm{font-size:13px;font-weight:600;line-height:1.35;display:flex;gap:6px;align-items:flex-start}
.trow .nm .prio{width:14px;height:14px;margin-top:2px}
.trow .nm .prio svg{width:12px;height:12px}
.trow .m{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px;font-size:11.5px;color:var(--ink-soft);align-items:center}
.trow .m .chip{height:20px;font-size:10.5px}
.trow .m .tid{margin-left:auto}
.trow .m .live{color:#1e64c8;font-weight:600}
.trow.sib .nm{font-weight:500}
.rail-note{font-size:12.5px;color:var(--ink-soft);line-height:1.45;margin:0 0 10px}
.rail-actions{display:flex;flex-direction:column;gap:8px}
.drawer-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--card);flex:none;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.drawer-f .spacer{flex:1}
@media (max-width:899px){
  .drawer-b{grid-template-columns:1fr}
  .tasks-rail{border-left:0;border-top:1px solid var(--line)}
}

.picker{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:min(520px,calc(100vw - 24px));max-height:min(80vh,640px);background:var(--card);border-radius:14px;box-shadow:0 24px 60px rgba(42,46,67,.28);z-index:50;display:none;flex-direction:column;overflow:hidden}
.picker.on{display:flex}
.picker-h{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.picker-h h2{margin:0;font-size:15px}
.picker-h p{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft)}
.picker-h input{width:100%;margin-top:10px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:var(--ws)}
.picker-b{overflow:auto;padding:6px}
.pk-grp{padding:8px 10px 2px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.pk-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:44px;padding:8px 10px;border-radius:8px}
.pk-item:hover{background:var(--column)}
.pk-item .nm{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.pk-item .nm small{display:block;font-family:var(--mono);color:var(--ink-faint);font-size:11px}
.picker-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(42,46,67,.28);z-index:60;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* phone sheet (folders nav) */
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;z-index:50;transform:translateY(105%);transition:transform .2s cubic-bezier(.2,.8,.2,1);max-height:78vh;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(42,46,67,.2);padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet-h{padding:10px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet-h::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.sheet-h h2{margin:6px 0 0;font-size:15px;flex:1}
.sheet-b{overflow:auto;padding:6px 8px 12px}
.sheet-b .tree-list{min-height:44px}

/* ── phone ─────────────────────────────────────────── */
@media (max-width:720px){
  :root{--tap:44px}
  .app{grid-template-columns:1fr;height:auto;min-height:100vh}
  .rail{display:none}
  .main{overflow:visible}
  .hdr{top:0}
  .hdr-top{padding:12px 14px 0;flex-wrap:wrap;gap:8px}
  .hdr-title h1{font-size:18px}
  .hdr-title .built{display:none}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;background:var(--column);border-radius:10px;width:100%;order:3}
  .seg button{min-height:44px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-soft)}
  .seg button[aria-current="true"]{background:var(--card);color:var(--brand-dark);box-shadow:var(--shadow)}
  .seg button b{color:var(--c-needs)}
  .hdr-top .folders-btn{margin-left:auto;order:2}
  .hdr-counts{padding:10px 14px 0}
  .count{min-width:84px;padding:6px 10px}
  .count b{font-size:18px}
  .hdr-hosts{padding:8px 14px 10px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .hdr-hosts::-webkit-scrollbar{display:none}
  .host-chip{min-height:34px;flex:none}
  .host-chip::after{content:"";position:absolute;inset:-5px 0}
  .btn.sm{min-height:44px}
  .ext{padding:15px 6px;margin:-15px -6px}
  .task-name a{display:inline-block;padding:14px 0;margin:-14px 0}
  .host-chip .why{position:fixed;left:14px;right:14px;top:auto;bottom:auto;max-width:none;width:auto;margin-top:6px}
  .content{padding:12px 12px 140px}
  .list{scroll-margin-top:230px}
  .list-h{padding:10px 12px}
  .task-row{grid-template-columns:auto minmax(0,1fr);gap:10px;padding:12px 12px 10px}
  .task-act{grid-column:2;justify-content:flex-start;padding-top:8px;width:100%}
  .task-act .btn{flex:1}
  .dispatch-wrap{align-items:stretch;width:100%}
  .dispatch-wrap .btn{width:100%}
  .dispatch-wrap .hint{text-align:center;white-space:normal}
  .dispatching{justify-content:center;width:100%}
  .parked{margin:2px 12px 12px 12px}
  .sessions{margin:0 12px 12px 12px;padding-left:18px}
  .sessions::before{left:5px}
  .sess{grid-template-columns:1fr;padding:10px 12px}
  .sess::before{left:-13px;width:11px;top:22px}
  .sess::after{left:-4px;top:18px}
  .sess-act{flex-direction:row;align-items:center;justify-content:space-between;margin-top:6px;width:100%}
  .sess-act .btn{flex:1}
  .sess-act .ctx{order:-1;flex:none}
  .sess-act .ctx{display:none}
  .drawer{top:auto;left:0;right:0;width:auto;max-height:92vh;max-height:92dvh;border-radius:16px 16px 0 0;border-left:0;border-top:3px solid var(--hc,var(--brand));transform:translateY(105%);box-shadow:0 -10px 40px rgba(42,46,67,.2)}
  .drawer.on{transform:none}
  .drawer::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
  .drawer-h{padding:18px 14px 10px}
  .drawer-h h2{font-size:15px}
  .stats{padding:8px 14px}
  .pane{padding:14px 14px 16px}
  .tasks-rail{padding:14px 14px 18px}
  .term-scroll{max-height:42vh}
  .resume-box{grid-template-columns:1fr}
  .drawer-f{padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  .drawer-f .btn{flex:1}
  .drawer-f .spacer{display:none}
  .picker{top:auto;bottom:0;left:0;transform:none;width:100%;max-height:82vh;border-radius:16px 16px 0 0}
  .tree-list{min-height:44px}
}
@media (min-width:721px){
  .folders-btn{display:none}
  .sheet{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<body>
<div class="app" id="app">
  <!-- ── Left rail: Spaces + Folders ─────────────────── -->
  <aside class="rail" aria-label="Spaces and folders">

    <nav class="spaces" id="rail-spaces" aria-label="Spaces"></nav>

</div>

<div class="scrim" id="scrim"></div>

<!-- session drawer (concept 2e) -->
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>

<script>
/* ── data (verbatim copy of space-data.json) ──────────────────────────── */

  answered: new Set(),                  // parked tasks answered (mock)
  answering: null,                      // task id with the answer box open
  links: {},                            // session_id → [task ids] added by the mock Link picker
  pickerFor: null,
  drawerFor: null,
  replied: {}                           // session_id → reply text sent from the drawer composer (mock)
};
const TODAY = SPACE.builtAt.slice(0,10);

/* ── helpers ───────────────────────────────────────────────────────────── */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HOST_COLOR = { mactop:'var(--h-mactop)', mini:'var(--h-mini)', macbook:'var(--h-macbook)' };
const STATUS_RANK = { needs_input:0, working:1, waiting:2, stale:3, ended:4 };
const STATUS_LABEL = { needs_input:'needs input', working:'working', waiting:'waiting', stale:'stale', ended:'ended' };
const AS_LABEL = { 'needs-triage':'needs triage', 'ready-for-human':'ready for human', 'ready-for-agent':'ready for agent', 'in-progress':'in progress', 'needs-info':'needs info', 'out-of-scope':'out of scope' };
const TIER_COPY = { attach:'Attach to the live tmux — full context.', resume:'Resume from the saved transcript — recent tool output not restored.', revive:'Revive into a fresh session from a distilled brief — context was maxed; partial by design.' };

function sessionTasks(s){ return [...(s.clickupTasks||[]), ...(state.links[s.session_id]||[])]; }
function sessionsFor(taskId){ return SPACE.sessions.filter(s => sessionTasks(s).includes(taskId)).sort((a,b)=>STATUS_RANK[effStatus(a)]-STATUS_RANK[effStatus(b)]); }
function unlinkedSessions(){ return SPACE.sessions.filter(s => sessionTasks(s).length===0); }
function currentSpace(){ return SPACE.spaces.find(s=>s.id===state.spaceId); }
function spaceTasks(sp){ return sp.folders.flatMap(f=>f.lists.flatMap(l=>l.tasks)); }
function findTask(id){ for(const sp of SPACE.spaces) for(const t of spaceTasks(sp)) if(t.id===id) return {task:t, space:sp}; return null; }
function effStatus(s){ return state.replied[s.session_id] ? 'working' : s.status; }
function findList(taskId){ for(const sp of SPACE.spaces) for(const f of sp.folders) for(const l of f.lists) if(l.tasks.some(t=>t.id===taskId)) return {list:l, folder:f, space:sp}; return null; }
function isLive(s){ return s.status==='working'||s.status==='needs_input'||s.status==='waiting'; }
function needsYou(t){ return (t.agent_state==='needs-info' && !state.answered.has(t.id)) || sessionsFor(t.id).some(s=>effStatus(s)==='needs_input'); }
function inProg(t){ return t.agent_state==='in-progress' || t.status==='in progress' || sessionsFor(t.id).some(isLive); }
function rank(t){ return needsYou(t)?0 : inProg(t)?1 : 2; }
function sortTasks(ts){ return [...ts].sort((a,b)=> rank(a)-rank(b) || a.priority-b.priority || String(a.due||'9').localeCompare(String(b.due||'9'))); }
function canDispatch(t){ return t.doneWhen && ['ready-for-agent','needs-triage','ready-for-human'].includes(t.agent_state); }
function stats(sp){
  const tasks = spaceTasks(sp);
  const ids = new Set(tasks.map(t=>t.id));
  const live = SPACE.sessions.filter(s => isLive(s) && sessionTasks(s).some(id=>ids.has(id)));
  return {
    open: tasks.length,
    needsYou: tasks.filter(needsYou).length,
    live: live.length,
    parked: tasks.filter(t=>t.agent_state==='needs-info').length,
    proposed: tasks.filter(t=>t.status==='proposed-done').length
  };
}
function fmtDue(d){
  if(!d) return {cls:'none', text:'no due'};
  const dt = new Date(d+'T12:00:00'); const label = dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  if(d<TODAY){ const days=Math.round((new Date(TODAY+'T12:00:00')-dt)/864e5); return {cls:'over', text:`${label} · ${days}d overdue`}; }
  if(d===TODAY) return {cls:'today', text:`due today`};
  return {cls:'', text:label};
}
function fmtAge(sec){ if(sec<60) return `${sec}s`; if(sec<3600) return `${Math.round(sec/60)}m`; const h=Math.floor(sec/3600), m=Math.round((sec%3600)/60); return m?`${h}h ${m}m`:`${h}h`; }
function fmtTok(n){ return n>=1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'')+'M' : Math.round(n/1e3)+'k'; }
function summaryAge(s){ const m=s.summaryAgeMin; return m<1?'summary <1m old': m<60?`summary ${m}m old`:`summary ${Math.floor(m/60)}h ${m%60}m old`; }
function initials(n){ return n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

/* ── render: rail + phone segmented control ───────────────────────────── */
function renderSpaces(){
  const rail = $('#rail-spaces'), seg = $('#seg');
  rail.innerHTML=''; seg.innerHTML='';

    const st = stats(sp); const cur = sp.id===state.spaceId;
    rail.insertAdjacentHTML('beforeend', `<button class="space-btn" type="button" data-space="${sp.id}" aria-current="${cur}"><span class="space-key">${esc(sp.key)}</span><span class="nm">${esc(sp.name)}</span><span class="ct">${st.needsYou?`<b>${st.needsYou}</b> · `:''}${st.open}</span></button>`);
    seg.insertAdjacentHTML('beforeend', `<button type="button" role="tab" data-space="${sp.id}" aria-current="${cur}">${esc(sp.key)}${st.needsYou?` <b>${st.needsYou}</b>`:''}</button>`);
  }
}
function treeHTML(sp){
  let h='';
  for(const f of sp.folders){
    h += `<div class="tree-folder"><div class="tree-folder-h">${ICON.folder}${esc(f.name)}</div>`;

  return h;
}
function renderTree(){ const sp=currentSpace(); $('#rail-tree').innerHTML = treeHTML(sp); $('#sheet-body').innerHTML = treeHTML(sp); }

/* ── render: header ───────────────────────────────────────────────────── */
function renderHeader(){
  const sp = currentSpace(); const st = stats(sp);
  $('#space-name').textContent = sp.name;
  $('#built').textContent = `built ${new Date(SPACE.builtAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})} · from ${SPACE.self}`;
  $('#counts').innerHTML = [
    ['open', st.open, 'open tasks', ''],
    ['needs', st.needsYou, 'need you', st.needsYou?'hot':''],
    ['live', st.live, 'live sessions', 'live'],

  ].map(([k,n,l,c])=>`<div class="count ${c}"><b>${n}</b><span>${l}</span></div>`).join('');
  const hosts = $('#hosts'); hosts.querySelectorAll('.host-chip').forEach(n=>n.remove());
  for(const [name,h] of Object.entries(SPACE.hosts)){
    const why = h.liveness==='fresh' ? `Publishing normally — last fleet snapshot ${fmtAge(h.publishAgeSec)} ago.` : h.liveness==='stale' ? `Stale: ${esc(h.note||'no recent publish')}. Sessions shown for this host may be out of date.` : `Dead: no publish in ${fmtAge(h.publishAgeSec)}. Its sessions are unknown.`;
    hosts.insertAdjacentHTML('beforeend', `<button class="host-chip ${h.liveness}" type="button" aria-expanded="false" title="${why}"><span class="dot" aria-hidden="true"></span><span class="nm">${name}</span><span class="age">${h.liveness==='fresh'?fmtAge(h.publishAgeSec):'stale · '+fmtAge(h.publishAgeSec)}</span><span class="why" role="tooltip">${why}</span></button>`);
  }
}

/* ── render: sessions inline ──────────────────────────────────────────── */
function sessionHTML(s, {unlinked=false}={}){
  const ended = s.status==='ended';
  const st = effStatus(s); const replied = state.replied[s.session_id];
  const ctxCls = s.contextPct>=90?'max': s.contextPct>=70?'hi':'';
  const action = ended
    ? `<button class="btn ghost" type="button" data-open="${s.session_id}">Open ${ICON.open}</button><button class="btn" type="button" data-resume="${s.session_id}" title="${TIER_COPY[s.resumeTier]}">${ICON.resume}Resume <span class="tier ${s.resumeTier}">${s.resumeTier}</span></button>`
    : `<button class="btn ${st==='needs_input'?'primary':''}" type="button" data-open="${s.session_id}">${st==='needs_input'?'Answer':'Open'} ${ICON.open}</button>`;
  const link = unlinked ? `<button class="btn" type="button" data-link="${s.session_id}">${ICON.link}Link task</button>` : '';
  const src = s.source==='omnara' ? `<span class="k">via</span> omnara` : `<span class="k">via</span> rail`;
  return `<div class="sess ${st}" style="--join:${HOST_COLOR[s.host]}" data-sid="${s.session_id}" title="Open session">
    <div class="sess-main">
      <div class="sess-line1">
        <span class="host" style="--hc:${HOST_COLOR[s.host]}">${esc(s.host)}</span>
        <span class="sstat ${st}"><span class="d"></span>${replied?'resuming':STATUS_LABEL[st]}</span>
        <span class="sname">${esc(s.name)}</span>
      </div>
      <div class="sess-meta">
        <span>${esc(s.model)}</span>
        <span><span class="k">branch</span> ${esc(s.branch)}</span>
        <span><span class="k">active</span> ${esc(s.elapsedActive)}</span>
        <span><span class="k">idle</span> ${esc(s.idle)}</span>
        <span><span class="k">ctx</span> ${s.contextPct}%</span>
        <span>${src}</span>
        <span class="age">${summaryAge(s)}</span>
      </div>
      <div class="sess-now"><span class="k">now</span>${replied ? 'Resuming with your reply: “'+esc(replied)+'”' : esc(s.summary.now)}</div>
    </div>
    <div class="sess-act">
      ${link}${action}
      <span class="ctx ${ctxCls}" title="context ${s.contextPct}% · ${fmtTok(s.tokens)} tokens · ${s.msgs} msgs · $${s.cost.toFixed(2)}"><span class="bar"><i style="width:${s.contextPct}%"></i></span><span class="hint">${fmtTok(s.tokens)} · $${s.cost.toFixed(1)}</span></span>
    </div>
  </div>`;
}

/* ── render: task row ─────────────────────────────────────────────────── */
function taskHTML(t){
  const ss = sessionsFor(t.id);
  const due = fmtDue(t.due);
  const stCls = t.status==='to do'?'todo': t.status==='in progress'?'prog':'pdone';
  const hot = needsYou(t);
  const dispatching = state.dispatching.has(t.id);
  let act='';
  if(dispatching){
    act = `<span class="dispatching"><span class="spin" aria-hidden="true"></span>dispatching…</span>`;
  } else if(ss.length===0 && t.agent_state!=='needs-info'){
    if(canDispatch(t)){
      act = `<div class="dispatch-wrap"><button class="btn primary" type="button" data-dispatch="${t.id}">${ICON.play}Dispatch</button><span class="hint">spawns on ${SPACE.self}</span></div>`;
    } else if(!t.doneWhen){
      act = `<div class="dispatch-wrap"><button class="btn primary" type="button" disabled title="Add a DONE-WHEN contract in ClickUp to make this dispatchable">${ICON.play}Dispatch</button><span class="hint">needs DONE-WHEN</span></div>`;
    } else {
      act = `<div class="dispatch-wrap"><button class="btn primary" type="button" disabled>${ICON.play}Dispatch</button><span class="hint">${AS_LABEL[t.agent_state]} — not dispatchable</span></div>`;
    }
  } else if(t.status==='proposed-done'){
    act = `<button class="btn" type="button" data-confirm="${t.id}">${ICON.check}Confirm done</button>`;
  }
  const parked = t.agent_state==='needs-info' ? parkedHTML(t) : '';
  const joinColor = ss.length ? HOST_COLOR[ss[0].host] : 'var(--line)';
  return `<article class="task ${hot?'is-hot':''} ${dispatching?'is-dispatching':''}" id="task-${t.id}">
    <div class="task-row">
      <span class="prio p${t.priority}" title="priority ${t.priority} · ${t.priority===1?'drop everything':t.priority===2?'normal':'whenever'}">${ICON.flag}</span>
      <div class="task-main">
        <h4 class="task-name"><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a></h4>
        <div class="task-meta">
          <span class="st ${stCls}"><span class="sq"></span>${esc(t.status)}</span>
          <span class="chip as-${t.agent_state}">${AS_LABEL[t.agent_state]}</span>
          <span class="due ${due.cls}">${ICON.cal}${due.text}</span>
          <span class="dw ${t.doneWhen?'ok':'missing'}" title="${t.doneWhen?'DONE-WHEN contract present':'No DONE-WHEN contract — agents cannot self-verify'}">${t.doneWhen?ICON.check+'DONE-WHEN':ICON.warn+'no DONE-WHEN'}</span>
          <span class="assg"><span class="av ${t.assignee==='Jarred'?'j':''}">${initials(t.assignee)}</span>${esc(t.assignee)}</span>
          <a class="ext" href="${esc(t.url)}" target="_blank" rel="noopener" title="Open in ClickUp"><span class="tid">${esc(t.id)}</span>${ICON.ext}</a>
        </div>
      </div>
      <div class="task-act">${act}</div>
    </div>
    ${parked}
    ${ss.length ? `<div class="sessions" style="--join:${joinColor}">${ss.map(s=>sessionHTML(s)).join('')}</div>` : ''}
  </article>`;
}
function parkedHTML(t){
  const done = state.answered.has(t.id); const open = state.answering===t.id;
  return `<div class="parked ${done?'answered':''}">
    <span class="q-ic" aria-hidden="true">${done?ICON.check:'?'}</span>
    <div class="q"><span class="lbl">${done?'Answered · session resuming':'Parked — waiting on you'}</span>${esc(t.question)}
      ${done ? '' : open
        ? `<textarea id="ans-${t.id}" placeholder="Type the answer the session should resume on…" aria-label="Answer"></textarea><div class="q-act"><button class="btn primary" type="button" data-send-answer="${t.id}">Send answer</button><button class="btn ghost" type="button" data-cancel-answer="${t.id}">Cancel</button></div>`
        : `<div class="q-act"><button class="btn primary" type="button" data-answer="${t.id}">Answer</button><span class="hint">resumes the parked session with your reply</span></div>`}
    </div>
  </div>`;
}

/* ── render: content ──────────────────────────────────────────────────── */
function renderContent(){
  const sp = currentSpace();
  let h='';
  for(const f of sp.folders){
    h += `<section class="folder"><h2 class="folder-h">${ICON.folder}${esc(f.name)}<span class="rule"></span></h2>`;
    for(const l of f.lists){
      const ts = sortTasks(l.tasks); const ny = ts.filter(needsYou).length;
      const liveN = ts.reduce((n,t)=>n+sessionsFor(t.id).filter(isLive).length,0);
      h += `<div class="list" id="list-${l.id}"><div class="list-h"><h3>${esc(l.name)}</h3><span class="ct">${ts.length? (ny?`<b>${ny} need you</b> · `:'')+`${ts.length} open`:'0 open'}</span><span class="spacer"></span>${liveN?`<span class="pill">${liveN} live</span>`:''}</div>`;
      h += ts.length ? ts.map(taskHTML).join('') : `<div class="list-empty"><span class="z">${ICON.check}</span>No open tasks in ${esc(l.name)} — nothing to dispatch here.</div>`;
      h += `</div>`;
    }
    h += `</section>`;
  }
  const un = unlinkedSessions().sort((a,b)=>STATUS_RANK[effStatus(a)]-STATUS_RANK[effStatus(b)]);
  h += `<section class="unlinked" id="unlinked"><h2 class="folder-h">${ICON.link}Unlinked<span class="rule"></span></h2><div class="list"><div class="list-h"><h3><span class="n">${un.length}</span>Sessions with no task</h3><span class="spacer"></span><span class="pill">fleet-wide</span></div>
    ${un.length ? `<div class="why">These sessions publish no ClickUp task id. They are shown in every Space until linked.</div><div class="sessions">${un.map(s=>sessionHTML(s,{unlinked:true})).join('')}</div>` : `<div class="list-empty"><span class="z">${ICON.check}</span>Every session is linked to a task.</div>`}
  </div></section>`;
  $('#content').innerHTML = h;
}
function render(){ renderSpaces(); renderTree(); renderHeader(); renderContent(); }

/* ── overlays ─────────────────────────────────────────────────────────── */
function openScrim(){ $('#scrim').classList.add('on'); }

/* ── session drawer (concept 2e) ─────────────────────────────────────── */
const SPIN = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
let spinTimer=null;
function stopSpin(){ clearInterval(spinTimer); spinTimer=null; }
function startSpin(){
  stopSpin();
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const els = document.querySelectorAll('#drawer .tl.spin .sp'); if(!els.length) return;
  let i=0; spinTimer=setInterval(()=>{ i=(i+1)%SPIN.length; els.forEach(e=>e.textContent=SPIN[i]); },110);
}
function termLine([k,s]){
  const t = esc(s);
  switch(k){
    case 'user': return `<span class="tl user">${t}</span>`;
    case 'tool': return `<span class="tl tool">⏺ ${t.replace(/^(\w+)\(/,'<b>$1</b>(')}</span>`;
    case 'text': return `<span class="tl text">⏺ ${t}</span>`;
    case 'ok':   return `<span class="tl ok">⏺ ${t}</span>`;
    case 'err':  return `<span class="tl err">⏺ ${t}</span>`;
    case 'out':  return `<span class="tl out">⎿  ${t}</span>`;
    case 'cont': return `<span class="tl out">   ${t}</span>`;
    case 'ask':  return `<span class="tl ask">${t}</span>`;
    case 'opt':  return `<span class="tl opt">${t.replace(/^(\d\.\s)([^—]+?)(\s—)/,'$1<b>$2</b>$3')}</span>`;
    case 'sys':  return `<span class="tl sys">${t}</span>`;
    case 'spin': return `<span class="tl spin"><span class="sp" aria-hidden="true">⠋</span> ${t}</span>`;
  }
  return '';
}
function ringHTML(pct){ const C=(2*Math.PI*10.5).toFixed(2); return `<svg class="ring" viewBox="0 0 26 26" aria-hidden="true"><circle class="bg" cx="13" cy="13" r="10.5"/><circle class="fg" cx="13" cy="13" r="10.5" stroke-dasharray="${C}" stroke-dashoffset="${(C*(1-pct/100)).toFixed(2)}"/></svg>`; }
function trowHTML(t, isThis){
  const due=fmtDue(t.due); const live=sessionsFor(t.id).filter(isLive).length;
  return `<a class="trow ${isThis?'this':'sib'}" href="${esc(t.url)}" target="_blank" rel="noopener" title="Open in ClickUp">
    ${isThis?'<span class="tag">This session’s task</span>':''}
    <div class="nm"><span class="prio p${t.priority}">${ICON.flag}</span><span>${esc(t.name)}</span></div>
    <div class="m"><span class="chip as-${t.agent_state}">${AS_LABEL[t.agent_state]}</span><span class="due ${due.cls}">${ICON.cal}${due.text}</span><span class="dw ${t.doneWhen?'ok':'missing'}">${t.doneWhen?ICON.check:ICON.warn}${t.doneWhen?'DONE-WHEN':'no DONE-WHEN'}</span>${!isThis&&live?`<span class="live">${live} live</span>`:''}<span class="tid">${esc(t.id)}</span></div>
  </a>`;
}
function openDrawer(id){
  const s = SPACE.sessions.find(x=>x.session_id===id); if(!s) return;
  state.drawerFor=id;
  const st = effStatus(s); const replied = state.replied[s.session_id];
  const tr = TRANSCRIPT[s.session_id] || {lines:[]};
  const linked = sessionTasks(s).map(findTask).filter(Boolean);
  const hc = HOST_COLOR[s.host];
  const d=$('#drawer'); d.style.setProperty('--hc', hc);

  // header: host tag · status · model · tmux name · project/branch · task link(s)
  $('#drawer-head').innerHTML = `
    <div class="t">
      <div class="eyebrow"><span class="host" style="--hc:${hc}">${esc(s.host)}</span><span class="sstat ${st}"><span class="d"></span>${replied?'resuming':STATUS_LABEL[st]}</span><span class="model">${esc(s.model)}</span><span class="src">via ${esc(s.source)}</span></div>
      <h2 id="drawer-title">${esc(s.name)}</h2>
      <div class="sub"><span>${esc(s.project)} · <span class="mono">${esc(s.branch)}</span></span>${linked.map(x=>`<a href="${esc(x.task.url)}" target="_blank" rel="noopener">${ICON.ext}<span>${esc(x.task.name)}</span></a>`).join('')}${linked.length?'':'<span class="hint">no task linked</span>'}</div>
    </div>
    <button class="btn ghost sm x" type="button" data-close aria-label="Close session drawer">Close</button>`;

  // numeric chips
  const ctxCls = s.contextPct>=90?'max': s.contextPct>=70?'hi':'';
  $('#drawer-stats').innerHTML = `
    <div class="stat ${ctxCls}" title="context window used">${ringHTML(s.contextPct)}<div><div class="v">${s.contextPct}%</div><div class="l">context</div></div></div>
    <div class="stat" title="${s.tokens.toLocaleString()} tokens"><div><div class="v">${fmtTok(s.tokens)}</div><div class="l">tokens</div></div></div>
    <div class="stat"><div><div class="v">${s.msgs}</div><div class="l">msgs</div></div></div>
    <div class="stat" title="estimated from token counts"><div><div class="v">~$${s.cost.toFixed(2)}</div><div class="l">est. cost</div></div></div>
    <div class="stat"><div><div class="v">${esc(s.elapsedActive)} <span style="color:var(--ink-faint);font-weight:500">/</span> ${esc(s.idle)}</div><div class="l">active / idle</div></div></div>`;

  // terminal
  const badge = st==='working' ? `<span class="tbadge live"><i></i>live</span>`
    : st==='needs_input' ? `<span class="tbadge ask"><i></i>waiting for you</span>`
    : st==='waiting' ? `<span class="tbadge paused"><i></i>idle ${esc(s.idle)}</span>`
    : st==='stale' ? `<span class="tbadge frozen"><i></i>frozen · ${esc(s.lastActivity)}</span>`
    : `<span class="tbadge ended"><i></i>ended · ${esc(s.lastActivity)}</span>`;
  let lines = tr.lines.map(termLine).join('');
  if(replied) lines += termLine(['user', replied]) + termLine(['spin','Resuming with your reply… (esc to interrupt)']);
  const clock = new Date(SPACE.builtAt).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
  const tmux = st==='ended'
    ? `<div class="tmux dead">no server running — session ${esc(s.name)} exited ${esc(s.lastActivity)}</div>`
    : `<div class="tmux" aria-hidden="true">[${esc(s.name)}]<span class="win">0:claude*</span>${esc(s.project)}<span class="r">"${HOSTNAME[s.host]}" ${clock}</span></div>`;
  const term = `<div class="term" role="region" aria-label="Terminal tail">
    <div class="term-bar"><span class="dots" aria-hidden="true"><i style="background:#f0555f"></i><i style="background:#f0a92e"></i><i style="background:#27ae60"></i></span><span class="ttl">${s.source==='rail'?'tmux':'omnara'} · ${esc(s.name)} · ${esc(s.host)}</span>${badge}</div>
    <div class="term-scroll" id="term-scroll" tabindex="0">${lines || '<span class="tl sys">(no transcript captured for this session)</span>'}</div>
    ${tmux}
  </div>`;

  // composer / resume / notes
  let action='';
  if(st==='needs_input'){
    const q = (tr.lines.find(l=>l[0]==='ask')||[,s.summary.now])[1];
    action = `<div class="composer">
      <div class="lbl"><span class="d" aria-hidden="true"></span>Waiting on you · idle ${esc(s.idle)}</div>
      <div class="q">${esc(q)}</div>
      ${tr.options?`<div class="opts">${tr.options.map(o=>`<button class="opt-btn" type="button" data-reply-opt="${esc(o)}" aria-pressed="false">${esc(o)}</button>`).join('')}</div>`:''}
      <textarea id="reply-box" placeholder="Reply to the session…" aria-label="Reply to the session" rows="3"></textarea>
      <div class="row"><button class="btn primary" type="button" data-reply-send="${s.session_id}">${ICON.open}Send reply</button><span class="hint">lands in the tmux pane as your next turn</span></div>
    </div>`;
  } else if(replied){
    action = `<div class="composer sent"><div class="lbl"><span class="d" aria-hidden="true"></span>Reply sent · session resuming</div><div class="q">“${esc(replied)}”</div></div>`;
  } else if(st==='ended'){
    action = `<div class="resume-box"><div class="t"><b>Resume is a ${s.resumeTier}.</b>${esc(TIER_COPY[s.resumeTier])} It never claims a full restore.</div><button class="btn primary" type="button" data-resume="${s.session_id}">${ICON.resume}Resume <span class="tier" style="background:rgba(255,255,255,.22);color:#fff">${s.resumeTier}</span></button></div>`;
  } else if(st==='stale'){
    action = `<p class="note"><b>Stale.</b> ${esc(SPACE.hosts[s.host].note||'Host has not published recently')} — this tail is frozen and may be out of date.</p>`;
  } else if(st==='waiting'){
    action = `<p class="note"><b>Idle, nothing pending.</b> Attach to give it the next step; the summary above is ${summaryAge(s).replace('summary ','')}.</p>`;
  }

  // task rail: this task + siblings in the same List
  const linkedIds = new Set(linked.map(x=>x.task.id));
  const sibs=[]; const seen=new Set(); let listName='';
  for(const x of linked){ const L=findList(x.task.id); if(!L) continue; listName=L.list.name; for(const t of L.list.tasks){ if(!linkedIds.has(t.id) && !seen.has(t.id)){ seen.add(t.id); sibs.push(t); } } }
  const rail = `
    <div class="sec-h">Tasks</div>
    ${linked.length ? linked.map(x=>trowHTML(x.task,true)).join('') : `<p class="rail-note">Not linked to a ClickUp task, so it shows in the Unlinked bucket of every Space.</p><div class="rail-actions"><button class="btn" type="button" data-link="${s.session_id}">${ICON.link}Link task</button></div>`}
    ${sibs.length ? `<div class="sec-h" style="margin-top:14px">Also in ${esc(listName)}</div>${sortTasks(sibs).map(t=>trowHTML(t,false)).join('')}` : ''}`;

  $('#drawer-body').innerHTML = `
    <div class="pane">
      <div class="sec-h">Summary<span class="age">${summaryAge(s)} · last activity ${esc(s.lastActivity)}</span></div>
      <div class="sum">
        <div class="now"><span class="k">Now</span><p>${replied ? 'Resuming with your reply: “'+esc(replied)+'”' : esc(s.summary.now)}</p></div>
        <div><span class="k">Next</span><p>${esc(s.summary.next)}</p></div>
        <div><span class="k">Goal</span><p>${esc(s.summary.goal)}</p></div>
      </div>
      <div class="sec-h">Terminal<span class="age">${st==='working'?'streaming':st==='ended'?'final tail':'last '+tr.lines.length+' lines'}</span></div>
      ${term}
      ${action}
    </div>
    <aside class="tasks-rail" aria-label="Tasks for this session">${rail}</aside>`;

  $('#drawer-foot').innerHTML = st==='ended'
    ? `<button class="btn primary" type="button" data-resume="${s.session_id}">${ICON.resume}Resume <span class="tier" style="background:rgba(255,255,255,.22);color:#fff">${s.resumeTier}</span></button><span class="spacer"></span><button class="btn" type="button" data-close>Close</button>`
    : `<button class="btn ${st==='needs_input'?'':'primary'}" type="button" data-attach="${s.session_id}">${ICON.open}Attach to tmux</button>${linked.length?'':`<button class="btn" type="button" data-link="${s.session_id}">${ICON.link}Link task</button>`}<span class="spacer"></span><button class="btn" type="button" data-close>Close</button>`;

  d.hidden=false; document.body.classList.add('lock');
  requestAnimationFrame(()=>{ d.classList.add('on'); openScrim(); const ts=$('#term-scroll'); if(ts) ts.scrollTop=ts.scrollHeight; startSpin(); d.querySelector('[data-close]').focus(); });
}

function openPicker(id){
  const s = SPACE.sessions.find(x=>x.session_id===id); if(!s) return;
  state.pickerFor=id;
  $('#picker-sub').innerHTML = `Attach <span class="mono">${esc(s.name)}</span> (${esc(s.project)} · ${esc(s.branch)}) to a task in ${esc(currentSpace().name)}.`;
  $('#picker-q').value='';
  renderPicker('');
  $('#drawer').classList.remove('on'); $('#drawer').hidden=true; stopSpin();
  $('#picker').classList.add('on'); openScrim(); $('#picker-q').focus();
}
function renderPicker(q){
  const sp=currentSpace(); q=q.trim().toLowerCase(); let h='';
  for(const f of sp.folders) for(const l of f.lists){
    const ts = l.tasks.filter(t=>!q || t.name.toLowerCase().includes(q) || t.id.includes(q));
    if(!ts.length) continue;
    h += `<div class="pk-grp">${esc(f.name)} / ${esc(l.name)}</div>`;
    h += ts.map(t=>`<button class="pk-item" type="button" data-pick="${t.id}"><span class="prio p${t.priority}">${ICON.flag}</span><span class="nm">${esc(t.name)}<small>${esc(t.id)} · ${AS_LABEL[t.agent_state]}</small></span>${ICON.link}</button>`).join('');
  }
  $('#picker-body').innerHTML = h || `<div class="list-empty">No task matches “${esc(q)}”.</div>`;
}

/* ── events ───────────────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const b = e.target.closest('button, a'); if(!b) return;
  const d = b.dataset;
  if(d.space){ state.spaceId=d.space; state.answering=null; render(); closeAll(); $('#main').scrollTo({top:0}); window.scrollTo({top:0}); return; }
  if(d.jump){ closeAll(); const el=document.getElementById(d.jump); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(b.id==='folders-btn'){ const sh=$('#sheet'); sh.hidden=false; requestAnimationFrame(()=>{ sh.classList.add('on'); openScrim(); }); return; }
  if(b.classList.contains('host-chip')){ const on=b.classList.toggle('open'); b.setAttribute('aria-expanded',on); document.querySelectorAll('.host-chip.open').forEach(x=>{ if(x!==b){x.classList.remove('open');x.setAttribute('aria-expanded','false');} }); return; }
  if(d.dispatch){ state.dispatching.add(d.dispatch); render(); toast(`Dispatching ${d.dispatch} on ${SPACE.self} — a session will appear under the task once the rail publishes it.`); return; }
  if(d.open){ openDrawer(d.open); return; }
  if(d.attach){ closeAll(); toast(`Attaching to ${SPACE.sessions.find(s=>s.session_id===d.attach).name} (mock)`); return; }
  if(d.resume){ const s=SPACE.sessions.find(x=>x.session_id===d.resume); closeAll(); toast(`Resume (${s.resumeTier}): ${TIER_COPY[s.resumeTier]}`); return; }
  if(d.replyOpt!==undefined){ const ta=$('#reply-box'); if(ta){ ta.value=d.replyOpt; ta.focus(); } document.querySelectorAll('.opt-btn').forEach(x=>x.setAttribute('aria-pressed', x===b ? 'true':'false')); return; }
  if(d.replySend){ const ta=$('#reply-box'); const v=(ta?ta.value:'').trim(); if(!v){ ta?.focus(); toast('Type a reply first.'); return; }
    state.replied[d.replySend]=v; const s=SPACE.sessions.find(x=>x.session_id===d.replySend);
    for(const id of sessionTasks(s)){ const t=findTask(id); if(t && t.task.agent_state==='needs-info'){ state.answered.add(id); if(state.answering===id) state.answering=null; } }
    render(); openDrawer(d.replySend); toast('Reply sent — the session resumes with it (mock).'); return; }
  if(d.link){ openPicker(d.link); return; }
  if(d.pick){ const sid=state.pickerFor; (state.links[sid] ||= []).push(d.pick); const t=findTask(d.pick).task; closeAll(); render(); toast(`Linked to “${t.name}”`); document.getElementById('task-'+d.pick)?.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if(d.answer){ state.answering=d.answer; render(); document.getElementById('ans-'+d.answer)?.focus(); return; }
  if(d.cancelAnswer){ state.answering=null; render(); return; }
  if(d.sendAnswer){ const ta=document.getElementById('ans-'+d.sendAnswer); if(!ta.value.trim()){ ta.focus(); toast('Type an answer first.'); return; } state.answered.add(d.sendAnswer); state.answering=null; render(); toast('Answer sent — the parked session resumes with it (mock).'); return; }
  if(d.confirm){ toast(`Confirm done for ${d.confirm} — would move the ClickUp task to done (mock).`); return; }
  if(b.hasAttribute('data-close') || b.id==='scrim'){ closeAll(); return; }
});
$('#scrim').addEventListener('click', closeAll);
// clicking anywhere on a session chip (not on one of its buttons/links) opens the drawer
document.addEventListener('click', e => { if(e.target.closest('button, a, textarea, input')) return; const c=e.target.closest('.sess[data-sid]'); if(c) openDrawer(c.dataset.sid); });
$('#picker-q').addEventListener('input', e => renderPicker(e.target.value));
document.addEventListener('keydown', e => { if(e.key==='Escape') closeAll(); });
document.addEventListener('click', e => { if(!e.target.closest('.host-chip')) document.querySelectorAll('.host-chip.open').forEach(x=>{x.classList.remove('open');x.setAttribute('aria-expanded','false');}); }, true);

render();
</script>
</body>
</html>
