<!-- fleetboard space view · concept 07 cockpit · instrument-strip of health gauges on top, dense task-tile grid below, needs-you pinned first with a hot border · phone-first, light theme, self-contained -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FleetBoard — Space · cockpit</title>
<style>
:root{
  --brand:#7b68ee; --brand-dark:#5f4dd0; --brand-soft:#efecfd;
  --ink:#2a2e43; --ink-soft:#6b7186; --ink-faint:#9aa1b5;
  --line:#e6e9f2; --ws:#fafbfc; --column:#f3f4f7; --card:#fff;
  --c-needs:#f0555f; --c-needs-bg:#fdeef0;
  --c-work:#4c9aff;  --c-work-bg:#eef5ff;
  --c-wait:#f0a92e;  --c-wait-bg:#fdf6ea;
  --c-stale:#98a1b3; --c-stale-bg:#f3f4f7;
  --ok:#27ae60; --warn:#f0a92e; --bad:#e5484d;
  --shadow:0 1px 3px rgba(42,46,67,.08), 0 1px 2px rgba(42,46,67,.05);
  --h-mactop:#5f4dd0; --h-mini:#0e9994; --h-macbook:#0073ea;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --tap:40px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ws);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- sticky space header ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(250,251,252,.9);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1248px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.wordmark{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.wordmark i{width:11px;height:11px;border-radius:3px;background:var(--brand);transform:rotate(45deg);display:inline-block}
.wordmark small{font-weight:500;color:var(--ink-faint);font-size:12px}
.seg{display:flex;background:var(--column);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-left:auto}
.seg button{border:0;background:transparent;border-radius:8px;padding:0 12px;min-height:calc(var(--tap) - 8px);font-weight:600;color:var(--ink-soft)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.space-name{color:var(--ink-soft);font-size:13px;white-space:nowrap}
.space-name b{color:var(--ink);font-weight:600}

main{max-width:1248px;margin:0 auto;padding:14px 16px 96px}

/* ---------- instrument strip ---------- */
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.stat{grid-column:span 2;min-width:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;box-shadow:var(--shadow);min-height:96px;display:flex;flex-direction:column;justify-content:space-between;position:relative;transition:box-shadow .15s,border-color .15s}
.stat:nth-child(4),.stat:nth-child(5){grid-column:span 3}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600;display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:6px;row-gap:1px}
.stat .l em{font-style:normal;color:var(--ink-faint);letter-spacing:0;text-transform:none;font-weight:500}
.stat .n{font-size:40px;font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.stat .gauge{height:3px;border-radius:2px;background:var(--column);overflow:hidden}
.stat .gauge i{display:block;height:100%;width:var(--w,0%);background:var(--gc,var(--brand));transition:width .4s ease}
.stat:hover{border-color:#d4d8e6}
.stat[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft),var(--shadow)}
.stat.hot .n{color:var(--c-needs)}
.stat.hot[aria-pressed=true]{border-color:var(--c-needs);box-shadow:0 0 0 3px var(--c-needs-bg),var(--shadow)}
.stat.zero .n{color:var(--ink-faint)}

.hosts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.hosts .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:600;margin-right:2px}
.host-chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 12px 0 9px;min-height:32px;font-size:12px}
.host-chip .d{width:8px;height:8px;border-radius:50%;background:var(--hc)}
.host-chip .nm{font-family:var(--mono);font-weight:600;color:var(--hc)}
.host-chip .ag{color:var(--ink-soft)}
.host-chip.stale{border-style:dashed;border-color:var(--warn);background:var(--c-wait-bg)}
.host-chip.stale .d{background:var(--warn);box-shadow:0 0 0 3px rgba(240,169,46,.2)}
.host-chip.stale .ag{color:#9a6a12}
.host-chip.dead .d{background:var(--bad)}
.host-note{flex-basis:100%;font-size:12px;color:#9a6a12;background:var(--c-wait-bg);border:1px dashed var(--warn);border-radius:8px;padding:8px 10px}
.host-note b{color:var(--ink)}

/* ---------- filter chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 12px;align-items:center}
.chips .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:600;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 12px;min-height:34px;font-size:13px;color:var(--ink-soft)}
.chip .f{color:var(--ink-faint)}
.chip .f::after{content:"›";margin:0 4px;color:var(--ink-faint)}
.chip .c{font-variant-numeric:tabular-nums;background:var(--column);border-radius:999px;padding:0 7px;font-size:11px;font-weight:600;color:var(--ink-soft);min-width:20px;text-align:center}
.chip.empty{color:var(--ink-faint);border-style:dashed}
.chip[aria-pressed=true]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-dark);font-weight:600}
.chip[aria-pressed=true] .c{background:#fff;color:var(--brand-dark)}
.chip.clear{border-color:transparent;background:transparent;color:var(--brand-dark);font-weight:600}

/* ---------- task grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:12px;align-items:start}
.gh{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin:8px 0 -2px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-soft)}
.gh .c{font-variant-numeric:tabular-nums;color:var(--ink-faint);font-weight:600;letter-spacing:0}
.gh.hot{color:var(--c-needs)}
.gh::after{content:"";flex:1;height:1px;background:var(--line)}
.gh.hot::after{background:var(--c-needs-bg)}

.tile{min-width:0;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;position:relative}
.tile.needs{border:2px solid var(--c-needs);box-shadow:0 0 0 4px var(--c-needs-bg),var(--shadow);padding:11px 13px 13px}
.tile.proposed{border-left:4px solid var(--ok);padding-left:11px}
.tile.dispatching{border-color:var(--c-work);background:linear-gradient(180deg,var(--c-work-bg),#fff 60%)}
.crumbs{display:flex;align-items:center;gap:8px;min-height:24px}
.crumb{border:0;background:transparent;padding:0;font-size:12px;color:var(--ink-faint);display:inline-flex;align-items:center;gap:4px;min-height:24px;border-radius:6px}
.crumb:hover{color:var(--brand-dark)}
.crumb b{font-weight:500;color:var(--ink-soft)}
.crumb span{color:var(--ink-faint)}
.pri{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:.02em}
.pri.p1{background:var(--c-needs-bg);color:var(--bad)}
.pri.p2{background:var(--column);color:var(--ink-soft)}
.pri.p3{color:var(--ink-faint);border:1px solid var(--line)}
.name{margin:0;font-size:15px;line-height:1.35;font-weight:600;letter-spacing:-.005em}
.name a{text-decoration:none;color:var(--ink)}
.name a:hover{color:var(--brand-dark)}
.name svg{width:12px;height:12px;vertical-align:-1px;margin-left:5px;color:var(--ink-faint)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.pill{border-radius:6px;padding:2px 8px;font-weight:600;font-size:11px;letter-spacing:.01em;white-space:nowrap}
.st-to-do{background:var(--column);color:var(--ink-soft);border:1px solid var(--line)}
.st-in-progress{background:var(--c-work-bg);color:#2a6fcf}
.st-proposed-done{background:#e8f7ee;color:#1e7f47}
.as{border-radius:999px;padding:2px 9px 2px 7px;font-weight:600;font-size:11px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.as::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.as-needs-triage{background:var(--c-wait-bg);color:#a1620c}
.as-ready-for-human{background:var(--brand-soft);color:var(--brand-dark)}
.as-ready-for-agent{background:var(--c-work-bg);color:#2a6fcf}
.as-in-progress{background:#e8f7ee;color:#1e7f47}
.as-needs-info{background:var(--c-needs-bg);color:#c8323c}
.as-needs-info::before{border-radius:2px;transform:rotate(45deg)}
.as-out-of-scope{background:var(--c-stale-bg);color:var(--ink-soft);text-decoration:line-through}
.due{color:var(--ink-soft);white-space:nowrap}
.due.over{color:var(--bad);font-weight:700}
.due.today{color:#a1620c;font-weight:600}
.due.none{color:var(--ink-faint)}
.dw{white-space:nowrap;font-weight:600;font-size:11px}
.dw.ok{color:var(--ok)}
.dw.miss{color:#a1620c}
.who{margin-left:auto;color:var(--ink-faint);font-size:12px}

/* parked question */
.park{background:var(--c-needs-bg);border:1px solid #f7c9cd;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.park .q{font-size:13px;line-height:1.45;color:#7a1f26}
.park .q b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--c-needs);margin-bottom:3px}
.park .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.park .done{font-size:12px;color:#1e7f47;font-weight:600}

/* session strip */
.sessions{display:flex;flex-direction:column;gap:6px}
.srow{min-width:0;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--ws);display:grid;gap:5px}
.srow.needs_input{border-color:var(--c-needs);background:#fff}
.srow.working{border-left:3px solid var(--c-work)}
.srow.waiting{border-left:3px solid var(--c-wait)}
.srow.stale{border-style:dashed}
.srow.ended{opacity:.78;border-style:dashed;background:var(--column)}
.s1{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px}
.host{font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--hc);border-radius:5px;padding:2px 6px;letter-spacing:.02em}
.h-mactop{--hc:var(--h-mactop)} .h-mini{--hc:var(--h-mini)} .h-macbook{--hc:var(--h-macbook)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--sc);flex:none}
.sdot.needs_input{--sc:var(--c-needs);animation:pulse 1.4s ease-in-out infinite}
.sdot.working{--sc:var(--c-work);animation:pulse 2.2s ease-in-out infinite}
.sdot.waiting{--sc:var(--c-wait)}
.sdot.stale{--sc:var(--c-stale)}
.sdot.ended{--sc:transparent;border:2px solid var(--ink-faint)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--sc)}50%{box-shadow:0 0 0 4px transparent}}
.slab{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
.slab.needs_input{color:var(--c-needs)} .slab.working{color:#2a6fcf} .slab.waiting{color:#a1620c} .slab.stale,.slab.ended{color:var(--ink-soft)}
.sname{color:var(--ink-soft)}
.s2{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.now{font-size:13px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.srow.needs_input .now{font-weight:600}
.s3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.age{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.s3 .btn{margin-left:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;white-space:nowrap;box-shadow:var(--shadow);transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:#cfd4e3;background:var(--ws)}
.btn.primary{background:var(--brand);border-color:var(--brand-dark);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--brand-dark)}
.btn.primary:disabled{background:var(--column);border-color:var(--line);color:var(--ink-faint);box-shadow:none}
.btn.hot{background:var(--c-needs);border-color:#d5434d;color:#fff}
.btn.hot:hover:not(:disabled){background:#d5434d}
.btn.ghost{background:transparent;box-shadow:none}
.btn .tier{font-family:var(--mono);font-size:10.5px;font-weight:700;background:var(--brand-soft);color:var(--brand-dark);border-radius:5px;padding:1px 6px;text-transform:uppercase;letter-spacing:.04em}
.btn .tier.revive{background:var(--c-wait-bg);color:#a1620c}
.btn .tier.resume{background:var(--c-work-bg);color:#2a6fcf}
.dispatch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.hint{font-size:12px;color:var(--ink-faint)}
.hint.warn{color:#a1620c;font-weight:600}
.dispatching-row{display:flex;align-items:center;gap:10px;font-weight:600;color:#2a6fcf;min-height:var(--tap)}
.dispatching-row .sub{font-weight:500;color:var(--ink-soft);font-size:12px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--c-work-bg);border-top-color:var(--c-work);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* empty tiles */
.tile.emptylist{border-style:dashed;background:transparent;box-shadow:none;gap:4px}
.tile.emptylist .name{color:var(--ink-soft);font-weight:500}
.tile.emptylist p{margin:0;font-size:12px;color:var(--ink-faint)}
.nothing{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--ink-soft);border:1px dashed var(--line);border-radius:14px}
.nothing b{display:block;color:var(--ink);margin-bottom:6px}

/* unlinked panel */
.unlinked{margin-top:22px;background:var(--column);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px}
.unlinked .uh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.unlinked .uh h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.unlinked .uh .c{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.unlinked .uh p{margin:0;font-size:12px;color:var(--ink-faint)}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:10px}
.ugrid .srow{background:#fff}
.ugrid .age{flex-basis:100%}.ugrid .s3 .btn{margin-left:0}.ugrid .s3 .btn:first-of-type{margin-left:auto}
.src{font-size:10.5px;font-family:var(--mono);color:var(--ink-faint);border:1px solid var(--line);border-radius:4px;padding:1px 5px}

/* dialogs */
dialog{border:0;padding:0;background:var(--card);color:var(--ink);border-radius:16px;box-shadow:0 20px 60px rgba(42,46,67,.25);width:min(560px,calc(100% - 32px));max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(42,46,67,.38)}
dialog.drawer{width:440px;max-width:calc(100% - 32px);height:100vh;max-height:100vh;margin:0 0 0 auto;border-radius:0}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.dh h2{margin:0;font-size:15px;flex:1;line-height:1.3}
.dh .x{border:0;background:var(--column);width:36px;height:36px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.db{padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--column);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:600}
.kv span{font-variant-numeric:tabular-nums;font-weight:600}
.sum{display:grid;gap:8px}
.sum div{border-left:3px solid var(--line);padding:2px 0 2px 10px;font-size:13px}
.sum div b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:600}
.sum .n{border-color:var(--brand)}
.term{background:#1c1f2b;color:#d7dae5;font:12px/1.55 var(--mono);border-radius:10px;padding:12px 14px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term .p{color:#8f9bb3} .term .g{color:#7fd8a3} .term .y{color:#f0c46e} .term .b{color:#8bb8ff}
.df{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.df .btn{flex:1}
.note{font-size:12px;color:var(--ink-soft);background:var(--column);border-radius:8px;padding:8px 10px}
.note.warn{background:var(--c-wait-bg);color:#7a4d08}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.picker{display:flex;flex-direction:column;gap:4px}
.picker .pg{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:600;margin:8px 0 2px}
.picker button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;min-height:var(--tap);display:flex;align-items:center;gap:8px}
.picker button:hover{border-color:var(--brand);background:var(--brand-soft)}
.picker button .id{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-left:auto}
.picker button.linked{opacity:.6}

/* toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(42,46,67,.3);opacity:0;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- phone ---------- */
@media (max-width:719px){
  :root{--tap:44px}
  .top-in{flex-wrap:wrap;gap:8px}
  .space-name{order:3;flex-basis:100%;font-size:12px}
  .seg button{min-height:44px;min-width:44px;padding:0 10px}
  .host-chip{min-height:44px}
  .crumb{min-height:44px;margin:-10px 0}
  .stat{min-height:92px;padding:10px 12px 9px}
  .stat .n{font-size:34px}
  .chip{min-height:44px}
  .pw{display:none}
  .grid{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:repeat(2,1fr)}
  dialog{width:100%;max-width:100%;margin:auto 0 0 0;max-height:88vh;border-radius:16px 16px 0 0}
  dialog.drawer{width:100%;height:auto;max-height:90vh;margin:auto 0 0 0;border-radius:16px 16px 0 0}
  .dh{padding:12px 14px} .db{padding:12px 14px 24px}
}
@media (min-width:720px){
  .strip{grid-template-columns:repeat(5,minmax(0,1fr))}
  .stat,.stat:nth-child(4),.stat:nth-child(5){grid-column:auto}
}
@media (prefers-reduced-motion:reduce){
  .sdot,.spin{animation:none}
  .stat .gauge i{transition:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="wordmark"><i></i>FleetBoard <small>Space</small></div>
    <div class="seg" id="spacePicker" role="group" aria-label="Space"></div>
    <div class="space-name" id="spaceName"></div>
  </div>
</header>

<main>
  <section class="strip" id="strip" aria-label="Space health"></section>
  <div class="hosts" id="hosts"></div>
  <div class="chips" id="chips" aria-label="Filters"></div>
  <section class="grid" id="grid" aria-live="polite"></section>
  <section class="unlinked" id="unlinked"></section>

/* ---------------- constants ---------------- */
const LIVE = new Set(['needs_input','working','waiting']);
const SRANK = {needs_input:0,working:1,waiting:2,stale:3,ended:4};
const SLABEL = {needs_input:'needs input',working:'working',waiting:'waiting',stale:'stale',ended:'ended'};
const ASTATE = {'needs-triage':'needs triage','ready-for-human':'ready for human','ready-for-agent':'ready for agent','in-progress':'in progress','needs-info':'parked · needs info','out-of-scope':'out of scope'};
const PRI = {1:'P1 · drop everything',2:'P2 · normal',3:'P3 · whenever'};
const TIER = {attach:'attach · live tmux, full context',resume:'resume · transcript replay, partial context',revive:'revive · fresh session from a distilled handoff'};
const DISPATCHABLE = new Set(['ready-for-agent','needs-triage','ready-for-human']);
const TODAY = new Date(SPACE.builtAt.slice(0,10)+'T12:00:00');

const state = {
  data: JSON.parse(JSON.stringify(SPACE)),
  spaceId: 'sp-ws', kind: 'all', list: null,
  dispatching: {}, answered: {}, hostNote: null
};

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const space = () => state.data.spaces.find(s => s.id === state.spaceId);
const sessionsFor = id => state.data.sessions.filter(s => s.clickupTasks.includes(id)).sort((a,b)=>SRANK[a.status]-SRANK[b.status]);
const unlinked = () => state.data.sessions.filter(s => s.clickupTasks.length === 0).sort((a,b)=>SRANK[a.status]-SRANK[b.status]);
function rows(sp){ const out=[]; for(const f of sp.folders) for(const l of f.lists) for(const t of l.tasks) out.push({task:t,folder:f,list:l}); return out; }
function lists(sp){ const out=[]; for(const f of sp.folders) for(const l of f.lists) out.push({list:l,folder:f}); return out; }
function tier(t){ const ss=sessionsFor(t.id); if((t.agent_state==='needs-info'&&!state.answered[t.id])||ss.some(s=>s.status==='needs_input')) return 0; if(t.agent_state==='in-progress'||ss.some(s=>LIVE.has(s.status))) return 1; return 2; }
function fmtDue(d){
  if(!d) return {cls:'none',txt:'no due date'};
  const dt=new Date(d+'T12:00:00'); const days=Math.round((dt-TODAY)/864e5);
  const lab=dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  if(days<0) return {cls:'over',txt:`overdue · ${lab}`};
  if(days===0) return {cls:'today',txt:`due today`};
  return {cls:'',txt:`due ${lab}`};
}
function fmtAge(sec){ if(sec<60) return sec+'s'; const m=Math.round(sec/60); if(m<60) return m+'m'; const h=Math.floor(m/60); return h+'h '+String(m%60).padStart(2,'0')+'m'; }
function fmtMin(m){ return m<60 ? m+'m' : Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'; }
function fmtTok(n){ return n>=1e6 ? (n/1e6).toFixed(1)+'M' : Math.round(n/1e3)+'k'; }
const findTask = id => { for(const sp of state.data.spaces) for(const f of sp.folders) for(const l of f.lists) for(const t of l.tasks) if(t.id===id) return {task:t,folder:f,list:l,space:sp}; return null; };
const EXT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3H3v10h10v-3M9 3h4v4M13 3 7 9"/></svg>';

/* ---------------- render ---------------- */
function render(){ renderHeader(); renderStrip(); renderHosts(); renderChips(); renderGrid(); renderUnlinked(); }

function renderHeader(){
  $('#spacePicker').innerHTML = state.data.spaces.map(s=>`<button data-action="space" data-space="${s.id}" aria-pressed="${s.id===state.spaceId}">${esc(s.key)}</button>`).join('');
  const sp=space(); const n=rows(sp).length;
  $('#spaceName').innerHTML = `<b>${esc(sp.name)}</b> · ${sp.folders.length} folders · ${lists(sp).length} lists · built ${new Date(state.data.builtAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})} on ${esc(state.data.self)}`;
}

function counts(){
  const sp=space(); const rs=rows(sp);
  const open=rs.length;
  const needs=rs.filter(r=>tier(r.task)===0).length;
  const ids=new Set(rs.map(r=>r.task.id));
  const live=state.data.sessions.filter(s=>LIVE.has(s.status)&&s.clickupTasks.some(id=>ids.has(id))).length;
  const parked=rs.filter(r=>r.task.agent_state==='needs-info'&&!state.answered[r.task.id]).length;
  const proposed=rs.filter(r=>r.task.status==='proposed-done').length;
  return {open,needs,live,parked,proposed};
}

function renderStrip(){
  const c=counts(); const max=Math.max(1,c.open);
  const tiles=[
    {k:'all',l:'Open tasks',n:c.open,em:'in this Space',gc:'var(--brand)',w:100},
    {k:'needs',l:'Needs you',n:c.needs,em:'answer or decide',gc:'var(--c-needs)',w:c.needs/max*100,hot:true},
    {k:'live',l:'Live sessions',n:c.live,em:'on tasks here',gc:'var(--c-work)',w:c.live/max*100},
    {k:'parked',l:'Parked',n:c.parked,em:'waiting on info',gc:'var(--c-wait)',w:c.parked/max*100},
    {k:'proposed',l:'Proposed done',n:c.proposed,em:'confirm to close',gc:'var(--ok)',w:c.proposed/max*100},
  ];
  $('#strip').innerHTML = tiles.map(t=>`<button class="stat${t.hot&&t.n?' hot':''}${t.n?'':' zero'}" data-action="kind" data-kind="${t.k}" aria-pressed="${state.kind===t.k}" style="--gc:${t.gc};--w:${t.w.toFixed(0)}%">
    <span class="l">${t.l}<em>${t.em}</em></span>
    <span class="n">${t.n}</span>
    <span class="gauge"><i></i></span>
  </button>`).join('');
}

function renderHosts(){
  const h=state.data.hosts;
  let html=`<span class="k">Hosts</span>`+Object.keys(h).map(k=>{
    const v=h[k]; const stale=v.liveness!=='fresh';
    const lab=v.liveness==='fresh'?`<span class="pw">published </span>${fmtAge(v.publishAgeSec)} ago`:`${v.liveness} · ${fmtAge(v.publishAgeSec)} ago`;
    return `<button class="host-chip ${v.liveness} h-${k}" data-action="host" data-host="${k}" aria-pressed="${state.hostNote===k}" title="${esc(v.note||lab.replace(/<[^>]+>/g,''))}"><span class="d"></span><span class="nm">${k}</span><span class="ag">${lab}</span></button>`;
  }).join('');
  if(state.hostNote && h[state.hostNote]){
    const v=h[state.hostNote];
    html+=`<div class="host-note"><b>${esc(state.hostNote)} is ${v.liveness}.</b> ${esc(v.note||'No fresh publish from this host.')} Session rows from it show the last state it reported, not what it is doing now.</div>`;
  }
  $('#hosts').innerHTML=html;
}

function renderChips(){
  const sp=space(); const ls=lists(sp);
  let html=`<span class="k">Folder › List</span>`;
  html+=ls.map(({list,folder})=>`<button class="chip${list.tasks.length?'':' empty'}" data-action="list" data-list="${list.id}" aria-pressed="${state.list===list.id}"><span class="f">${esc(folder.name)}</span>${esc(list.name)}<span class="c">${list.tasks.length}</span></button>`).join('');
  if(state.list||state.kind!=='all') html+=`<button class="chip clear" data-action="clear">Clear filters ×</button>`;
  $('#chips').innerHTML=html;
}

function matchKind(t){
  switch(state.kind){
    case 'needs': return tier(t)===0;
    case 'live': return sessionsFor(t.id).some(s=>LIVE.has(s.status));
    case 'parked': return t.agent_state==='needs-info'&&!state.answered[t.id];
    case 'proposed': return t.status==='proposed-done';
    default: return true;
  }
}

function renderGrid(){
  const sp=space();
  let rs=rows(sp).filter(r=>(!state.list||r.list.id===state.list)&&matchKind(r.task));
  rs.sort((a,b)=>tier(a.task)-tier(b.task)||a.task.priority-b.task.priority||((a.task.due||'9')<(b.task.due||'9')?-1:1));
  const groups=[{t:0,l:'Needs you',hot:true},{t:1,l:'In progress'},{t:2,l:'Ready & backlog'}];
  let html='';
  for(const g of groups){
    const items=rs.filter(r=>tier(r.task)===g.t); if(!items.length) continue;
    html+=`<div class="gh${g.hot?' hot':''}">${g.l}<span class="c">${items.length}</span></div>`+items.map(tileHTML).join('');
  }
  const empties=lists(sp).filter(x=>!x.list.tasks.length&&(!state.list||x.list.id===state.list)&&state.kind==='all');
  if(empties.length){
    html+=`<div class="gh">Nothing open<span class="c">${empties.length}</span></div>`+empties.map(({list,folder})=>`<article class="tile emptylist"><div class="crumbs"><span class="crumb"><b>${esc(folder.name)}</b><span>›</span>${esc(list.name)}</span></div><h3 class="name">0 open tasks in ${esc(list.name)}</h3><p>Nothing to dispatch or resume here. Add a task in ClickUp to see it land.</p></article>`).join('');
  }
  if(!html) html=`<div class="nothing"><b>No tasks match these filters.</b>Try another gauge or list.<br><br><button class="btn" data-action="clear">Clear filters</button></div>`;
  $('#grid').innerHTML=html;
}

function tileHTML(r){
  const t=r.task, ss=sessionsFor(t.id), tr=tier(t), disp=state.dispatching[t.id], due=fmtDue(t.due);
  const cls=['tile',tr===0?'needs':'',t.status==='proposed-done'?'proposed':'',disp?'dispatching':''].filter(Boolean).join(' ');
  let body='';
  if(t.agent_state==='needs-info'){
    body+=`<div class="park"><div class="q"><b>Question from the agent</b>${esc(t.question)}</div><div class="row">${state.answered[t.id]?`<span class="done">✓ Answer sent · session resuming</span>`:`<button class="btn hot" data-action="answer" data-task="${t.id}">Answer</button><span class="hint">unblocks ${ss.length?ss[0].name:'the task'}</span>`}</div></div>`;
  }
  if(ss.length){
    body+=`<div class="sessions">${ss.map(sessionRow).join('')}</div>`;
  } else if(disp){
    body+=`<div class="dispatching-row"><span class="spin"></span>dispatching…<span class="sub">spawning on mactop via the launch rail</span></div>`;
  } else {
    const ok=t.doneWhen&&DISPATCHABLE.has(t.agent_state);
    const hint=!t.doneWhen?`<span class="hint warn">needs DONE-WHEN</span>`:!DISPATCHABLE.has(t.agent_state)?`<span class="hint">not dispatchable while ${ASTATE[t.agent_state]}</span>`:`<span class="hint">no session yet · spawns on mactop</span>`;
    body+=`<div class="dispatch"><button class="btn primary" data-action="dispatch" data-task="${t.id}" ${ok?'':'disabled'}>Dispatch</button>${hint}</div>`;
  }
  return `<article class="${cls}" data-task="${t.id}">
    <div class="crumbs"><button class="crumb" data-action="list" data-list="${r.list.id}" title="Filter to this list"><b>${esc(r.folder.name)}</b><span>›</span>${esc(r.list.name)}</button><span class="pri p${t.priority}" title="${PRI[t.priority]}">P${t.priority}</span></div>
    <h3 class="name"><a href="${esc(t.url)}" target="_blank" rel="noopener" title="Open in ClickUp">${esc(t.name)}${EXT}</a></h3>
    <div class="meta">
      <span class="pill st-${t.status.replace(/\s+/g,'-')}">${esc(t.status)}${t.status==='proposed-done'?' · confirm?':''}</span>
      <span class="as as-${t.agent_state}">${ASTATE[t.agent_state]||esc(t.agent_state)}</span>
      <span class="due ${due.cls}">${due.txt}</span>
      <span class="dw ${t.doneWhen?'ok':'miss'}" title="${t.doneWhen?'Has a DONE-WHEN contract':'No DONE-WHEN contract — cannot dispatch'}">${t.doneWhen?'✓ DONE-WHEN':'⚠ no DONE-WHEN'}</span>
      <span class="who">${esc(t.assignee)}</span>
    </div>
    ${body}
  </article>`;
}

function sessionRow(s, opts={}){
  const ended=s.status==='ended';
  const action= ended
    ? `<button class="btn ghost" data-action="resume" data-sid="${s.session_id}" title="${TIER[s.resumeTier]}">Resume <b class="tier ${s.resumeTier}">${s.resumeTier}</b></button>`
    : `<button class="btn" data-action="open" data-sid="${s.session_id}">Open session</button>`;
  const link = opts.link ? `<button class="btn primary" data-action="link" data-sid="${s.session_id}">Link task</button>` : '';
  return `<div class="srow ${s.status}">
    <div class="s1"><span class="host h-${s.host}">${s.host}</span><span class="sdot ${s.status}"></span><span class="slab ${s.status}">${SLABEL[s.status]}</span><span class="mono sname">${esc(s.name)}</span>${s.source==='omnara'?'<span class="src">omnara</span>':''}</div>
    <div class="s2">${esc(s.model)} · ${esc(s.branch)} · ${s.elapsedActive} active · idle ${s.idle} · ctx ${s.contextPct}%</div>
    <div class="now">${esc(s.summary.now)}</div>
    <div class="s3"><span class="age">summary ${fmtMin(s.summaryAgeMin)} old · last activity ${esc(s.lastActivity)}</span>${link}${action}</div>
  </div>`;
}

function renderUnlinked(){
  const us=unlinked();
  $('#unlinked').innerHTML=`<div class="uh"><h2>Unlinked sessions</h2><span class="c">${us.length}</span><p>Running with no ClickUp task — not counted in any Space above. Link one so it shows on its task.</p></div>
  ${us.length?`<div class="ugrid">${us.map(s=>sessionRow(s,{link:true})).join('')}</div>`:`<div class="note">Every session is linked to a task.</div>`}`;
}

/* ---------------- dialogs ---------------- */
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800); }

function openSession(s){
  const tasks=s.clickupTasks.map(findTask).filter(Boolean);
  const d=$('#dlgSession');
  d.innerHTML=`<div class="dh"><span class="host h-${s.host}">${s.host}</span><h2 class="mono">${esc(s.name)}</h2><button class="x" data-action="close" aria-label="Close">×</button></div>
  <div class="db">
    <div class="s1"><span class="sdot ${s.status}"></span><span class="slab ${s.status}">${SLABEL[s.status]}</span><span class="sname">${esc(s.project)} · ${esc(s.branch)} · ${esc(s.model)} · via ${s.source}</span></div>
    ${tasks.length?`<div class="note">On task${tasks.length>1?'s':''}: ${tasks.map(x=>`<b>${esc(x.task.name)}</b> <span class="mono">${x.task.id}</span>`).join(' · ')}</div>`:`<div class="note warn">No task linked.</div>`}
    <div class="kv"><div><b>Active</b><span>${s.elapsedActive}</span></div><div><b>Idle</b><span>${s.idle}</span></div><div><b>Messages</b><span>${s.msgs}</span></div><div><b>Context</b><span>${s.contextPct}%</span></div><div><b>Tokens</b><span>${fmtTok(s.tokens)}</span></div><div><b>Cost</b><span>$${s.cost.toFixed(2)}</span></div></div>
    <div class="sum"><div class="n"><b>Now · summary ${fmtMin(s.summaryAgeMin)} old</b>${esc(s.summary.now)}</div><div><b>Next</b>${esc(s.summary.next)}</div><div><b>Goal</b>${esc(s.summary.goal)}</div></div>
    <div class="term"><span class="p">$ tmux attach -t ${esc(s.name)}   # ${s.host}</span>
<span class="g">●</span> <span class="b">${esc(s.branch)}</span> · ctx ${s.contextPct}% · ${s.msgs} msgs
<span class="y">›</span> ${esc(s.summary.now)}
<span class="p">— transcript preview is a placeholder in this mockup —</span></div>
    ${state.data.hosts[s.host].liveness!=='fresh'?`<div class="note warn">${s.host} is ${state.data.hosts[s.host].liveness}: this is the last state it published ${fmtAge(state.data.hosts[s.host].publishAgeSec)} ago.</div>`:''}
    <div class="df">${s.status==='ended'?`<button class="btn primary" data-action="resume" data-sid="${s.session_id}">Resume <b class="tier ${s.resumeTier}">${s.resumeTier}</b></button>`:`<button class="btn primary" data-action="attach" data-sid="${s.session_id}">Attach in tmux</button>`}<button class="btn" data-action="close">Close</button></div>
  </div>`;
  d.showModal();
}

function openLink(s){
  const d=$('#dlgLink');
  let body='';
  for(const sp of state.data.spaces) for(const f of sp.folders) for(const l of f.lists){
    if(!l.tasks.length) continue;
    body+=`<div class="pg">${esc(sp.key)} › ${esc(f.name)} › ${esc(l.name)}</div>`+l.tasks.map(t=>`<button data-action="pick" data-sid="${s.session_id}" data-task="${t.id}"><span class="as as-${t.agent_state}">${ASTATE[t.agent_state]}</span>${esc(t.name)}<span class="id">${t.id}</span></button>`).join('');
  }
  d.innerHTML=`<div class="dh"><h2>Link <span class="mono">${esc(s.name)}</span> to a task</h2><button class="x" data-action="close" aria-label="Close">×</button></div><div class="db"><div class="note">Sets <span class="mono">clickupTasks</span> on the session row. The session then appears on that task's tile and counts toward its Space.</div><div class="picker">${body}</div></div>`;
  d.showModal();
}

function openAnswer(t){
  const d=$('#dlgAnswer'); const s=sessionsFor(t.id)[0];
  d.innerHTML=`<div class="dh"><h2>Answer the agent</h2><button class="x" data-action="close" aria-label="Close">×</button></div>
  <div class="db"><div class="note"><b>${esc(t.name)}</b></div><div class="park"><div class="q"><b>Question</b>${esc(t.question)}</div></div>
  <label><span class="sr">Your answer</span><textarea id="answerText" placeholder="Type the decision. It goes to ${s?esc(s.name):'the task'} as the next turn."></textarea></label>
  <div class="df"><button class="btn hot" data-action="send-answer" data-task="${t.id}">Send answer</button><button class="btn" data-action="close">Cancel</button></div></div>`;
  d.showModal(); setTimeout(()=>$('#answerText').focus(),50);
}

/* ---------------- events ---------------- */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action; const sid=el.dataset.sid; const s=sid&&state.data.sessions.find(x=>x.session_id===sid);
  switch(a){
    case 'space': state.spaceId=el.dataset.space; state.kind='all'; state.list=null; render(); window.scrollTo({top:0}); break;
    case 'kind': state.kind=(state.kind===el.dataset.kind&&el.dataset.kind!=='all')?'all':el.dataset.kind; render(); break;
    case 'list': state.list=state.list===el.dataset.list?null:el.dataset.list; render(); break;
    case 'clear': state.kind='all'; state.list=null; render(); break;
    case 'host': state.hostNote=state.hostNote===el.dataset.host?null:el.dataset.host; renderHosts(); break;
    case 'dispatch': { const id=el.dataset.task; state.dispatching[id]=true; render(); toast('Dispatching '+id+' to mactop via the launch rail'); break; }
    case 'open': openSession(s); break;
    case 'attach': toast(`Attaching to ${s.name} on ${s.host} (mock)`); el.closest('dialog').close(); break;
    case 'resume': { const tier=s.resumeTier; const msg={attach:`Attaching to ${s.name} — live tmux, full context`,resume:`Resuming ${s.name} — transcript replay; some context will be missing`,revive:`Reviving ${s.name} — fresh session from a distilled handoff, not a restore`}[tier]; toast(msg); const dlg=el.closest('dialog'); if(dlg) dlg.close(); break; }
    case 'link': openLink(s); break;
    case 'pick': { s.clickupTasks=[el.dataset.task]; el.closest('dialog').close(); const ft=findTask(el.dataset.task); toast(`Linked ${s.name} → ${ft.task.id}`); render(); break; }
    case 'answer': openAnswer(findTask(el.dataset.task).task); break;
    case 'send-answer': { const id=el.dataset.task; const txt=($('#answerText').value||'').trim(); if(!txt){ $('#answerText').focus(); toast('Type an answer first'); return; } state.answered[id]=true; sessionsFor(id).forEach(x=>{ if(x.status==='needs_input'){ x.status='working'; x.summary.now='Resuming on your answer: '+txt.slice(0,80); x.summaryAgeMin=0; x.idle='0m'; x.lastActivity='just now'; } }); el.closest('dialog').close(); toast('Answer sent · session resuming'); render(); break; }
    case 'close': el.closest('dialog').close(); break;
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.querySelectorAll('dialog[open]').forEach(d=>d.close()); });

render();
</script>
</body>
</html>
