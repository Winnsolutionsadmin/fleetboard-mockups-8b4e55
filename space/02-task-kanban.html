<!-- fleetboard space view · concept 02 task-kanban · Kanban columns by task state (Needs you · In progress · Ready · Backlog · Proposed done) with each task's session chips inside its card and an Unlinked-sessions column last; on phone the columns become a swipeable rail with column tabs · phone-first, light theme, self-contained -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>FleetBoard — Space · task-kanban</title>
<style>
:root{
  --brand:#7b68ee; --brand-dark:#5f4dd0; --brand-soft:#efecfd;
  --ink:#2a2e43; --ink-soft:#6b7186; --ink-faint:#9aa1b5;
  --line:#e6e9f2; --ws:#fafbfc; --column:#f3f4f7; --card:#fff;
  --c-needs:#f0555f; --c-needs-bg:#fdeef0;
  --c-work:#4c9aff;  --c-work-bg:#eef5ff;
  --c-wait:#f0a92e;  --c-wait-bg:#fdf6ea;
  --c-stale:#98a1b3; --c-stale-bg:#f3f4f7;
  --ok:#27ae60; --warn:#f0a92e; --bad:#e5484d;
  --shadow:0 1px 3px rgba(42,46,67,.08), 0 1px 2px rgba(42,46,67,.05);
  --h-mactop:#5f4dd0; --h-mini:#0e9994; --h-macbook:#0073ea;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --wait-ink:#a8700f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:var(--ws);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg{display:inline-block;vertical-align:-2px}

/* ---------- top: space picker + strip ---------- */
.top{flex:none;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:5}
.top-row{display:flex;align-items:center;gap:14px;padding:10px 16px 8px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:8px;height:8px;border-radius:2px;background:var(--brand);transform:rotate(45deg)}
.brand small{font-weight:500;color:var(--ink-faint);font-size:12px}
.spaces{display:flex;gap:2px;background:var(--column);padding:3px;border-radius:10px;margin-left:auto}
.spaces button{border:0;background:transparent;padding:0 12px;min-height:34px;border-radius:8px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.spaces button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.spaces button:hover{color:var(--ink)}

.strip{display:flex;align-items:center;gap:8px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.stat{flex:none;display:flex;align-items:baseline;gap:5px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;white-space:nowrap}
.stat b{font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--ink-soft)}
.stat.hot b{color:var(--c-needs)}
.stat.wait b{color:var(--wait-ink)}
.stat.ok b{color:var(--ok)}
.stat.live b{color:var(--c-work)}
.hosts{margin-left:auto;display:flex;gap:6px;flex:none;padding-left:8px}
.host{border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 10px 0 8px;min-height:30px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;cursor:default;white-space:nowrap}
.host i{width:8px;height:8px;border-radius:50%;background:var(--h)}
.host span{color:var(--ink-faint);font-weight:500;font-variant-numeric:tabular-nums}
.host.stale{border-style:dashed;color:var(--ink-soft);cursor:pointer}
.host.stale i{background:transparent;border:2px solid var(--h);width:7px;height:7px}
.host.dead i{background:var(--bad)}
.hostnote{display:none;padding:0 16px 8px;font-size:12px;color:var(--ink-soft)}
.hostnote.show{display:block}
.hostnote b{color:var(--h-macbook)}

.lists{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none;align-items:center}
.lists::-webkit-scrollbar{display:none}
.lists .lab{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-right:2px}
.lchip{flex:none;border:1px solid var(--line);background:#fff;border-radius:7px;min-height:30px;padding:0 9px;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.lchip b{color:var(--ink);font-weight:600}
.lchip em{font-style:normal;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.lchip.empty{border-style:dashed}
.lchip.empty em{color:var(--ink-faint)}
.lchip.active{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark)}
.lchip.active b{color:var(--brand-dark)}
.lchip:hover{border-color:var(--ink-faint)}

.coltabs{display:none}

/* ---------- board ---------- */
.board{flex:1;min-height:0;display:flex;gap:12px;padding:12px 16px 14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scroll-padding:16px}
.col{flex:none;width:284px;display:flex;flex-direction:column;background:var(--column);border-radius:12px;border:1px solid var(--line);min-height:0;scroll-snap-align:start;position:relative}
.col::before{content:"";position:absolute;left:12px;right:12px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--cc)}
.col.needs{background:#fbf2f3;border-color:#f6dcdf}
.col-head{padding:12px 12px 8px;display:flex;align-items:baseline;gap:8px}
.col-head h2{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em}
.col-head .n{font-size:12px;font-weight:700;color:var(--cc);font-variant-numeric:tabular-nums;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.col-head small{margin-left:auto;font-size:11px;color:var(--ink-faint);white-space:nowrap}
.col-body{flex:1;min-height:0;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.empty{margin:4px 4px;padding:18px 12px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-faint);font-size:13px;text-align:center;background:rgba(255,255,255,.5)}

/* ---------- task card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px 12px;position:relative}
.card.hot{box-shadow:var(--shadow),inset 3px 0 0 var(--c-needs)}
.crumb{font-size:11px;color:var(--ink-faint);display:flex;gap:4px;align-items:center;margin-bottom:5px;min-width:0}
.crumb b{color:var(--ink-soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sp{white-space:nowrap}
.crumb .mono{font-family:var(--mono);font-size:11px}
.prio{margin-left:auto;flex:none;font-size:10.5px;font-weight:700;letter-spacing:.04em;border-radius:4px;padding:1px 5px;border:1px solid transparent}
.prio.p1{background:var(--c-needs);color:#fff}
.prio.p2{border-color:var(--line);color:var(--ink-soft);background:#fff}
.prio.p3{color:var(--ink-faint);background:var(--column)}
.src{margin-left:auto;flex:none;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:#fff}
.title{margin:0 0 8px;font-size:14px;font-weight:600;line-height:1.35;letter-spacing:-.005em}
.title a{color:inherit;text-decoration:none}
.title a:hover{color:var(--brand-dark);text-decoration:underline;text-decoration-color:var(--brand)}
.title a svg{color:var(--ink-faint);margin-left:3px}
.title a:hover svg{color:var(--brand-dark)}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;line-height:1.4;border:1px solid transparent;white-space:nowrap}
.chip.st-needs-triage{border-color:var(--ink-faint);border-style:dashed;color:var(--ink-soft);background:#fff}
.chip.st-ready-for-human{background:var(--c-needs-bg);color:#c9323c}
.chip.st-ready-for-agent{background:var(--brand-soft);color:var(--brand-dark)}
.chip.st-in-progress{background:var(--c-work-bg);color:#1f6fd6}
.chip.st-needs-info{background:var(--c-wait-bg);color:var(--wait-ink)}
.chip.st-out-of-scope{background:var(--c-stale-bg);color:var(--ink-faint);text-decoration:line-through}
.chip.status{color:var(--ink-soft);background:#fff;border-color:var(--line);font-weight:500}
.chip.status::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--ink-faint)}
.chip.status.ip::before{background:var(--c-work)}
.chip.status.pd::before{background:var(--ok)}
.chip.status.pd{color:var(--ok);border-color:#bfe6cd;background:#f0faf3;font-weight:600}
.chip.due{color:var(--ink-soft);font-weight:500}
.chip.due.over{color:var(--bad);font-weight:700}
.chip.due.today{color:var(--wait-ink);font-weight:600}
.chip.due.none{color:var(--ink-faint)}
.chip.dw.ok{color:var(--ok);font-weight:500}
.chip.dw.miss{color:var(--wait-ink)}
.chip.who{color:var(--ink-faint);font-weight:500}

/* session stub inside a card */
.sess{margin-top:8px;border:1px solid var(--line);border-left:3px solid var(--host);border-radius:8px;padding:7px 8px 7px 10px;background:#fff;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;align-items:center}
.sess.needs_input{border-color:#f7c6ca;border-left-color:var(--host);background:#fff8f8}
.sess.ended{background:var(--column);border-left-style:dashed;border-left-color:var(--host)}
.sess.stale{background:var(--c-stale-bg)}
.s1{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.hosttag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--host);padding:2px 6px;border-radius:4px;line-height:1.3}
.sess.ended .hosttag,.sess.stale .hosttag{background:#fff;color:var(--host);border:1px solid var(--host);padding:1px 5px}
.sstat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.sstat .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.sstat.needs_input{color:var(--c-needs)}
.sstat.working{color:var(--c-work)}
.sstat.waiting{color:var(--c-wait)}
.sstat.stale{color:var(--c-stale)}
.sstat.ended{color:var(--ink-faint)}
.sstat.needs_input .dot{animation:pulse 1.1s ease-in-out infinite}
.sstat.working .dot{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 currentColor;opacity:1}50%{box-shadow:0 0 0 4px transparent;opacity:.55}}
.model{font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:#fff}
.s2{grid-column:1;font-size:11.5px;color:var(--ink-soft);display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.sname{font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.s2 .t{font-variant-numeric:tabular-nums;white-space:nowrap}
.act{grid-column:2;grid-row:1/3;align-self:center}
.sess.ended .act{grid-column:1/3;grid-row:auto;justify-self:start;margin-top:4px}
.snow{grid-column:1/3;margin:3px 0 0;font-size:12.5px;color:var(--ink);line-height:1.4;padding-top:6px;border-top:1px dashed #f0d6d8}
.snow .age{color:var(--ink-faint);font-size:11px;white-space:nowrap}

/* parked */
.parked{margin-top:8px;background:var(--c-wait-bg);border:1px solid #f2dbb0;border-radius:8px;padding:8px 10px}
.parked .lab{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--wait-ink);margin-bottom:3px}
.parked .q{margin:0 0 8px;font-size:13px;line-height:1.45}
.parked.done{background:#f0faf3;border-color:#bfe6cd;color:var(--ok);font-weight:600;font-size:12.5px}

/* dispatch row */
.dispatch{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--ink-faint)}
.dispatching{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--brand-dark);background:var(--brand-soft);border-radius:8px;padding:0 12px;min-height:36px}
.spin{width:12px;height:12px;border:2px solid var(--brand-soft);border-top-color:var(--brand-dark);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* buttons */
.btn{font-weight:600;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;min-height:36px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 1px 1px rgba(42,46,67,.04)}
.btn:hover{border-color:var(--ink-faint);background:#fff}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn:disabled:hover{border-color:var(--brand)}
.btn.small{min-height:32px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent;color:var(--ink-soft)}
.btn.ghost:hover{background:var(--column);color:var(--ink)}
.tier{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--brand-soft);color:var(--brand-dark);text-transform:uppercase;letter-spacing:.05em}
.tier.resume{background:var(--c-work-bg);color:#1f6fd6}
.tier.revive{background:var(--c-wait-bg);color:var(--wait-ink)}

/* unlinked session card */
.ucard .now{margin:8px 0 0;font-size:12.5px;line-height:1.4;color:var(--ink)}
.ucard .now .age{color:var(--ink-faint);font-size:11px;white-space:nowrap}
.ucard .sess{margin-top:6px}

/* ---------- dialog / drawer ---------- */
dialog{border:0;padding:0;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 24px 60px rgba(42,46,67,.28);width:min(520px,calc(100vw - 32px));max-height:min(84dvh,760px);overflow:auto}
dialog::backdrop{background:rgba(42,46,67,.38)}
dialog.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;border-radius:0;width:min(460px,100vw)}
.dhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:1}
.dhead h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.dhead .x{margin-left:auto;flex:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.dbody{padding:14px 16px 18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;margin:12px 0}
.kv dt{color:var(--ink-faint);margin:0}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.kv dd.mono{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.blk{margin:0 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.blk .lab{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);display:flex;gap:8px;align-items:baseline}
.blk .lab .age{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;font-size:11px}
.blk p{margin:3px 0 0;font-size:13.5px;line-height:1.45}
.blk.now{border-color:#d7dcf0;background:#fbfbfe}
.term{background:#1e2130;color:#c9cee0;font-family:var(--mono);font-size:11.5px;line-height:1.5;border-radius:10px;padding:10px 12px;margin:12px 0 0;overflow:hidden;white-space:pre-wrap}
.term .p{color:#8f97b3}
.term .g{color:#7fd6a0}
.term .y{color:#f0c36b}
.dfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.dfoot .note{flex-basis:100%;font-size:12px;color:var(--ink-soft);margin:0}
.dtask{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-bottom:8px}
.dtask a{color:var(--brand-dark);font-weight:600;text-decoration:none}
.dtask a:hover{text-decoration:underline}
.search{width:100%;font:inherit;padding:0 12px;min-height:40px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--ws)}
.search:focus{outline:2px solid var(--brand);border-color:transparent}
.pick{list-style:none;margin:0;padding:0}
.pick li.group{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding:10px 4px 4px}
.pick button{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;min-height:44px;margin-bottom:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
.pick button:hover{border-color:var(--brand);background:var(--brand-soft)}
.pick button .nm{flex:1;min-width:0;font-weight:600;font-size:13px;line-height:1.3}
textarea.ans{width:100%;font:inherit;padding:10px 12px;min-height:110px;border:1px solid var(--line);border-radius:8px;resize:vertical;background:var(--ws)}
textarea.ans:focus{outline:2px solid var(--brand);border-color:transparent}
.qbox{background:var(--c-wait-bg);border:1px solid #f2dbb0;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.45;margin-bottom:10px}

/* toast */
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(42,46,67,.3);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- phone ---------- */
@media (max-width:430px){
  .top-row{padding:10px 12px 6px;gap:10px}
  .brand small{display:none}
  .spaces button{min-height:44px;padding:0 10px;font-size:13px}
  .strip{padding:0 12px 8px}
  .stat{min-height:44px;padding:0 10px;align-items:center}
  .host{min-height:44px}
  .hosts{padding-left:4px}
  .lists{padding:0 12px 8px}
  .lchip{min-height:44px;padding:0 10px}
  .title a{display:flex;align-items:center;min-height:44px;padding:5px 0;margin:-5px 0}
  .coltabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
  .coltabs::-webkit-scrollbar{display:none}
  .coltabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;min-height:44px;padding:0 12px;font-weight:600;font-size:13px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .coltabs button i{width:8px;height:8px;border-radius:50%;background:var(--cc)}
  .coltabs button em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-faint)}
  .coltabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .coltabs button.active em{color:#c9cee0}
  .board{padding:10px 12px 12px;gap:10px;scroll-snap-type:x mandatory;scroll-padding:12px}
  .col{width:calc(100vw - 24px);scroll-snap-align:center}
  .btn,.btn.small,.dispatching{min-height:44px}
  .sess{grid-template-columns:minmax(0,1fr) auto;padding:8px 8px 8px 10px}
  .prio{min-height:0}
  .title{font-size:14.5px}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:90dvh}
  dialog.drawer{height:auto;max-height:92dvh;width:100vw;border-radius:16px 16px 0 0;margin:auto 0 0}
  .dhead .x{width:44px;height:44px}
  .dhead{padding:12px 14px}
  .dbody{padding:12px 14px 16px}
}
@media (prefers-reduced-motion:reduce){
  .sstat .dot,.spin{animation:none}
  .toast{transition:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand"><i></i>FleetBoard <small>· Space</small></div>
    <nav class="spaces" role="tablist" aria-label="Spaces" id="spaces"></nav>
  </div>
  <div class="strip" id="strip"></div>
  <div class="hostnote" id="hostnote"></div>
  <div class="lists" id="lists"></div>
  <div class="coltabs" id="coltabs" role="tablist" aria-label="Columns"></div>
</header>

<main class="board" id="board" aria-live="polite"></main>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div class="toast" id="toast" role="status"></div>

const space = () => SPACE.spaces.find(s => s.id === state.space);
function rowsOf(sp){
  const out = [];
  sp.folders.forEach(f => f.lists.forEach(l => l.tasks.forEach(t => out.push({ task:t, folder:f, list:l, ss:sessFor(t.id) }))));
  return out;
}
function sessFor(id){ return sessions.filter(s => s.clickupTasks.includes(id)).sort((a,b) => SRANK[a.status]-SRANK[b.status]); }
function isNeedsYou(t, ss){ return t.agent_state==='needs-info' || t.agent_state==='ready-for-human' || ss.some(s => s.status==='needs_input'); }
function colOf(t, ss){
  if (t.status==='proposed-done') return 'proposed';
  if (isNeedsYou(t, ss)) return 'needs';
  if (t.agent_state==='in-progress' || t.status==='in progress' || ss.some(s => LIVE.has(s.status))) return 'work';
  if (t.agent_state==='ready-for-agent') return 'ready';
  return 'backlog';
}
function rank(r){ if (isNeedsYou(r.task, r.ss)) return 0; if (r.task.agent_state==='in-progress' || r.ss.some(s => LIVE.has(s.status))) return 1; return 2; }
function sortRows(rows){
  return rows.sort((a,b) => {
    const d = rank(a)-rank(b); if (d) return d;
    const p = a.task.priority-b.task.priority; if (p) return p;
    const da = a.task.due||'9999', db = b.task.due||'9999';
    return da<db ? -1 : da>db ? 1 : 0;
  });
}
function dueInfo(due){
  if (!due) return { label:'No due date', cls:'none' };
  const d = new Date(due+'T12:00:00');
  const diff = Math.round((d-TODAY)/864e5);
  const md = d.toLocaleDateString('en-US',{ month:'short', day:'numeric' });
  if (diff<0)  return { label:`Overdue · ${md}`, cls:'over' };
  if (diff===0) return { label:'Due today', cls:'today' };
  if (diff===1) return { label:'Due tomorrow', cls:'today' };
  return { label:`Due ${md}`, cls:'' };
}

function ageSec(s){ if (s<60) return `${s}s`; if (s<3600) return `${Math.round(s/60)}m`; const h=Math.floor(s/3600), m=Math.round((s%3600)/60); return m ? `${h}h ${m}m` : `${h}h`; }
function tokens(n){ return n>=1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'')+'M' : Math.round(n/1e3)+'k'; }

}
function renderStrip(){
  const sp = space(), rows = rowsOf(sp);
  const ids = new Set(rows.map(r => r.task.id));
  const live = sessions.filter(s => LIVE.has(s.status) && s.clickupTasks.some(id => ids.has(id))).length;
  const needs = rows.filter(r => isNeedsYou(r.task, r.ss)).length;
  const parked = rows.filter(r => r.task.agent_state==='needs-info').length;
  const proposed = rows.filter(r => r.task.status==='proposed-done').length;
  const stat = (n, label, cls='') => `<div class="stat ${cls}"><b>${n}</b><span>${label}</span></div>`;
  const hosts = Object.entries(SPACE.hosts).map(([h, v]) =>
    `<button class="host ${v.liveness}" style="--h:${HOST[h]}" data-host="${h}" title="${esc(v.note || `${h}: ${v.liveness} · published ${ageSec(v.publishAgeSec)} ago`)}" aria-pressed="${state.hostnote && v.liveness!=='fresh'}"><i></i>${h}<span>${v.liveness==='fresh' ? ageSec(v.publishAgeSec) : v.liveness+' · '+ageSec(v.publishAgeSec)}</span></button>`).join('');
  $('#strip').innerHTML =
    stat(rows.length,'open tasks') + stat(needs,'needs you','hot') + stat(live,'live sessions','live') +
    stat(parked,'parked','wait') + stat(proposed,'proposed done','ok') +
    `<div class="hosts">${hosts}</div>`;
  const stale = Object.entries(SPACE.hosts).find(([,v]) => v.liveness!=='fresh');
  const hn = $('#hostnote');
  hn.classList.toggle('show', state.hostnote && !!stale);
  hn.innerHTML = stale ? `<b>${stale[0]}</b> is ${stale[1].liveness}: ${esc(stale[1].note || 'no note')}. Session data from this host may be out of date.` : '';
}
function renderLists(){

    html += `<button class="lchip ${n?'':'empty'} ${active?'active':''}" data-list="${l.id}" aria-pressed="${active}" title="${n ? 'Show only this list' : 'No open tasks in this list'}"><span>${esc(f.name)}</span>›<b>${esc(l.name)}</b><em>${n ? n : 'no open tasks'}</em></button>`;

}

  const ended = s.status==='ended';
  const time = ended ? `ran ${s.elapsedActive} · ended ${s.lastActivity}`
             : s.idle==='0m' ? `${s.elapsedActive} active` : `${s.elapsedActive} active · idle ${s.idle}`;
  const action = ended
    ? `<button class="btn small" data-act="resume" data-sid="${s.session_id}" title="${esc(TIER_COPY[s.resumeTier])}">Resume <span class="tier ${s.resumeTier}">${s.resumeTier}</span></button>`
    : `<button class="btn small" data-act="open" data-sid="${s.session_id}" title="Open session">Open</button>`;
  const now = s.status==='needs_input'
    ? `<p class="snow">${esc(s.summary.now)} <span class="age">· summary ${ageMin(s.summaryAgeMin)} old</span></p>` : '';
  return `<div class="sess ${s.status}" style="--host:${HOST[s.host]}">
    <div class="s1"><span class="hosttag">${s.host}</span><span class="sstat ${s.status}"><i class="dot"></i>${SLABEL[s.status]}</span><span class="model">${esc(s.model)}</span></div>
    <div class="s2"><span class="sname" title="${esc(s.name)}">${esc(s.name)}</span><span class="t">${time}</span></div>
    <div class="act">${action}</div>${now}
  </div>`;
}
function dispatchHTML(t){
  if (state.dispatching.has(t.id)) return `<div class="dispatch"><span class="dispatching"><i class="spin"></i>dispatching on mactop…</span></div>`;
  const stateOk = DISPATCHABLE.has(t.agent_state);
  const ok = t.doneWhen && stateOk;
  const hint = !t.doneWhen ? 'needs DONE-WHEN' : !stateOk ? (t.agent_state==='needs-info' ? 'answer the question first' : 'not dispatchable in this state') : '';
  return `<div class="dispatch"><button class="btn primary small" data-act="dispatch" data-task="${t.id}" ${ok?'':'disabled'} title="${ok ? 'Spawn a session for this task' : esc(hint)}">Dispatch ${ICON_ARROW}</button>${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
}
function parkedHTML(t){
  if (t.agent_state!=='needs-info') return '';
  if (state.answered.has(t.id)) return `<div class="parked done">✓ Answer sent · the session resumes on its next turn</div>`;
  return `<div class="parked"><div class="lab">Parked · question for you</div><p class="q">${esc(t.question)}</p><button class="btn small" data-act="answer" data-task="${t.id}">Answer</button></div>`;
}
function cardHTML(r){
  const { task:t, folder, list, ss } = r;
  const due = dueInfo(t.due);
  return `<article class="card ${isNeedsYou(t, ss)?'hot':''}" data-task="${t.id}">
    <div class="crumb"><span class="sp">${esc(folder.name)}</span>›<b>${esc(list.name)}</b><span class="prio p${t.priority}" title="${PRIO[t.priority]}">P${t.priority}</span></div>
    <h3 class="title"><a href="${esc(t.url)}" target="_blank" rel="noopener" title="Open in ClickUp">${esc(t.name)}${ICON_EXT}</a></h3>
    <div class="meta">
      <span class="chip st-${t.agent_state}" title="Agent state">${STATE_LABEL[t.agent_state]||t.agent_state}</span>
      <span class="chip status ${t.status==='proposed-done'?'pd':t.status==='in progress'?'ip':''}" title="ClickUp status">${t.status}</span>
      <span class="chip due ${due.cls}">${due.label}</span>
      <span class="chip dw ${t.doneWhen?'ok':'miss'}" title="${t.doneWhen ? 'Has a DONE-WHEN contract' : 'No DONE-WHEN contract yet'}">${t.doneWhen ? '✓ DONE-WHEN' : '⚠ no DONE-WHEN'}</span>
      <span class="chip who">${esc(t.assignee)}</span>
    </div>
    ${parkedHTML(t)}
    ${ss.map(sessHTML).join('')}
    ${ss.length ? '' : dispatchHTML(t)}
  </article>`;
}
function ucardHTML(s){
  return `<article class="card ucard" data-sid="${s.session_id}">
    <div class="crumb"><span class="mono sp">${esc(s.project)}</span>›<b class="mono">${esc(s.branch)}</b><span class="src">${s.source}</span></div>
    ${sessHTML(s)}
    <p class="now">${esc(s.summary.now)} <span class="age">· summary ${ageMin(s.summaryAgeMin)} old</span></p>
    <div class="dispatch"><button class="btn primary small" data-act="link" data-sid="${s.session_id}">${ICON_LINK} Link task</button><span class="hint">not counted in any Space until linked</span></div>
  </article>`;
}
function renderBoard(){
  const sp = space();
  let rows = rowsOf(sp);
  if (state.filterList) rows = rows.filter(r => r.list.id===state.filterList);
  const buckets = Object.fromEntries(COLS.map(c => [c.id, []]));
  rows.forEach(r => buckets[colOf(r.task, r.ss)].push(r));
  COLS.forEach(c => { if (c.id!=='unlinked') sortRows(buckets[c.id]); });
  const unlinked = sessions.filter(s => !s.clickupTasks.length).sort((a,b) => SRANK[a.status]-SRANK[b.status]);
  $('#board').innerHTML = COLS.map(c => {
    const items = c.id==='unlinked' ? unlinked.map(ucardHTML) : buckets[c.id].map(cardHTML);
    const n = c.id==='unlinked' ? unlinked.length : buckets[c.id].length;
    const emptyMsg = c.id!=='unlinked' && state.filterList ? 'Nothing from this list here.' : c.empty;
    return `<section class="col ${c.id}" id="col-${c.id}" style="--cc:${c.color}" aria-labelledby="h-${c.id}">
      <div class="col-head"><h2 id="h-${c.id}">${c.title}</h2><span class="n">${n}</span><small>${c.hint}</small></div>
      <div class="col-body">${items.length ? items.join('') : `<div class="empty">${emptyMsg}</div>`}</div>
    </section>`;
  }).join('');
  $('#coltabs').innerHTML = COLS.map(c => {
    const n = c.id==='unlinked' ? unlinked.length : buckets[c.id].length;
    return `<button role="tab" data-col="${c.id}" style="--cc:${c.color}"><i></i>${c.title}<em>${n}</em></button>`;
  }).join('');
  observeCols();
}
function renderAll(){ renderSpaces(); renderStrip(); renderLists(); renderBoard(); }

/* column tabs ↔ scroll position (phone rail) */
let io;
function observeCols(){
  if (io) io.disconnect();
  const board = $('#board');
  io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) setActiveTab(e.target.id.replace('col-','')); });
  }, { root: board, threshold: .6 });
  board.querySelectorAll('.col').forEach(c => io.observe(c));
}
function setActiveTab(id){
  document.querySelectorAll('#coltabs button').forEach(b => {
    const on = b.dataset.col===id; b.classList.toggle('active', on); b.setAttribute('aria-selected', on);
    if (on && b.scrollIntoView) b.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
  });
}

/* ---------- dialogs ---------- */
const dlg = $('#dlg');
function openDialog(html, drawer=false){
  dlg.className = drawer ? 'drawer' : '';
  dlg.innerHTML = html;
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
}
function closeDialog(){ if (dlg.open) dlg.close(); }
function taskById(id){ for (const sp of SPACE.spaces) for (const f of sp.folders) for (const l of f.lists) for (const t of l.tasks) if (t.id===id) return { task:t, folder:f, list:l, space:sp }; return null; }
const dhead = (title, sub='') => `<div class="dhead"><div style="min-width:0;flex:1"><h2 id="dlgTitle">${title}</h2>${sub ? `<div style="font-size:12px;color:var(--ink-soft);margin-top:2px">${sub}</div>` : ''}</div><button class="x" data-act="close" aria-label="Close">${ICON_X}</button></div>`;

function sessionDrawer(s){
  const live = LIVE.has(s.status);
  const links = s.clickupTasks.map(id => taskById(id)).filter(Boolean);
  const primary = s.status==='ended'
    ? `<button class="btn primary" data-act="resume" data-sid="${s.session_id}">Resume <span class="tier ${s.resumeTier}" style="background:rgba(255,255,255,.22);color:#fff">${s.resumeTier}</span></button>`
    : `<button class="btn primary" data-act="attach" data-sid="${s.session_id}">${live ? 'Attach to tmux' : 'Reattach'} <span class="tier" style="background:rgba(255,255,255,.22);color:#fff">${s.resumeTier}</span></button>`;
  openDialog(`
    ${dhead(`<span class="hosttag" style="--host:${HOST[s.host]};margin-right:6px">${s.host}</span><span style="font-family:var(--mono);font-size:13px;font-weight:600">${esc(s.name)}</span>`, `<span class="sstat ${s.status}"><i class="dot"></i>${SLABEL[s.status]}</span> · ${esc(s.model)} · ${s.source} · last activity ${esc(s.lastActivity)}`)}
    <div class="dbody">
      <div class="dtask">${links.length ? 'Joined to ' + links.map(l => `<a href="${esc(l.task.url)}" target="_blank" rel="noopener">${esc(l.task.name)}${ICON_EXT}</a>`).join(', ') : '<span class="chip st-needs-triage">unlinked · no task joined</span>'}</div>
      <div class="blk now"><div class="lab">Now <span class="age">summary ${ageMin(s.summaryAgeMin)} old</span></div><p>${esc(s.summary.now)}</p></div>
      <div class="blk"><div class="lab">Next</div><p>${esc(s.summary.next)}</p></div>
      <div class="blk"><div class="lab">Goal</div><p>${esc(s.summary.goal)}</p></div>
      <dl class="kv">
        <dt>Project</dt><dd class="mono">${esc(s.project)} · ${esc(s.branch)}</dd>
        <dt>Context</dt><dd>${s.contextPct}% used · ${tokens(s.tokens)} tokens · ${s.msgs} msgs · ${money(s.cost)}</dd>
        <dt>Time</dt><dd>${esc(s.elapsedActive)} active · idle ${esc(s.idle)}</dd>
        <dt>Resume tier</dt><dd><span class="tier ${s.resumeTier}">${s.resumeTier}</span> ${esc(TIER_COPY[s.resumeTier])}</dd>
        <dt>Session</dt><dd class="mono">${esc(s.session_id)}</dd>
      </dl>
      <div class="term" aria-label="Transcript preview (placeholder)"><span class="p">$ tmux attach -t ${esc(s.name)}</span>
<span class="g">●</span> ${esc(s.summary.now)}
<span class="y">→</span> next: ${esc(s.summary.next)}
<span class="p">— live transcript streams here in the real view —</span></div>
    </div>
    <div class="dfoot">${primary}<button class="btn" data-act="close">Close</button>
      <p class="note">${live ? 'Opening attaches to the running process; nothing is restarted.' : esc(TIER_COPY[s.resumeTier])}</p></div>`, true);
}
function linkPicker(s){
  const sp = space();
  let list = '';
  sp.folders.forEach(f => f.lists.forEach(l => {
    if (!l.tasks.length) return;
    list += `<li class="group">${esc(f.name)} › ${esc(l.name)}</li>`;
    l.tasks.forEach(t => { list += `<li><button data-act="pick" data-sid="${s.session_id}" data-task="${t.id}"><span class="chip st-${t.agent_state}">${STATE_LABEL[t.agent_state]}</span><span class="nm">${esc(t.name)}</span></button></li>`; });
  }));
  openDialog(`
    ${dhead('Link a task', `<span style="font-family:var(--mono)">${esc(s.name)}</span> · ${esc(s.project)} › ${esc(s.branch)} · tasks in ${esc(sp.name)}`)}
    <div class="dbody">
      <input class="search" type="search" placeholder="Filter tasks…" data-role="filter" autocomplete="off">
      <ul class="pick" id="pick">${list}</ul>
      <p class="hint" style="margin:4px 0 0">Switch Space in the header to link a task from another Space.</p>
    </div>`);
  const inp = $('[data-role=filter]', dlg);
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    dlg.querySelectorAll('#pick li').forEach(li => {
      if (li.classList.contains('group')) return;
      li.style.display = !q || li.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}
function answerDialog(t){
  openDialog(`
    ${dhead('Answer the parked question', `${esc(t.name)}`)}
    <div class="dbody">
      <div class="qbox">${esc(t.question)}</div>
      <label for="ans" style="font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:6px">Your answer</label>
      <textarea class="ans" id="ans" placeholder="Type the decision; the session picks it up on its next turn."></textarea>
    </div>
    <div class="dfoot"><button class="btn primary" data-act="send-answer" data-task="${t.id}">Send answer</button><button class="btn" data-act="close">Cancel</button></div>`);
  setTimeout(() => $('#ans', dlg).focus(), 30);
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const sb = e.target.closest('[data-space]');
  if (sb){ state.space = sb.dataset.space; state.filterList = null; renderAll(); $('#board').scrollTo({ left:0 }); return; }
  const lb = e.target.closest('[data-list]');
  if (lb){ const l = lb.dataset.list; const tl = space().folders.flatMap(f => f.lists).find(x => x.id===l);
    if (!tl.tasks.length){ toast(`${tl.name}: no open tasks`); return; }
    state.filterList = state.filterList===l ? null : l; renderLists(); renderBoard(); return; }
  const hb = e.target.closest('[data-host]');
  if (hb){ if (hb.classList.contains('stale') || hb.classList.contains('dead')){ state.hostnote = !state.hostnote; renderStrip(); } return; }
  const cb = e.target.closest('[data-col]');
  if (cb){ $('#col-'+cb.dataset.col).scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' }); setActiveTab(cb.dataset.col); return; }

  const ab = e.target.closest('[data-act]');
  if (!ab) return;
  const act = ab.dataset.act, sid = ab.dataset.sid, tid = ab.dataset.task;
  const s = sid ? sessions.find(x => x.session_id===sid) : null;
  const tr = tid ? taskById(tid) : null;
  switch (act){
    case 'close': closeDialog(); break;
    case 'open': sessionDrawer(s); break;
    case 'attach': closeDialog(); toast(`Attaching to ${s.name} on ${s.host} (${s.resumeTier})`); break;
    case 'resume': closeDialog(); toast(`${s.name}: ${TIER_COPY[s.resumeTier]}`); break;
    case 'dispatch':
      if (ab.disabled) return;
      state.dispatching.add(tid); renderBoard(); toast(`Dispatching "${tr.task.name}" on mactop…`); break;
    case 'answer': answerDialog(tr.task); break;
    case 'send-answer': {
      const v = $('#ans', dlg).value.trim();
      if (!v){ $('#ans', dlg).focus(); toast('Type an answer first'); return; }
      state.answered.add(tid); closeDialog(); renderStrip(); renderBoard(); toast('Answer sent · session will resume'); break; }
    case 'link': linkPicker(s); break;
    case 'pick':
      s.clickupTasks = [tid]; closeDialog(); renderStrip(); renderBoard();
      toast(`Linked ${s.name} → ${tr.task.name}`);
      break;
  }
});
dlg.addEventListener('click', e => { if (e.target===dlg) closeDialog(); }); // backdrop tap
dlg.addEventListener('close', () => { dlg.innerHTML=''; });

renderAll();
</script>
</body>
</html>
