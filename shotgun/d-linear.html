<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FleetBoard — Linear Calm</title>
<style>
  :root{
    --canvas:#fcfcfd;
    --card:#ffffff;
    --line:#e6e8ec;
    --line-soft:#eff0f3;
    --ink:#282a30;
    --ink-2:#5f6168;
    --ink-3:#9a9ca3;
    --accent:#5e6ad2;
    --red:#e5484d;
    --red-soft:#fdf3f3;
    --green:#46a758;
    --amber:#c9962b;
    --gray-dot:#b4b6bc;
    --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--canvas)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    font-size:13px;
    line-height:1.45;
    letter-spacing:-0.08px;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:none;cursor:pointer}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:14px 24px;
    border-bottom:1px solid var(--line);
    background:var(--card);
  }
  .wordmark{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;letter-spacing:-0.15px}
  .wordmark .mark{
    width:16px;height:16px;border-radius:4px;background:var(--accent);
    display:inline-flex;align-items:center;justify-content:center;flex:none;
  }
  .wordmark .mark svg{display:block}
  .built{color:var(--ink-3);font-size:12px}
  .spacer{flex:1}
  .demo-toggle{
    display:flex;align-items:center;gap:8px;min-height:32px;padding:0 4px;
    color:var(--ink-2);font-size:12px;
  }
  .switch{
    width:28px;height:17px;border-radius:9px;background:#d8dade;position:relative;flex:none;
    transition:background .15s ease;
  }
  .switch::after{
    content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
    background:#fff;transition:transform .15s ease;
  }
  .demo-toggle[aria-pressed="true"] .switch{background:var(--accent)}
  .demo-toggle[aria-pressed="true"] .switch::after{transform:translateX(11px)}

  /* ---------- health strip ---------- */
  .health{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:12px 24px 0;
  }
  .node-chip{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--line);border-radius:6px;background:var(--card);
    padding:4px 9px;font-size:12px;color:var(--ink-2);
  }
  .node-chip .nname{font-weight:500;color:var(--ink)}
  .node-chip .ncount{color:var(--ink-3)}
  .node-chip.dead{border-color:#f3c8c9;background:var(--red-soft);color:var(--red)}
  .node-chip.dead .nname,.node-chip.dead .ncount{color:var(--red)}
  .node-chip.dead .nstate{font-weight:600;font-size:10.5px;letter-spacing:.4px}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dot.fresh{background:var(--green)}
  .dot.dead{background:var(--red)}
  .totals{color:var(--ink-3);font-size:12px;margin-left:4px}
  .totals b{font-weight:500;color:var(--ink-2)}
  .totals .ny{color:var(--red);font-weight:500}

  /* ---------- segmented filter (mobile) ---------- */
  .seg{
    display:none;gap:6px;overflow-x:auto;padding:12px 16px 0;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .seg::-webkit-scrollbar{display:none}
  .seg button{
    flex:none;min-height:44px;padding:0 14px;border-radius:8px;
    border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:12.5px;
    display:inline-flex;align-items:center;gap:7px;
  }
  .seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:#f4f5fb}
  .seg .sdot{width:6px;height:6px;border-radius:50%}

  /* ---------- board ---------- */
  .board{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;
    padding:20px 24px 0;align-items:start;
  }
  .col-head{
    display:flex;align-items:center;gap:8px;
    padding:2px 2px 12px;
  }
  .col-head .cname{font-weight:500;font-size:12.5px;color:var(--ink-2)}
  .col-head .cdot{width:8px;height:8px;border-radius:50%;flex:none}
  .count{
    font-size:11px;color:var(--ink-3);
    border:1px solid var(--line);border-radius:9px;padding:0 6px;line-height:16px;background:var(--card);
  }
  .col[data-col="needs_you"] .cname{color:var(--red);font-weight:600}
  .col[data-col="needs_you"] .cdot{background:var(--red);box-shadow:0 0 0 4px rgba(229,72,77,.14)}
  .col[data-col="needs_you"] .count{color:var(--red);border-color:#f3c8c9;background:var(--red-soft)}
  .col[data-col="working"] .cdot{background:var(--green)}
  .col[data-col="waiting"] .cdot{background:var(--amber)}
  .col[data-col="stale"] .cdot{background:var(--gray-dot)}
  .col[data-col="stale"] .cname{color:var(--ink-3)}
  .cards{display:flex;flex-direction:column;gap:10px}
  .empty{
    border:1px dashed var(--line);border-radius:var(--radius);
    color:var(--ink-3);font-size:12px;text-align:center;padding:22px 12px;
  }

  /* ---------- card ---------- */
  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px 10px;
    cursor:pointer;
    transition:border-color .12s ease;
  }
  .card:hover{border-color:#d6d9df}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .card.needs-you{border-color:#f0d2d3}
  .card.needs-you::before{
    content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;
    border-radius:0 2px 2px 0;background:var(--red);opacity:.85;
  }
  .card.is-stale{background:transparent}
  .card.is-stale .proj{color:var(--ink-2)}
  .card.is-stale .now{color:var(--ink-3)}

  .row1{display:flex;align-items:baseline;gap:8px;min-width:0}
  .proj{font-weight:600;font-size:13px;letter-spacing:-0.12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .host{color:var(--ink-3);font-size:11.5px;flex:none}
  .status-inline{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3)}
  .status-inline .dot{width:6px;height:6px}
  .status-inline .dot.needs{background:var(--red)}
  .status-inline .dot.work{background:var(--green)}
  .status-inline .dot.wait{background:var(--amber)}
  .status-inline .dot.stal{background:var(--gray-dot)}
  .branch{color:var(--ink-3);font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now{
    margin-top:7px;color:var(--ink-2);font-size:12.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card.needs-you .now{color:var(--ink)}

  /* numerics: quiet text pairs with tiny icons */
  .nums{
    display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;
    margin-top:9px;color:var(--ink-3);font-size:11.5px;
  }
  .num{display:inline-flex;align-items:center;gap:4.5px;white-space:nowrap}
  .num svg{flex:none;opacity:.75}
  .num .v{color:var(--ink-2)}
  .ctx{display:inline-flex;align-items:center;gap:6px}
  .ctxbar{width:34px;height:3px;border-radius:2px;background:var(--line-soft);overflow:hidden;flex:none}
  .ctxbar i{display:block;height:100%;border-radius:2px;background:var(--ink-3)}
  .ctx.hot .ctxbar i{background:var(--red)}
  .ctx.warm .ctxbar i{background:var(--amber)}
  .ctx.hot .v{color:var(--red)}

  /* ---------- expanded session dialog ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(40,42,48,.35);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .overlay[hidden]{display:none}
  .dialog{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    width:92vw;max-width:1280px;height:88vh;
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
  }
  .dlg-head{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:12px 16px;border-bottom:1px solid var(--line);
  }
  .dlg-title{font-weight:600;font-size:14px;letter-spacing:-0.15px}
  .chip{
    display:inline-flex;align-items:center;gap:5px;
    border:1px solid var(--line);border-radius:6px;padding:2px 8px;
    font-size:11.5px;color:var(--ink-2);background:var(--canvas);
  }
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500}
  .pill .dot{width:6px;height:6px}
  .pill.needs{background:var(--red-soft);color:var(--red)}
  .pill.needs .dot{background:var(--red)}
  .pill.work{background:#f0f7f1;color:var(--green)}
  .pill.work .dot{background:var(--green)}
  .pill.wait{background:#fbf6ea;color:var(--amber)}
  .pill.wait .dot{background:var(--amber)}
  .pill.stal{background:#f2f3f5;color:var(--ink-3)}
  .pill.stal .dot{background:var(--gray-dot)}
  .dlg-nums{margin-left:auto;margin-top:0}
  .dlg-close{
    flex:none;width:32px;height:32px;min-height:32px;border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;
    color:var(--ink-3);border:1px solid transparent;
  }
  .dlg-close:hover{color:var(--ink);border-color:var(--line)}
  .dlg-tabs{display:none;border-bottom:1px solid var(--line)}
  .dlg-tabs button{
    flex:1;min-height:44px;font-size:12.5px;color:var(--ink-3);
    border-bottom:2px solid transparent;
  }
  .dlg-tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
  .dlg-body{flex:1;display:flex;min-height:0}
  /* left: terminal, framed in light chrome */
  .pane-term{flex:1 1 62%;min-width:0;display:flex;flex-direction:column;padding:14px;border-right:1px solid var(--line)}
  .term-bar{display:flex;align-items:center;gap:8px;padding:0 2px 10px;font-size:11.5px;color:var(--ink-3)}
  .badge-live{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--green);
    border:1px solid #cfe6d4;background:#f0f7f1;border-radius:4px;padding:1px 6px;
  }
  .badge-live .dot{width:5px;height:5px;background:var(--green);animation:pulse 2.4s ease-in-out infinite}
  .frozen{font-style:italic}
  .term{
    flex:1;min-height:0;overflow-y:auto;
    background:#191a1f;border-radius:8px;
    font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px;line-height:1.75;letter-spacing:0;
    padding:12px 14px;color:#c9cbd1;
  }
  .tline{white-space:pre-wrap;word-break:break-word}
  .tline .ts{color:#6e7078}
  .tline.warn{color:#e2b458}
  .tline.dim{color:#7d8089}
  .tline.pipe{color:#94969e}
  .tcursor::after{content:"\258B";color:#8b93e6;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  /* right: tasks rail */
  .pane-tasks{flex:1 1 38%;min-width:0;display:flex;flex-direction:column;overflow-y:auto;padding:16px 18px}
  .rail-h{font-size:10.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
  .rail-h .stamp{font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px;color:var(--ink-3);opacity:.85}
  .task{display:flex;gap:9px;padding:6px 0;font-size:12.5px;color:var(--ink-2);align-items:flex-start}
  .task .ti{flex:none;width:15px;height:15px;margin-top:1px;display:inline-flex;align-items:center;justify-content:center}
  .task.done .tt{color:var(--ink-3);text-decoration:line-through}
  .task.blocked .tt{color:var(--amber)}
  .task.in_progress .tt{color:var(--ink)}
  .spin{animation:rot 1.1s linear infinite;transform-origin:center}
  @keyframes rot{to{transform:rotate(360deg)}}
  .dlg-sum{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
  .kv{display:flex;gap:8px;font-size:12px;margin-top:6px}
  .kv:first-of-type{margin-top:0}
  .k{flex:none;width:34px;color:var(--ink-3);font-size:11px;padding-top:1px}
  .val{color:var(--ink-2)}
  .fnote{margin-top:8px;font-size:11px;color:var(--amber)}
  .dlg-actions{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:8px}
  .dlg-actions .btn{width:100%;justify-content:center;min-height:36px}

  /* actions */
  .actions{display:flex;align-items:center;gap:8px;margin-top:10px}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    min-height:30px;padding:0 10px;border-radius:6px;
    border:1px solid var(--line);background:var(--card);
    font-size:12px;color:var(--ink-2);
  }
  .btn:hover{border-color:#d6d9df;color:var(--ink)}
  .btn.live .ldot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2.4s ease-in-out infinite}
  .btn.live.off .ldot{background:var(--gray-dot);animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .btn.primary{
    border-color:transparent;background:var(--accent);color:#fff;font-weight:500;
  }
  .btn.primary:hover{background:#5560c4;color:#fff}
  .btn.primary .tier{
    font-size:10px;font-weight:500;letter-spacing:.2px;
    background:rgba(255,255,255,.22);border-radius:4px;padding:1px 5px;
  }
  .btn.repair{border-color:#ead9b2;color:var(--amber);background:#fdfaf2}
  .btn.repair:hover{color:var(--amber);border-color:#dfc98f}
  .last{margin-left:auto;color:var(--ink-3);font-size:11px;white-space:nowrap}
  .card.needs-you .last{color:var(--red)}

  /* demo-off state */
  .offboard{
    display:none;margin:40px 24px 0;padding:44px 20px;text-align:center;
    border:1px dashed var(--line);border-radius:var(--radius);color:var(--ink-3);font-size:12.5px;
  }
  body.demo-off .board,body.demo-off .health,body.demo-off .seg{display:none}
  body.demo-off .offboard{display:block}

  /* ---------- responsive ---------- */
  @media (max-width:980px){
    .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:900px){
    .overlay{padding:0}
    .dialog{width:100vw;max-width:none;height:100dvh;border-radius:0;border:none}
    .dlg-tabs{display:flex}
    .dlg-close{width:44px;height:44px;min-height:44px}
    .pane-term{display:none;border-right:none}
    .pane-tasks{display:none}
    .dialog[data-tab="terminal"] .pane-term{display:flex}
    .dialog[data-tab="tasks"] .pane-tasks{display:flex}
    .dlg-actions .btn{min-height:44px}
  }
  @media (max-width:640px){
    .topbar{padding:12px 16px}
    .health{padding:12px 16px 0}
    .seg{display:flex}
    .board{grid-template-columns:1fr;gap:24px;padding:16px 16px 0}
    .board[data-filter="needs_you"] .col:not([data-col="needs_you"]),
    .board[data-filter="working"] .col:not([data-col="working"]),
    .board[data-filter="waiting"] .col:not([data-col="waiting"]),
    .board[data-filter="stale"] .col:not([data-col="stale"]){display:none}
    .btn{min-height:44px;padding:0 14px}
    .demo-toggle{min-height:44px}
    .card{padding:14px 14px 12px}
  }
</style>
</head>
<body>

<header class="topbar">
  <span class="wordmark">
    <span class="mark" aria-hidden="true">
      <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><rect x="0.5" y="0.5" width="3.2" height="3.2" rx="0.8" fill="#fff"/><rect x="5.3" y="0.5" width="3.2" height="3.2" rx="0.8" fill="#fff" opacity=".55"/><rect x="0.5" y="5.3" width="3.2" height="3.2" rx="0.8" fill="#fff" opacity=".55"/><rect x="5.3" y="5.3" width="3.2" height="3.2" rx="0.8" fill="#fff" opacity=".3"/></svg>
    </span>
    FleetBoard
  </span>
  <span class="built" id="built"></span>
  <span class="spacer"></span>
  <button class="demo-toggle" id="demoToggle" aria-pressed="true" aria-label="Demo data toggle">
    <span class="switch" aria-hidden="true"></span>
    Demo data
  </button>
</header>

<div class="health" id="health" aria-label="Fleet health"></div>

<nav class="seg" id="seg" aria-label="Column filter"></nav>

<main class="board" id="board" data-filter="all"></main>

<div class="offboard" id="offboard">Demo data off — no live fleet source connected in this mockup.<br>Turn the toggle back on to restore the sample fleet.</div>

<div class="overlay" id="overlay" hidden>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-label="Session detail" data-tab="terminal">
    <header class="dlg-head" id="dlgHead"></header>
    <nav class="dlg-tabs" id="dlgTabs" aria-label="Dialog panes">
      <button data-tab="terminal" aria-selected="true">Terminal</button>
      <button data-tab="tasks" aria-selected="false">Tasks</button>
    </nav>
    <div class="dlg-body">
      <section class="pane-term" id="paneTerm"></section>
      <aside class="pane-tasks" id="paneTasks"></aside>
    </div>
  </div>
</div>

  /* ---------- helpers ---------- */
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function fmtTok(n){
    if(n >= 1e6){ var m = n/1e6; return (m % 1 === 0 ? m.toFixed(0) : m.toFixed(1)) + "M"; }
    if(n >= 1e3){ return Math.round(n/1e3) + "K"; }
    return String(n);
  }

  /* tiny 12px stroke icons */

    clock:'<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><circle cx="6" cy="6" r="4.4"/><path d="M6 3.6V6l1.7 1"/></svg>',
    msg:'<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.4 7.4a1.6 1.6 0 0 1-1.6 1.6H4.4L1.6 11V3.2a1.6 1.6 0 0 1 1.6-1.6h5.6a1.6 1.6 0 0 1 1.6 1.6z"/></svg>',
    eye:'<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6s1.9-3.4 5-3.4S11 6 11 6s-1.9 3.4-5 3.4S1 6 1 6Z"/><circle cx="6" cy="6" r="1.5"/></svg>',
    play:'<svg width="10" height="10" viewBox="0 0 12 12" fill="currentColor"><path d="M3.2 1.8 10 6 3.2 10.2z"/></svg>',
    wrench:'<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.6 1.6a2.8 2.8 0 0 0-3.5 3.5L1.4 7.8a1.3 1.3 0 0 0 1.8 1.8l2.7-2.7a2.8 2.8 0 0 0 3.5-3.5L7.6 5.2 6.4 4z"/></svg>',
    x:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg>',
    check:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" fill="#5e6ad2"/><path d="M4.4 7.2 6.2 9l3.4-3.8" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>',
    circle:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#c6c8cd" stroke-width="1.2"><circle cx="7" cy="7" r="5.6"/></svg>',
    spinner:'<svg class="spin" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#46a758" stroke-width="1.5" stroke-linecap="round"><path d="M7 1.4A5.6 5.6 0 1 1 1.4 7"/></svg>',
    warn:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#c9962b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1.8 12.8 12H1.2Z"/><path d="M7 5.6v2.8M7 10.4v.01"/></svg>'
  };

  var COLS = [
    {id:"needs_you", label:"Needs You", dotClass:"needs"},
    {id:"working",   label:"Working",   dotClass:"work"},
    {id:"waiting",   label:"Waiting",   dotClass:"wait"},
    {id:"stale",     label:"Stale",     dotClass:"stal"}
  ];

  function colFor(s){
    if(s.stale) return "stale";
    if(s.status === "needs_input") return "needs_you";
    if(s.status === "working") return "working";
    return "waiting";
  }

  /* ---------- built time ---------- */
  var built = new Date(FLEET.builtAt);
  document.getElementById("built").textContent =
    "updated " + built.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});

  /* ---------- health strip ---------- */
  var healthEl = document.getElementById("health");
  var hh = "";
  Object.keys(FLEET.nodes).forEach(function(name){
    var n = FLEET.nodes[name];
    var dead = n.liveness === "dead";
    hh += '<span class="node-chip' + (dead ? " dead" : "") + '"' +
          (n.note ? ' title="' + esc(n.note) + '"' : '') + '>' +
          '<span class="dot ' + (dead ? "dead" : "fresh") + '"></span>' +
          '<span class="nname">' + esc(name) + '</span>' +
          (dead ? '<span class="nstate">DEAD</span>' : '') +
          '<span class="ncount">' + n.sessions + '</span></span>';
  });
  var t = FLEET.totals;
  hh += '<span class="totals"><b>' + t.sessions + ' sessions</b> &middot; ' +
        '<span class="ny">' + t.needsYou + ' need you</span> &middot; ' +
        fmtTok(t.tokensToday) + ' tok &middot; ' + fmtCost(t.estCostToday) + '</span>';
  healthEl.innerHTML = hh;

  /* ---------- board ---------- */
  var board = document.getElementById("board");
  var byCol = {needs_you:[], working:[], waiting:[], stale:[]};
  FLEET.sessions.forEach(function(s){ byCol[colFor(s)].push(s); });

  function ctxClass(p){ return p >= 80 ? "hot" : (p >= 65 ? "warm" : ""); }

  function numsHTML(s, extraClass, withIdle){
    return '<div class="nums' + (extraClass ? ' ' + extraClass : '') + '">' +
      '<span class="num ctx ' + ctxClass(s.contextPct) + '" title="Context used">' + IC.gauge +
        '<span class="ctxbar"><i style="width:' + s.contextPct + '%"></i></span>' +
        '<span class="v">' + s.contextPct + '%</span></span>' +
      '<span class="num" title="Tokens">' + IC.tok + '<span class="v">' + fmtTok(s.tokens) + '</span></span>' +
      '<span class="num" title="Est. cost">' + IC.dollar + '<span class="v">' + fmtCost(s.cost) + '</span></span>' +
      '<span class="num" title="Active time">' + IC.clock + '<span class="v">' + esc(s.elapsedActive) + '</span></span>' +
      '<span class="num" title="Messages">' + IC.msg + '<span class="v">' + s.msgs + '</span></span>' +
      (withIdle ? '<span class="num" title="Idle"><span class="v">idle ' + esc(s.idle) + '</span></span>' : '') +
    '</div>';
  }

  function cardHTML(s, colId){
    var live = s.status === "working";
    var cls = "card";
    if(colId === "needs_you") cls += " needs-you";
    if(colId === "stale") cls += " is-stale";
    var statusDot = colId === "needs_you" ? "needs" : colId === "working" ? "work" : colId === "waiting" ? "wait" : "stal";
    var statusLabel = colId === "needs_you" ? "needs you" : colId === "stale" ? "stale" : colId;

    var action;
    if(!s.worktreeOk){
      action = '<button class="btn repair" data-act="repair" aria-label="Repair worktree for ' + esc(s.project) + '">' +
               IC.wrench + 'Repair</button>';
    } else {
      action = '<button class="btn primary" data-act="resume" aria-label="' + esc(s.resumeTier) + ' session ' + esc(s.project) + '">' +
               IC.play + 'Resume<span class="tier">' + esc(s.resumeTier) + '</span></button>';
    }

    return '<article class="' + cls + '" tabindex="0" role="button" aria-haspopup="dialog" data-sid="' + esc(s.session_id) + '">' +
      '<div class="row1">' +
        '<span class="proj">' + esc(s.project) + '</span>' +
        '<span class="host">' + esc(s.host) + '</span>' +
        '<span class="status-inline"><span class="dot ' + statusDot + '"></span>' + esc(statusLabel) + '</span>' +
      '</div>' +
      '<div class="branch">' + esc(s.branch) + ' &middot; ' + esc(s.model) + (s.source ? ' &middot; ' + esc(s.source) : '') + '</div>' +
      '<div class="now" title="' + esc(s.summary.now) + '">' + esc(s.summary.now) + '</div>' +
      numsHTML(s, "", false) +
      '<div class="actions">' +
        '<button class="btn live' + (live ? '' : ' off') + '" data-act="live" aria-label="Live view of ' + esc(s.project) + '">' +
          '<span class="ldot"></span>' + IC.eye + 'Live</button>' +
        action +
        '<span class="last">' + esc(s.lastActivity) + '</span>' +
      '</div>' +
    '</article>';
  }

  var bh = "";
  COLS.forEach(function(c){
    var list = byCol[c.id];
    bh += '<section class="col" data-col="' + c.id + '">' +
      '<header class="col-head"><span class="cdot"></span>' +
      '<span class="cname">' + c.label + '</span>' +
      '<span class="count">' + list.length + '</span></header>' +
      '<div class="cards">';
    if(list.length === 0){
      bh += '<div class="empty">Nothing here</div>';
    } else {
      list.forEach(function(s){ bh += cardHTML(s, c.id); });
    }
    bh += '</div></section>';
  });
  board.innerHTML = bh;

  /* ---------- interactions ---------- */
  board.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-act]");
    if(btn){
      e.stopPropagation();
      return; /* mockup: LIVE / Resume / Repair keep their own behavior */
    }
    var card = e.target.closest(".card");
    if(card) openDialog(card.getAttribute("data-sid"), card);
  });
  board.addEventListener("keydown", function(e){
    if(e.key !== "Enter" && e.key !== " ") return;
    var card = e.target.closest(".card");
    if(card && e.target === card){
      e.preventDefault();
      openDialog(card.getAttribute("data-sid"), card);
    }
  });

  /* ---------- expanded session dialog ---------- */
  var overlay = document.getElementById("overlay");
  var dialogEl = document.getElementById("dialog");
  var dlgHead = document.getElementById("dlgHead");
  var paneTerm = document.getElementById("paneTerm");
  var paneTasks = document.getElementById("paneTasks");
  var dlgTabs = document.getElementById("dlgTabs");
  var streamTimer = null;
  var lastFocus = null;

  function fmtAge(m){
    if(m < 60) return m + "m";
    if(m < 1440) return Math.round(m/60) + "h";
    return Math.round(m/1440) + "d";
  }

  function termLineHTML(line){
    var idx = line.indexOf("  ");
    var ts = idx > 0 ? line.slice(0, idx) : "";
    var rest = idx > 0 ? line.slice(idx + 2) : line;
    var kind = "";
    var c0 = rest.charAt(0);
    if(c0 === "⚠") kind = " warn";
    else if(c0 === "\ud83d" || c0 === "⏸") kind = " dim";
    else if(c0 === "│") kind = " pipe";
    return '<div class="tline' + kind + '"><span class="ts">' + esc(ts) + '</span>  ' + esc(rest) + '</div>';
  }

  function setTab(name){
    dialogEl.setAttribute("data-tab", name);
    Array.prototype.forEach.call(dlgTabs.querySelectorAll("button"), function(b){
      b.setAttribute("aria-selected", b.getAttribute("data-tab") === name ? "true" : "false");
    });
  }
  dlgTabs.addEventListener("click", function(e){
    var b = e.target.closest("button[data-tab]");
    if(b) setTab(b.getAttribute("data-tab"));
  });

  function openDialog(sid, sourceEl){
    var s = null;
    FLEET.sessions.forEach(function(x){ if(x.session_id === sid) s = x; });
    if(!s) return;
    if(streamTimer){ clearInterval(streamTimer); streamTimer = null; }
    lastFocus = sourceEl || null;

    var colId = colFor(s);
    var pillCls = colId === "needs_you" ? "needs" : colId === "working" ? "work" : colId === "waiting" ? "wait" : "stal";
    var pillLabel = colId === "needs_you" ? "needs you" : colId === "stale" ? "stale" : colId;

    dlgHead.innerHTML =
      '<span class="dlg-title">' + esc(s.project) + '</span>' +
      '<span class="chip">' + esc(s.branch) + '</span>' +
      '<span class="chip">' + esc(s.host) + '</span>' +
      '<span class="chip">' + esc(s.model) + '</span>' +
      '<span class="pill ' + pillCls + '"><span class="dot"></span>' + esc(pillLabel) + '</span>' +
      numsHTML(s, "dlg-nums", true) +
      '<button class="dlg-close" id="dlgClose" aria-label="Close dialog">' + IC.x + '</button>';

    /* left: terminal */
    var working = s.status === "working" && !s.stale;
    var bar = '<div class="term-bar"><span>Terminal</span>' +
      (working ? '<span class="badge-live"><span class="dot"></span>LIVE</span>'
               : (s.stale ? '<span class="frozen">frozen at last activity (' + esc(s.lastActivity) + ')</span>'
                          : '<span>idle ' + esc(s.idle) + '</span>')) +
      '</div>';
    paneTerm.innerHTML = bar + '<div class="term" id="termScroll" aria-label="Session terminal"></div>';
    var term = document.getElementById("termScroll");
    var lines = s.terminal || [];
    var demoOn = document.getElementById("demoToggle").getAttribute("aria-pressed") === "true";
    if(working && demoOn && lines.length){
      var i = 0;
      streamTimer = setInterval(function(){
        if(i < lines.length){
          term.insertAdjacentHTML("beforeend", termLineHTML(lines[i]));
          i++;
        } else {
          clearInterval(streamTimer); streamTimer = null;
          term.insertAdjacentHTML("beforeend", '<div class="tline tcursor"><span class="ts"></span></div>');
        }
        term.scrollTop = term.scrollHeight;
      }, 280);
    } else {
      var h = "";
      lines.forEach(function(l){ h += termLineHTML(l); });
      term.innerHTML = h;
      term.scrollTop = term.scrollHeight;
    }

    /* right: tasks rail */
    var th = '<div class="rail-h">Tasks</div>';
    (s.tasks || []).forEach(function(tk){
      var icon = tk.status === "done" ? IC.check :
                 tk.status === "in_progress" ? IC.spinner :
                 tk.status === "blocked" ? IC.warn : IC.circle;
      th += '<div class="task ' + esc(tk.status) + '"><span class="ti">' + icon + '</span><span class="tt">' + esc(tk.title) + '</span></div>';
    });
    th += '<div class="dlg-sum">' +
      '<div class="rail-h">Summary<span class="stamp">updated ' + fmtAge(s.summaryAgeMin) + ' ago</span></div>' +
      '<div class="kv"><span class="k">Now</span><span class="val">' + esc(s.summary.now) + '</span></div>' +
      '<div class="kv"><span class="k">Next</span><span class="val">' + esc(s.summary.next) + '</span></div>' +
      '<div class="kv"><span class="k">Goal</span><span class="val">' + esc(s.summary.goal) + '</span></div>' +
      (s.note ? '<div class="fnote">' + esc(s.note) + '</div>' : '') +
      '</div>';
    th += '<div class="dlg-actions">';
    if(!s.worktreeOk){
      th += '<button class="btn repair" data-act="repair" aria-label="Repair worktree">' + IC.wrench + 'Repair worktree</button>';
    } else {
      th += '<button class="btn primary" data-act="resume" aria-label="' + esc(s.resumeTier) + ' session">' + IC.play + 'Resume<span class="tier">' + esc(s.resumeTier) + '</span></button>';
    }
    th += '</div>';
    paneTasks.innerHTML = th;

    setTab("terminal");
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    var cb = document.getElementById("dlgClose");
    if(cb) cb.focus();
  }

  function closeDialog(){
    if(overlay.hidden) return;
    if(streamTimer){ clearInterval(streamTimer); streamTimer = null; }
    overlay.hidden = true;
    document.body.style.overflow = "";
    if(lastFocus && lastFocus.focus) lastFocus.focus();
    lastFocus = null;
  }
  overlay.addEventListener("click", function(e){ if(e.target === overlay) closeDialog(); });
  dlgHead.addEventListener("click", function(e){ if(e.target.closest("#dlgClose")) closeDialog(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeDialog(); });
  paneTasks.addEventListener("click", function(e){
    var b = e.target.closest("button[data-act]");
    if(b) e.stopPropagation(); /* mockup: inert action */
  });

  /* ---------- segmented filter (mobile) ---------- */
  var seg = document.getElementById("seg");
  var segItems = [{id:"all", label:"All", dot:null}].concat(COLS.map(function(c){
    return {id:c.id, label:c.label, dot:c.id};
  }));
  var sh = "";
  segItems.forEach(function(it){
    var dotColor = it.dot === "needs_you" ? "var(--red)" :
                   it.dot === "working" ? "var(--green)" :
                   it.dot === "waiting" ? "var(--amber)" :
                   it.dot === "stale" ? "var(--gray-dot)" : null;
    sh += '<button data-filter="' + it.id + '" aria-pressed="' + (it.id === "all" ? "true" : "false") + '">' +
          (dotColor ? '<span class="sdot" style="background:' + dotColor + '"></span>' : '') +
          esc(it.label) +
          (it.id !== "all" ? ' <span style="opacity:.6">' + byCol[it.id].length + '</span>' : '') +
          '</button>';
  });
  seg.innerHTML = sh;
  seg.addEventListener("click", function(e){
    var b = e.target.closest("button[data-filter]");
    if(!b) return;
    board.setAttribute("data-filter", b.getAttribute("data-filter"));
    Array.prototype.forEach.call(seg.querySelectorAll("button"), function(x){
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
  });

  /* ---------- demo toggle ---------- */
  var demo = document.getElementById("demoToggle");
  demo.addEventListener("click", function(){
    var on = demo.getAttribute("aria-pressed") === "true";
    demo.setAttribute("aria-pressed", on ? "false" : "true");
    document.body.classList.toggle("demo-off", on);
  });
})();
</script>
</body>
</html>
