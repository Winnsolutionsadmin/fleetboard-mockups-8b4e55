<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetBoard — Sessions</title>
<style>
  :root{
    --brand:#7b68ee; --brand-dark:#5f4dd0; --brand-soft:#efecfd;
    --ink:#2a2e43; --ink-soft:#6b7186; --ink-faint:#9aa1b5;
    --line:#e6e9f2; --ws:#fafbfc;
    --c-needs:#f0555f; --c-needs-bg:#fdeef0;
    --c-work:#4c9aff;  --c-work-bg:#eef5ff;
    --c-wait:#f0a92e;  --c-wait-bg:#fdf6ea;
    --c-stale:#98a1b3; --c-stale-bg:#f3f4f7;
    --ok:#27ae60; --warn:#f0a92e; --bad:#e5484d;
    --shadow:0 1px 3px rgba(42,46,67,.08), 0 1px 2px rgba(42,46,67,.05);
    --shadow-hover:0 4px 14px rgba(42,46,67,.13);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--ws); color:var(--ink);
    -webkit-font-smoothing:antialiased; font-size:14px;
    display:flex; flex-direction:column; min-height:100vh;
  }
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  svg{display:block;flex:none}

  /* ── Top bar ─────────────────────────────── */
  .topbar{
    display:flex;align-items:center;gap:16px;
    background:#fff;border-bottom:1px solid var(--line);
    padding:0 16px;height:56px;flex:none;position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{
    width:30px;height:30px;border-radius:8px;flex:none;
    background:linear-gradient(135deg,#8f7ff5,#6a5ae0);
    color:#fff;font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(123,104,238,.4);
  }
  .brand h1{font-size:16px;font-weight:700;white-space:nowrap}
  .brand .ws-name{color:var(--ink-faint);font-size:13px;white-space:nowrap}
  .brand .ws-name::before{content:"/";margin-right:8px;color:var(--line)}

  .view-tabs{display:flex;gap:2px;margin-left:4px}
  .view-tabs button{
    display:flex;align-items:center;gap:6px;
    padding:0 12px;min-height:44px;font-size:13.5px;font-weight:500;
    color:var(--ink-soft);border-bottom:2px solid transparent;border-radius:6px 6px 0 0;
  }
  .view-tabs button:hover{background:var(--brand-soft);color:var(--brand-dark)}
  .view-tabs button.active{color:var(--brand-dark);border-bottom-color:var(--brand);font-weight:600}

  .topbar .spacer{flex:1}
  .search{
    display:flex;align-items:center;gap:8px;
    background:var(--ws);border:1px solid var(--line);border-radius:8px;
    padding:0 12px;height:36px;width:220px;color:var(--ink-faint);
  }
  .search input{border:0;background:none;outline:none;font:inherit;color:var(--ink);width:100%}
  .search input::placeholder{color:var(--ink-faint)}

  .demo-toggle{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;user-select:none}
  .demo-toggle .lbl{font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
  .switch{position:relative;width:40px;height:22px;flex:none}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
  .switch .track{
    position:absolute;inset:0;border-radius:999px;background:#d5d9e6;transition:background .15s;
  }
  .switch .knob{
    position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s;pointer-events:none;
  }
  .switch input:checked ~ .track{background:var(--brand)}
  .switch input:checked ~ .knob{transform:translateX(18px)}

  .me-avatar{
    width:32px;height:32px;border-radius:50%;flex:none;
    background:linear-gradient(135deg,#ffb26b,#f0555f);
    color:#fff;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }

  /* ── Fleet health strip ──────────────────── */
  .health{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex:none;
  }
  .node-chip{
    display:flex;align-items:center;gap:7px;
    border:1px solid var(--line);border-radius:999px;
    padding:5px 12px 5px 8px;background:var(--ws);font-size:12.5px;font-weight:600;
  }
  .node-chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .node-chip.fresh .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(39,174,96,.15)}
  .node-chip.dead{background:#fdeef0;border-color:#f6c7cb;color:#c02b34}
  .node-chip.dead .dot{background:var(--bad);box-shadow:0 0 0 3px rgba(229,72,77,.18);animation:pulse 1.4s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(229,72,77,.05)}}
  .node-chip .sub{font-weight:500;color:var(--ink-faint)}
  .node-chip.dead .sub{color:#c02b34;font-weight:700}
  .health .totals{
    margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    color:var(--ink-soft);font-size:12.5px;
  }
  .health .totals b{color:var(--ink)}
  .health .totals .sep{color:var(--line)}
  .health .totals .hot{color:var(--c-needs);font-weight:700}

  /* ── Demo-off banner ─────────────────────── */
  .demo-banner{
    display:none;align-items:center;gap:8px;
    background:#fff8e6;border-bottom:1px solid #f2e2b3;color:#8a6a12;
    padding:8px 16px;font-size:13px;
  }
  body.demo-off .demo-banner{display:flex}
  body.demo-off .board{opacity:.45;filter:saturate(.4);pointer-events:none}

  /* ── Mobile segmented filter ─────────────── */
  .seg{
    display:none;gap:6px;overflow-x:auto;
    padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);
    -webkit-overflow-scrolling:touch;
  }
  .seg button{
    flex:none;min-height:44px;padding:0 14px;border-radius:10px;
    font-size:13px;font-weight:600;color:var(--ink-soft);
    background:var(--ws);border:1px solid var(--line);
    display:flex;align-items:center;gap:6px;
  }
  .seg button .pin{width:8px;height:8px;border-radius:50%}
  .seg button.active{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-dark)}

  /* ── Board ───────────────────────────────── */
  .board{
    flex:1;display:flex;gap:14px;align-items:flex-start;
    padding:16px;overflow-x:auto;
  }
  .col{
    flex:1 1 0;min-width:255px;max-width:340px;
    background:var(--col-bg,#f4f5f9);border-radius:12px;padding:8px;
  }
  .col-head{
    display:flex;align-items:center;gap:8px;
    background:var(--col-color);color:#fff;
    border-radius:8px;padding:8px 12px;margin-bottom:10px;
    box-shadow:var(--shadow);
  }
  .col-head .t{font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
  .col-head .count{
    margin-left:auto;background:rgba(255,255,255,.28);
    border-radius:999px;min-width:24px;height:20px;padding:0 8px;
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .col[data-col="needs_you"]{
    box-shadow:0 0 0 1.5px rgba(240,85,95,.35), 0 6px 20px rgba(240,85,95,.14);
  }
  .col[data-col="needs_you"] .col-head{box-shadow:0 3px 10px rgba(240,85,95,.35)}
  .col[data-col="stale"]{opacity:.82}
  .col[data-col="stale"] .card{box-shadow:none;border-color:#e0e3ec}

  .cards{display:flex;flex-direction:column;gap:10px}
  .empty{
    border:2px dashed #d8dce8;border-radius:12px;padding:22px 12px;
    text-align:center;color:var(--ink-faint);font-size:13px;background:rgba(255,255,255,.5);
  }

  /* ── Card ────────────────────────────────── */
  .card{
    background:#fff;border:1px solid var(--line);
    border-left:3px solid var(--edge,#ccc);
    border-radius:11px;box-shadow:var(--shadow);
    padding:12px 12px 10px;cursor:pointer;
    transition:box-shadow .15s, transform .15s;
  }
  .card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px)}
  .card-top{display:flex;align-items:center;gap:9px;min-width:0}
  .host-avatar{
    width:28px;height:28px;border-radius:50%;flex:none;
    color:#fff;font-size:10.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(42,46,67,.2);
  }
  .card-title{min-width:0;flex:1}
  .card-title .proj{font-size:15px;font-weight:700;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-title .host-line{font-size:11.5px;color:var(--ink-faint);margin-top:1px;
    display:flex;align-items:center;gap:5px}
  .host-line .hd{width:6px;height:6px;border-radius:50%;flex:none}
  .chev{color:var(--ink-faint);transition:transform .18s;flex:none}
  .card.open .chev{transform:rotate(180deg)}

  .now{
    margin-top:9px;font-size:13px;line-height:1.35;color:var(--ink-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card[data-status="needs_input"] .now{color:#b8353e;font-weight:600}

  .tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .tag{
    font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;
    background:var(--brand-soft);color:var(--brand-dark);
    max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tag.model{background:#eaf7f0;color:#1d7a45}
  .tag.src{background:#fdf2e5;color:#a5651a}
  .tag.warn{background:#fdeef0;color:#c02b34}

  .stats{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .ring{position:relative;width:34px;height:34px;flex:none}
  .ring svg{width:34px;height:34px;transform:rotate(-90deg)}
  .ring .pct{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:8.5px;font-weight:700;color:var(--ink);
  }
  .stat{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink-soft)}
  .stat svg{color:var(--ink-faint)}
  .stat.age{margin-left:auto;font-weight:500;color:var(--ink-faint)}
  .card[data-status="needs_input"] .stat.age{color:var(--c-needs);font-weight:700}

  .actions{display:flex;gap:8px;margin-top:10px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    min-height:44px;border-radius:9px;font-size:13px;font-weight:600;
    padding:0 12px;transition:background .12s;
  }
  .btn-live{
    background:#fff;border:1.5px solid var(--line);color:var(--ink-soft);flex:none;
  }
  .btn-live:hover{border-color:var(--brand);color:var(--brand-dark);background:var(--brand-soft)}
  .btn-live .live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 0 2.5px rgba(39,174,96,.2)}
  .btn-primary{
    flex:1;background:var(--brand);color:#fff;box-shadow:0 2px 6px rgba(123,104,238,.35);
  }
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-primary .tier{
    background:rgba(255,255,255,.24);border-radius:999px;
    font-size:10.5px;font-weight:700;padding:2px 8px;letter-spacing:.3px;text-transform:uppercase;
  }
  .btn-primary.revive{background:#e07c1f;box-shadow:0 2px 6px rgba(224,124,31,.35)}
  .btn-primary.revive:hover{background:#c76c17}
  .btn-primary.repair{background:#e5484d;box-shadow:0 2px 6px rgba(229,72,77,.35)}
  .btn-primary.repair:hover{background:#c93b40}

  /* ── Expanded session dialog ─────────────── */
  body.dlg-open{overflow:hidden}
  .overlay{
    position:fixed;inset:0;z-index:50;background:rgba(42,46,67,.45);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
  }
  .overlay[hidden]{display:none}
  .dialog{
    background:#fff;border-radius:14px;overflow:hidden;
    box-shadow:0 24px 70px rgba(20,24,45,.4);
    width:92vw;max-width:1280px;height:88vh;
    display:flex;flex-direction:column;
  }
  .dlg-head{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:12px 16px;border-bottom:2px solid var(--brand-soft);background:#fff;
  }
  .dlg-proj{display:flex;align-items:center;gap:10px;min-width:0}
  .dlg-proj .host-avatar{width:32px;height:32px;font-size:12px}
  .dlg-proj h2{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dlg-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .status-pill{
    font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    color:#fff;border-radius:999px;padding:4px 10px;
  }
  .dlg-stats{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
  .dlg-close{
    width:44px;height:44px;border-radius:10px;flex:none;
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  }
  .dlg-close:hover{background:var(--brand-soft);color:var(--brand-dark)}
  .dlg-tabs{display:none}
  .dlg-body{flex:1;display:flex;min-height:0}
  .dlg-term{flex:62 1 0;min-width:0;display:flex;flex-direction:column;background:#23273a}
  .term-bar{
    display:flex;align-items:center;gap:10px;padding:8px 14px;
    background:#2c3049;border-bottom:1px solid #3a3f5c;
    color:#aab1cc;font-size:12px;font-weight:600;
  }
  .term-bar .dots{display:flex;gap:5px}
  .term-bar .dots i{width:9px;height:9px;border-radius:50%;display:block}
  .term-bar .tb-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live-badge{
    margin-left:auto;display:flex;align-items:center;gap:6px;flex:none;
    background:rgba(39,174,96,.18);color:#5fdb96;border-radius:999px;
    padding:3px 10px;font-size:10.5px;font-weight:700;letter-spacing:.5px;
  }
  .live-badge .live-dot{width:7px;height:7px;border-radius:50%;background:#3ecf7a;animation:pulse 1.4s infinite}
  .frozen-badge{margin-left:auto;flex:none;color:#8b91ad;font-size:11px;font-weight:600}
  .term-scroll{
    flex:1;overflow-y:auto;padding:12px 16px;
    font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px;line-height:1.7;color:#c9d0e8;
  }
  .tline{white-space:pre-wrap;word-break:break-word}
  .tline.warn{color:#ffb454}
  .tline.dim{color:#7d84a3}
  .tline.spin{color:#9d8ffb}
  .tline.frozen-note{color:#8b91ad;font-style:italic;border-top:1px dashed #3a3f5c;margin-top:8px;padding-top:8px}
  .dlg-rail{
    flex:38 1 0;min-width:0;border-left:1px solid var(--line);
    background:#fff;overflow-y:auto;padding:14px 16px;
  }
  .rail-h{
    font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:var(--brand-dark);margin:16px 0 8px;
  }
  .rail-h:first-child{margin-top:0}
  .task{
    display:flex;gap:9px;align-items:flex-start;
    padding:9px 10px;border:1px solid var(--line);border-radius:9px;
    margin-bottom:6px;font-size:13px;line-height:1.35;background:#fff;
  }
  .task .tk-ic{
    flex:none;width:18px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .task.done{color:var(--ink-faint)}
  .task.done .tk-title{text-decoration:line-through}
  .task.done .tk-ic{background:var(--brand);color:#fff}
  .task.in_progress{border-color:#bcd8ff;background:#f4f9ff}
  .task.in_progress .tk-ic{border:2px solid #4c9aff}
  .task.in_progress .tk-ic i{width:8px;height:8px;border-radius:50%;background:#4c9aff;display:block;animation:pulse 1.2s infinite}
  .task.blocked{border-color:#f6c7cb;background:#fdf1f2;color:#a1333b}
  .task.blocked .tk-ic{color:#e5484d}
  .task.pending .tk-ic{border:2px solid #ccd2e0}
  .tk-sub{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-top:2px}
  .task.blocked .tk-sub{color:#c02b34}
  .task.in_progress .tk-sub{color:#2f7fe0}
  .sumrow{display:flex;gap:8px;margin-bottom:8px;font-size:12.5px;line-height:1.45}
  .sumrow .k{
    flex:none;width:40px;font-size:10px;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--ink-faint);padding-top:2px;
  }
  .sumrow .v{color:var(--ink-soft)}
  .stamp{font-size:11px;color:var(--ink-faint);margin:2px 0 10px}
  .rail-note{
    background:#fff8e6;border:1px solid #f2e2b3;color:#8a6a12;
    border-radius:8px;padding:7px 10px;font-size:12px;margin-bottom:8px;
  }
  .rail-actions{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .rail-actions .btn{width:100%}
  @media (max-width:899px){
    .overlay{padding:0}
    .dialog{width:100%;max-width:none;height:100vh;height:100dvh;border-radius:0}
    .dlg-tabs{display:flex;border-bottom:1px solid var(--line);background:#fff}
    .dlg-tabs button{
      flex:1;min-height:44px;font-size:13.5px;font-weight:600;
      color:var(--ink-soft);border-bottom:2px solid transparent;
    }
    .dlg-tabs button.active{color:var(--brand-dark);border-bottom-color:var(--brand)}
    .dlg-body{flex-direction:column}
    .dlg-term,.dlg-rail{flex:1;border-left:0}
    .dialog[data-tab="term"] .dlg-rail{display:none}
    .dialog[data-tab="tasks"] .dlg-term{display:none}
  }

  /* ── Responsive ──────────────────────────── */
  @media (max-width:860px){
    .search{display:none}
    .brand .ws-name{display:none}
  }
  @media (max-width:700px){
    .view-tabs{display:none}
    .seg{display:flex}
    .board{flex-direction:column;overflow-x:visible;padding:12px}
    .col{max-width:none;width:100%;min-width:0}
    .board[data-filter="needs_you"] .col:not([data-col="needs_you"]),
    .board[data-filter="working"] .col:not([data-col="working"]),
    .board[data-filter="waiting"] .col:not([data-col="waiting"]),
    .board[data-filter="stale"] .col:not([data-col="stale"]){display:none}
    .health .totals{margin-left:0;width:100%}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">FB</div>
    <h1>FleetBoard</h1>
    <span class="ws-name">Winn Fleet</span>
  </div>
  <nav class="view-tabs" aria-label="Views (decorative)">
    <button class="active" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="12" rx="1.5"/></svg>
      Board</button>
    <button type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      List</button>
    <button type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
      Calendar</button>
  </nav>
  <div class="spacer"></div>
  <label class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    <input type="search" placeholder="Search sessions…" aria-label="Search (decorative)">
  </label>
  <label class="demo-toggle">
    <span class="lbl">Demo</span>
    <span class="switch">
      <input type="checkbox" id="demoToggle" checked aria-label="Demo mode">
      <span class="track"></span><span class="knob"></span>
    </span>
  </label>
  <div class="me-avatar" title="Jarred">JW</div>
</header>

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function icon(paths, size){
  const s = size || 13;
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 24 24");
  svg.setAttribute("width",s); svg.setAttribute("height",s);
  svg.setAttribute("fill","none"); svg.setAttribute("stroke","currentColor");
  svg.setAttribute("stroke-width","2"); svg.setAttribute("stroke-linecap","round");
  svg.setAttribute("stroke-linejoin","round");
  paths.forEach(function(d){
    const p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d", d); svg.appendChild(p);
  });
  return svg;
}

function fmtTokens(n){
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"") + "M";
  if (n >= 1e3) return Math.round(n/1e3) + "K";
  return String(n);
}
function fmtCost(c){
  return c >= 10 ? "$" + Math.round(c) : "$" + c.toFixed(2).replace(/0$/,"");

function ringNode(pct){
  const wrap = el("div","ring");
  wrap.title = "Context " + pct + "% used";
  const R = 14, C = 2 * Math.PI * R;
  const color = pct >= 75 ? "#e5484d" : (pct >= 50 ? "#f0a92e" : "#27ae60");
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 34 34");
  const bg = document.createElementNS("http://www.w3.org/2000/svg","circle");
  bg.setAttribute("cx","17"); bg.setAttribute("cy","17"); bg.setAttribute("r",R);
  bg.setAttribute("fill","none"); bg.setAttribute("stroke","#edeff5"); bg.setAttribute("stroke-width","3.5");
  const fg = document.createElementNS("http://www.w3.org/2000/svg","circle");
  fg.setAttribute("cx","17"); fg.setAttribute("cy","17"); fg.setAttribute("r",R);
  fg.setAttribute("fill","none"); fg.setAttribute("stroke",color); fg.setAttribute("stroke-width","3.5");
  fg.setAttribute("stroke-linecap","round");
  fg.setAttribute("stroke-dasharray",(C*pct/100).toFixed(1) + " " + C.toFixed(1));
  svg.appendChild(bg); svg.appendChild(fg);
  wrap.appendChild(svg);
  wrap.appendChild(el("div","pct", pct + "%"));
  return wrap;
}
function stat(iconPaths, text, cls){
  const s = el("div","stat" + (cls ? " " + cls : ""));
  if (iconPaths) s.appendChild(icon(iconPaths, 12));
  s.appendChild(el("span", null, text));
  return s;
}

/* ── card ────────────────────────────────────── */
function buildCard(s, colId){
  const host = HOSTS[s.host] || {label:s.host, init:(s.host||"??").slice(0,2).toUpperCase(), color:"#98a1b3"};
  const node = FLEET.nodes[s.host];
  const card = el("article","card");
  card.dataset.status = s.status;
  card.style.setProperty("--edge", EDGE[colId] || "#ccc");
  card.tabIndex = 0;
  card.setAttribute("role","button");
  card.setAttribute("aria-haspopup","dialog");

  // top row: avatar + project + host + chevron
  const top = el("div","card-top");
  const av = el("div","host-avatar", host.init);
  av.style.background = host.color;
  av.title = host.label;
  const tt = el("div","card-title");
  tt.appendChild(el("div","proj", s.project));
  const hl = el("div","host-line");
  const hd = el("span","hd");
  hd.style.background = (node && node.liveness === "dead") ? "#e5484d" : "#27ae60";
  hl.appendChild(hd);
  hl.appendChild(el("span", null, host.label + (node && node.liveness === "dead" ? " · host dead" : "")));
  tt.appendChild(hl);
  const chev = el("span","chev"); chev.appendChild(icon(I.chev, 16));
  top.appendChild(av); top.appendChild(tt); top.appendChild(chev);
  card.appendChild(top);

  // one-line "now"
  const now = el("p","now", s.summary.now);
  now.title = s.summary.now;
  card.appendChild(now);

  // tag chips
  const tags = el("div","tags");
  const b = el("span","tag", s.branch); b.title = s.branch; tags.appendChild(b);
  tags.appendChild(el("span","tag model", s.model));
  if (s.source) tags.appendChild(el("span","tag src", s.source));
  if (!s.worktreeOk) tags.appendChild(el("span","tag warn","worktree missing"));
  card.appendChild(tags);

  // numeric chips + context ring
  const stats = el("div","stats");
  stats.appendChild(ringNode(s.contextPct));
  const tok = stat(I.zap, fmtTokens(s.tokens)); tok.title = s.tokens.toLocaleString() + " tokens";
  stats.appendChild(tok);
  const cost = stat(null, fmtCost(s.cost)); cost.title = "Est. cost today";
  stats.appendChild(cost);
  const msgs = stat(I.msg, String(s.msgs)); msgs.title = s.msgs + " messages";
  stats.appendChild(msgs);
  stats.appendChild(stat(I.clock, s.lastActivity, "age"));
  card.appendChild(stats);

  // actions
  const actions = el("div","actions");
  const live = el("button","btn btn-live");
  live.type = "button";
  live.setAttribute("aria-label","Open live view for " + s.project);
  live.appendChild(el("span","live-dot"));
  live.appendChild(icon(I.eye, 14));
  live.appendChild(el("span", null, "Live"));
  actions.appendChild(live);

  const primary = makePrimary(s);
  actions.appendChild(primary);
  card.appendChild(actions);

  // interactions — card click/keyboard opens the expanded session dialog
  card.addEventListener("click", function(e){
    if (e.target.closest(".btn")) return;
    openDialog(s, colId);
  });
  card.addEventListener("keydown", function(e){
    if ((e.key === "Enter" || e.key === " ") && e.target === card){
      e.preventDefault(); openDialog(s, colId);
    }
  });
  live.addEventListener("click", function(e){ e.stopPropagation(); });
  primary.addEventListener("click", function(e){ e.stopPropagation(); });

  return card;
}

function makePrimary(s){
  const primary = el("button","btn btn-primary");
  primary.type = "button";
  if (!s.worktreeOk){
    primary.classList.add("repair");
    primary.appendChild(icon(I.wrench, 14));
    primary.appendChild(el("span", null, "Repair"));
    primary.appendChild(el("span","tier","worktree"));
    primary.setAttribute("aria-label","Repair worktree for " + s.project);
  } else {
    if (s.resumeTier === "revive") primary.classList.add("revive");
    primary.appendChild(icon(I.play, 13));
    primary.appendChild(el("span", null, s.resumeTier === "revive" ? "Revive" : "Resume"));
    primary.appendChild(el("span","tier", s.resumeTier));
    primary.setAttribute("aria-label", s.resumeTier + " session " + s.project);
  }
  return primary;
}

/* ── expanded session dialog ─────────────────── */
const overlay = document.getElementById("overlay");
const dlgEl = document.getElementById("dialog");
let dlgTimers = [];
function clearDlgTimers(){
  dlgTimers.forEach(function(t){ clearTimeout(t); clearInterval(t); });
  dlgTimers = [];
}
const STATUS_LABEL = {needs_you:"Needs You", working:"Working", waiting:"Waiting", stale:"Stale"};
const SPIN_CHARS = ["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"];
const SPIN_RE = /[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]/;

function lineClass(t){
  if (t.indexOf("⚠") !== -1) return "tline warn";
  if (t.indexOf("💤") !== -1 || t.indexOf("⏸") !== -1) return "tline dim";
  if (t.indexOf("streaming…") !== -1 || t.indexOf("working…") !== -1) return "tline spin";
  if (t.indexOf("│") !== -1) return "tline dim";
  return "tline";
}
function startSpin(lastEl){
  let i = 0;
  const base = lastEl.textContent;
  const m = base.match(SPIN_RE);
  if (m){
    dlgTimers.push(setInterval(function(){
      i = (i + 1) % SPIN_CHARS.length;
      lastEl.textContent = base.replace(m[0], SPIN_CHARS[i]);
    }, 110));
  } else {
    const c = el("div","tline spin","▋");
    lastEl.parentNode.appendChild(c);
    dlgTimers.push(setInterval(function(){
      c.style.visibility = c.style.visibility === "hidden" ? "" : "hidden";
    }, 500));
  }
}
function taskRow(t){
  const row = el("div","task " + t.status);
  const ic = el("span","tk-ic");
  if (t.status === "done"){
    ic.appendChild(icon(["M5 13l4 4L19 7"], 11));
  } else if (t.status === "in_progress"){
    ic.appendChild(el("i"));
  } else if (t.status === "blocked"){
    ic.appendChild(icon(["M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z","M12 9v4","M12 17h.01"], 14));
  }
  row.appendChild(ic);
  const body = el("div", null);
  body.appendChild(el("div","tk-title", t.title));
  if (t.status === "blocked") body.appendChild(el("div","tk-sub","blocked"));
  if (t.status === "in_progress") body.appendChild(el("div","tk-sub","in progress"));
  row.appendChild(body);
  return row;
}
function sumRow(k, v){
  const r = el("div","sumrow");
  r.appendChild(el("div","k", k));
  r.appendChild(el("div","v", v));
  return r;
}
function openDialog(s, colId){
  clearDlgTimers();
  const host = HOSTS[s.host] || {label:s.host, init:(s.host||"??").slice(0,2).toUpperCase(), color:"#98a1b3"};

  // header: project + branch/host chips + status pill + numeric chips
  const head = document.getElementById("dlgHead");
  head.textContent = "";
  const proj = el("div","dlg-proj");
  const av = el("div","host-avatar", host.init);
  av.style.background = host.color;
  proj.appendChild(av);
  proj.appendChild(el("h2", null, s.project));
  head.appendChild(proj);
  const chips = el("div","dlg-chips");
  const pill = el("span","status-pill", STATUS_LABEL[colId] || s.status);
  pill.style.background = EDGE[colId] || "#98a1b3";
  chips.appendChild(pill);
  const bch = el("span","tag", s.branch); bch.title = s.branch;
  chips.appendChild(bch);
  const hch = el("span","tag", host.label);
  hch.style.background = host.color + "22";
  hch.style.color = host.color;
  chips.appendChild(hch);
  chips.appendChild(el("span","tag model", s.model));
  head.appendChild(chips);
  const stats = el("div","dlg-stats");
  stats.appendChild(ringNode(s.contextPct));
  const tok = stat(I.zap, fmtTokens(s.tokens)); tok.title = s.tokens.toLocaleString() + " tokens";
  stats.appendChild(tok);
  stats.appendChild(stat(null, fmtCost(s.cost)));
  stats.appendChild(stat(I.msg, String(s.msgs)));
  stats.appendChild(stat(I.clock, "active " + s.elapsedActive + " · idle " + s.idle));
  head.appendChild(stats);
  const x = el("button","dlg-close");
  x.type = "button";
  x.setAttribute("aria-label","Close dialog");
  x.appendChild(icon(["M18 6 6 18","M6 6l12 12"], 18));
  x.addEventListener("click", closeDialog);
  head.appendChild(x);

  // terminal bar
  const bar = document.getElementById("termBar");
  bar.textContent = "";
  const dots = el("span","dots");
  ["#f0555f","#f0a92e","#27ae60"].forEach(function(c){
    const i2 = el("i"); i2.style.background = c; dots.appendChild(i2);
  });
  bar.appendChild(dots);
  bar.appendChild(el("span","tb-label", "terminal — " + host.label.toLowerCase() + " · " + s.branch));
  if (s.status === "working"){
    const lb = el("span","live-badge");
    lb.appendChild(el("span","live-dot"));
    lb.appendChild(el("span", null, "LIVE"));
    bar.appendChild(lb);
  } else if (s.stale){
    bar.appendChild(el("span","frozen-badge","frozen at last activity · " + s.lastActivity));
  } else {
    bar.appendChild(el("span","frozen-badge","paused · " + s.lastActivity));
  }

  // terminal body: stream when demo on + working, else render at once
  const scroll = document.getElementById("termScroll");
  scroll.textContent = "";
  const lines = s.terminal || [];
  function addLine(t){
    const d = el("div", lineClass(t), t);
    scroll.appendChild(d);
    scroll.scrollTop = scroll.scrollHeight;
    return d;
  }
  const demoOn = document.getElementById("demoToggle").checked;
  if (demoOn && s.status === "working" && lines.length){
    lines.forEach(function(t, i){
      dlgTimers.push(setTimeout(function(){
        const d = addLine(t);
        if (i === lines.length - 1) startSpin(d);
      }, 100 + 150 * i));
    });
  } else {
    lines.forEach(addLine);
    if (!lines.length) addLine("(no terminal capture for this session)");
    if (s.stale){
      const fz = el("div","tline frozen-note","frozen at last activity — " + s.lastActivity);
      scroll.appendChild(fz);
      scroll.scrollTop = scroll.scrollHeight;
    }
  }

  // tasks rail
  const rail = document.getElementById("dlgRail");
  rail.textContent = "";
  rail.appendChild(el("div","rail-h","Tasks"));
  (s.tasks || []).forEach(function(t){ rail.appendChild(taskRow(t)); });
  rail.appendChild(el("div","rail-h","AI Summary"));
  rail.appendChild(el("div","stamp","summary " + s.summaryAgeMin + "m old · last activity " + s.lastActivity));
  rail.appendChild(sumRow("Now", s.summary.now));
  rail.appendChild(sumRow("Next", s.summary.next));
  rail.appendChild(sumRow("Goal", s.summary.goal));
  if (s.note) rail.appendChild(el("div","rail-note", s.note));
  rail.appendChild(el("div","rail-h","Actions"));
  const acts = el("div","rail-actions");
  acts.appendChild(makePrimary(s));
  rail.appendChild(acts);

  // reset mobile tab to Terminal
  dlgEl.dataset.tab = "term";
  dlgEl.querySelectorAll(".dlg-tabs button").forEach(function(b){
    b.classList.toggle("active", b.dataset.tab === "term");
  });

  overlay.hidden = false;
  document.body.classList.add("dlg-open");
  x.focus();
}
function closeDialog(){
  clearDlgTimers();
  overlay.hidden = true;
  document.body.classList.remove("dlg-open");
}
overlay.addEventListener("click", function(e){
  if (e.target === overlay) closeDialog();
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && !overlay.hidden) closeDialog();
});
dlgEl.querySelectorAll(".dlg-tabs button").forEach(function(b){
  b.addEventListener("click", function(){
    dlgEl.querySelectorAll(".dlg-tabs button").forEach(function(y){ y.classList.remove("active"); });
    b.classList.add("active");
    dlgEl.dataset.tab = b.dataset.tab;
  });
});

/* ── board ───────────────────────────────────── */
function renderBoard(){
  const board = document.getElementById("board");
  board.textContent = "";
  COLS.forEach(function(c){
    const col = el("section","col");
    col.dataset.col = c.id;
    col.style.setProperty("--col-color", c.color);
    col.style.setProperty("--col-bg", c.bg);
    const head = el("div","col-head");
    head.appendChild(el("span","t", c.label));
    const items = FLEET.sessions.filter(c.match);
    head.appendChild(el("span","count", String(items.length)));
    col.appendChild(head);
    const cards = el("div","cards");
    if (items.length === 0){
      cards.appendChild(el("div","empty", c.empty));
    } else {
      items.forEach(function(s){ cards.appendChild(buildCard(s, c.id)); });
    }
    col.appendChild(cards);
    board.appendChild(col);
  });
}

/* ── fleet health strip ──────────────────────── */
function renderHealth(){
  const h = document.getElementById("health");
  h.textContent = "";
  Object.keys(FLEET.nodes).forEach(function(name){
    const n = FLEET.nodes[name];
    const chip = el("div","node-chip " + (n.liveness === "dead" ? "dead" : "fresh"));
    if (n.note) chip.title = n.note;
    chip.appendChild(el("span","dot"));
    chip.appendChild(el("span", null, name));
    chip.appendChild(el("span","sub", n.liveness === "dead" ? "DEAD" : n.liveness + " · " + n.sessions));
    h.appendChild(chip);
  });
  const t = FLEET.totals;
  const totals = el("div","totals");
  function piece(html, hot){
    const s = el("span", hot ? "hot" : null);
    s.textContent = html;
    return s;
  }
  function sep(){ return el("span","sep","·"); }
  const b1 = el("b", null, String(t.sessions)); totals.appendChild(b1);
  totals.appendChild(piece(" sessions")); totals.appendChild(sep());
  totals.appendChild(piece(t.needsYou + " need you", true)); totals.appendChild(sep());
  totals.appendChild(piece(fmtTokens(t.tokensToday) + " tok today")); totals.appendChild(sep());
  totals.appendChild(piece("$" + t.estCostToday.toFixed(2)));
  h.appendChild(totals);
}

/* ── mobile segmented filter ─────────────────── */
function renderSeg(){
  const seg = document.getElementById("seg");
  const board = document.getElementById("board");
  const opts = [{id:"all", label:"All", dot:"#7b68ee"}].concat(
    COLS.map(function(c){ return {id:c.id, label:c.label, dot:c.dot}; })
  );
  opts.forEach(function(o){
    const b = el("button", o.id === "all" ? "active" : "");
    b.type = "button";
    b.setAttribute("role","tab");
    const pin = el("span","pin"); pin.style.background = o.dot;
    b.appendChild(pin);
    b.appendChild(el("span", null, o.label));
    b.addEventListener("click", function(){
      seg.querySelectorAll("button").forEach(function(x){ x.classList.remove("active"); });
      b.classList.add("active");
      board.dataset.filter = o.id;
    });
    seg.appendChild(b);
  });
}

/* ── demo toggle ─────────────────────────────── */
document.getElementById("demoToggle").addEventListener("change", function(e){
  document.body.classList.toggle("demo-off", !e.target.checked);
});

/* decorative view tabs: visual active-state only */
document.querySelectorAll(".view-tabs button").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll(".view-tabs button").forEach(function(x){ x.classList.remove("active"); });
    b.classList.add("active");
  });
});

renderHealth();
renderSeg();
renderBoard();
</script>
</body>
</html>
