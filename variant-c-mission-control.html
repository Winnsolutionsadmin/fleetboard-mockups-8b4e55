<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Control — Fleet Session Kanban</title>
<style>
  :root{
    --bg:#0a0d13; --bg2:#0d1119; --panel:#111726; --panel2:#0d1220; --card:#131a2b;
    --line:#1e2739; --line2:#28344c;
    --text:#dce5f2; --dim:#8b9bb4; --faint:#5c6d86;
    --hot:#ff5d3b; --hot-soft:rgba(255,93,59,.14);
    --green:#3ecf8e; --blue:#5aa2ff; --amber:#f0b444; --cyan:#45d3cb; --red:#ff4d5e; --violet:#a78bfa;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    --r:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 700px at 80% -10%,#121a2e 0%,var(--bg) 55%);
    color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  svg{display:block}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

  /* ---------- app frame ---------- */
  #app{display:flex;flex-direction:column;height:100dvh}
  #main{display:grid;grid-template-columns:minmax(0,60fr) minmax(0,40fr);gap:0;flex:1;min-height:0}

  /* ---------- top bar ---------- */
  #topbar{
    display:flex;align-items:center;gap:14px;padding:10px 16px;
    border-bottom:1px solid var(--line);background:rgba(13,17,25,.9);
  }
  #topbar .brand{display:flex;align-items:center;gap:10px;min-width:0}
  #topbar .brand .logo{width:26px;height:26px;color:var(--hot)}
  #topbar h1{font-size:15px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
  #topbar h1 span{color:var(--faint);font-weight:500;letter-spacing:.02em}
  #topbar .spacer{flex:1}
  .tbtn{
    display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;
    border:1px solid var(--line2);border-radius:10px;color:var(--dim);background:var(--panel2);
    font-size:12.5px;white-space:nowrap;
  }
  .tbtn:hover{border-color:var(--blue);color:var(--text)}
  .tbtn kbd{
    font-family:var(--mono);font-size:11px;background:var(--line);border:1px solid var(--line2);
    border-radius:5px;padding:1px 6px;color:var(--text);
  }
  .tbtn .sw{width:30px;height:17px;border-radius:9px;background:var(--line);position:relative;transition:background .2s;flex:none}
  .tbtn .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
  .tbtn.on{border-color:var(--green);color:var(--text)}
  .tbtn.on .sw{background:rgba(62,207,142,.35)}
  .tbtn.on .sw::after{transform:translateX(13px);background:var(--green)}

  /* ---------- fleet strip ---------- */
  #strip{
    display:flex;align-items:stretch;gap:10px;padding:10px 16px;overflow-x:auto;
    border-bottom:1px solid var(--line);background:var(--bg2);scrollbar-width:none;
  }
  #strip::-webkit-scrollbar{display:none}
  .nodes{display:flex;gap:8px;align-items:center}
  .node{
    position:relative;display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px;
    border:1px solid var(--line2);border-radius:10px;background:var(--panel);white-space:nowrap;cursor:default;
  }
  .node .nname{font-weight:600;font-size:12.5px}
  .node .nmeta{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .node .nicon{width:16px;height:16px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.fresh{background:var(--green);box-shadow:0 0 6px rgba(62,207,142,.7)}
  .dot.dead{background:var(--red);animation:redpulse 1.1s ease-in-out infinite}
  @keyframes redpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,94,.55)}50%{box-shadow:0 0 0 6px rgba(255,77,94,0)}}
  .node.dead{border-color:rgba(255,77,94,.5)}
  .node.dead .nmeta{color:var(--red)}
  /* tooltip */
  [data-tip]{position:relative}
  [data-tip]::after{
    content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:0;z-index:60;
    width:260px;white-space:normal;padding:9px 11px;border-radius:9px;
    background:#1a2234;border:1px solid var(--line2);color:var(--text);
    font-size:11.5px;line-height:1.45;box-shadow:0 12px 30px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transform:translateY(-3px);transition:opacity .15s,transform .15s;
  }
  [data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translateY(0)}
  .tiles{display:flex;gap:8px;margin-left:auto}
  .tile{
    min-height:44px;min-width:96px;padding:5px 13px;border:1px solid var(--line2);border-radius:10px;
    background:var(--panel);display:flex;flex-direction:column;justify-content:center;white-space:nowrap;
  }
  .tile .tv{font-family:var(--mono);font-size:15px;font-weight:700}
  .tile .tl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  .tile.hot .tv{color:var(--hot)}

  /* ---------- board ---------- */
  #boardWrap{min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  #board{
    display:flex;gap:12px;padding:14px;overflow-x:auto;overflow-y:hidden;flex:1;min-height:0;
    scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
  }
  /* columns COMPRESS to fit the 60% board area beside the live pane;
     below 200px each they fall back to horizontal scroll — never hidden under the pane */
  .col{
    flex:1 1 246px;min-width:200px;max-width:360px;display:flex;flex-direction:column;min-height:0;
    background:var(--panel2);border:1px solid var(--line);border-radius:14px;
  }
  .col-head{padding:11px 13px 8px;border-bottom:1px solid var(--line)}
  .col-head .ct{display:flex;align-items:center;gap:8px}
  .col-head .ct .cic{width:15px;height:15px}
  .col-head h2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .col-head .cnt{
    margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;min-width:22px;height:20px;
    display:inline-flex;align-items:center;justify-content:center;border-radius:10px;
    background:var(--line);color:var(--dim);padding:0 7px;
  }
  .col-head .csub{font-size:10.5px;color:var(--faint);margin-top:3px}
  .col-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
  .col-empty{
    border:1px dashed var(--line2);border-radius:10px;padding:18px 12px;text-align:center;
    color:var(--faint);font-size:12px;
  }
  .col.needs{border-color:rgba(255,93,59,.45);box-shadow:0 0 0 1px rgba(255,93,59,.12),0 0 34px rgba(255,93,59,.07) inset}
  .col.needs .col-head h2{color:var(--hot)}
  .col.needs .cnt{background:var(--hot-soft);color:var(--hot)}
  .col.working .col-head h2{color:var(--green)}
  .col.waiting .col-head h2{color:var(--blue)}
  .col.stale .col-head h2{color:var(--faint)}
  .col.stale{opacity:.92}

  /* ---------- card ---------- */
  .card{
    display:grid;grid-template-columns:minmax(0,1fr) 44px;
    background:var(--card);border:1px solid var(--line2);border-radius:12px;overflow:hidden;
    transition:border-color .15s, box-shadow .15s;
  }
  .card:hover{border-color:#35507a}
  .card.arrive{animation:arrive .5s cubic-bezier(.2,.8,.3,1)}
  @keyframes arrive{0%{opacity:0;transform:translateY(-8px) scale(.98)}100%{opacity:1;transform:none}}
  .card.flash{animation:flash 1.2s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 2px var(--blue)}100%{box-shadow:0 0 0 2px transparent}}
  .col.needs .card{border-color:rgba(255,93,59,.4)}
  .col.needs .card:hover{border-color:var(--hot)}
  .col.stale .card{opacity:.68;filter:saturate(.72)}
  .col.stale .card:hover{opacity:.95;filter:none}
  .card-left{min-width:0;display:flex;flex-direction:column}
  .card-top{display:flex;align-items:center;gap:8px;padding:10px 10px 0 12px;min-width:0}
  .card-top .proj{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .hostchip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--dim);font-family:var(--mono);flex:none}
  .hostchip svg{width:13px;height:13px}
  .stico{margin-left:auto;flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:6px;position:relative}
  .stico svg{width:14px;height:14px}
  .stico.working{color:var(--green)}
  .stico.working::before{content:"";position:absolute;inset:0;border-radius:6px;border:1px solid rgba(62,207,142,.55);animation:workpulse 2.2s ease-in-out infinite}
  @keyframes workpulse{0%,100%{opacity:.15;transform:scale(.85)}50%{opacity:.8;transform:scale(1.06)}}
  .stico.needs_input{color:var(--hot);background:var(--hot-soft)}
  .stico.waiting{color:var(--blue)}
  .stico.stale{color:var(--faint)}

  .card-mid{padding:8px 10px 4px 12px;cursor:pointer;min-width:0}
  .sum-row{display:flex;gap:7px;min-width:0;padding:1.5px 0;align-items:baseline}
  .sum-l{flex:none;width:34px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--faint);text-transform:uppercase;font-family:var(--mono)}
  .sum-row.now .sum-l{color:var(--cyan)}
  .sum-t{font-size:12px;color:var(--text);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sum-row.next .sum-t,.sum-row.goal .sum-t{color:var(--dim)}
  .card.expanded .sum-t{white-space:normal;overflow:visible}
  .sum-hint{font-size:9.5px;color:var(--faint);margin-top:3px;display:flex;align-items:center;gap:5px}
  .sum-hint svg{width:10px;height:10px}
  .card-detail{display:none;margin-top:7px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:11px;color:var(--dim)}
  .card.expanded .card-detail{display:block}
  .card-detail .dn{color:var(--amber)}
  .card-detail .did{font-family:var(--mono);font-size:9.5px;color:var(--faint);word-break:break-all;margin-top:5px}

  .nums{display:flex;flex-wrap:wrap;gap:4px;padding:7px 10px 0 12px}
  .chip{
    display:inline-flex;align-items:center;gap:4px;padding:2.5px 7px;border-radius:6px;
    background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--dim);
    white-space:nowrap;
  }
  .chip svg{width:11px;height:11px;flex:none}
  .chip.ctx-hi{color:var(--amber);border-color:rgba(240,180,68,.4)}
  .chip.ctx-crit{color:var(--red);border-color:rgba(255,77,94,.45)}

  .actions{display:flex;align-items:center;gap:6px 8px;padding:9px 10px 0 12px;flex-wrap:wrap}
  .resume{display:flex;flex:none;position:relative}
  .rmain{
    display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 13px;
    border:1px solid var(--line2);border-radius:9px 0 0 9px;background:#1a2338;
    font-size:12px;font-weight:600;color:var(--text);
  }
  .rmain svg{width:13px;height:13px}
  .rmain:hover{border-color:var(--blue)}
  .rmain.repair{color:var(--amber);border-color:rgba(240,180,68,.5)}
  .rcaret{
    min-height:44px;width:34px;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--line2);border-left:none;border-radius:0 9px 9px 0;background:#161f33;color:var(--dim);
  }
  .rcaret svg{width:12px;height:12px}
  .rcaret:hover{color:var(--text);border-color:var(--blue)}
  /* tier hint wraps fully (no clamp/truncation); on narrow cards it wraps below the button */
  .tier{font-size:9.5px;color:var(--faint);line-height:1.35;min-width:0;flex:1 1 130px;white-space:normal}
  .tier b{color:var(--dim);font-weight:600}
  .rmenu{
    position:absolute;z-index:50;top:calc(100% + 6px);left:0;width:262px;
    background:#151d30;border:1px solid var(--line2);border-radius:11px;padding:5px;
    box-shadow:0 18px 42px rgba(0,0,0,.55);display:none;
  }
  .rmenu.open{display:block}
  .ritem{width:100%;text-align:left;display:flex;gap:9px;padding:9px 10px;border-radius:8px;min-height:44px;align-items:flex-start}
  .ritem:hover:not(.dis){background:#1d2740}
  .ritem svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--dim)}
  .ritem .rt{font-size:12.5px;font-weight:600}
  .ritem .rd{font-size:10.5px;color:var(--dim);margin-top:1px}
  .ritem .rdef{font-size:9px;font-family:var(--mono);color:var(--green);border:1px solid rgba(62,207,142,.4);border-radius:4px;padding:0 4px;margin-left:6px}
  .ritem.dis{opacity:.45;cursor:not-allowed}
  .ritem.dis .rd{color:var(--amber);opacity:.9}
  .ritem.rep .rt{color:var(--amber)}

  .card-foot{
    display:flex;align-items:center;gap:6px;padding:8px 10px 10px 12px;min-width:0;flex-wrap:wrap;
  }
  .fchip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;color:var(--faint);
    border:1px solid var(--line);border-radius:5px;padding:1.5px 6px;max-width:150px;overflow:hidden;white-space:nowrap}
  .fchip span{overflow:hidden;text-overflow:ellipsis}
  .fchip svg{width:10px;height:10px;flex:none}
  .fchip.model{color:var(--violet);border-color:rgba(167,139,250,.32)}
  .fchip.warn{color:var(--amber);border-color:rgba(240,180,68,.4)}
  .flast{margin-left:auto;font-size:9.5px;color:var(--faint);font-family:var(--mono);white-space:nowrap}

  .livezone{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    border-left:1px solid var(--line);background:linear-gradient(180deg,#141c30,#101627);
    color:var(--faint);min-height:44px;transition:background .15s,color .15s;
  }
  .livezone svg{width:15px;height:15px}
  .livezone .lz{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;font-weight:700;letter-spacing:.28em;font-family:var(--mono)}
  .livezone:hover,.livezone.pinned{background:linear-gradient(180deg,#173042,#122436);color:var(--cyan)}
  .livezone.pinned{border-left-color:rgba(69,211,203,.5)}

  /* ---------- live pane ---------- */
  #livePane{display:flex;flex-direction:column;min-width:0;min-height:0;background:#0a0f1a}
  #sheetHandle{display:none}
  #liveHead{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:0 10px;min-height:46px}
  #liveHead .lt{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
  #liveHead .lt svg{width:14px;height:14px;color:var(--cyan)}
  #tabs{display:flex;gap:5px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:5px 0}
  #tabs::-webkit-scrollbar{display:none}
  .tab{
    display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 6px 0 11px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel2);font-family:var(--mono);font-size:11px;color:var(--dim);
    white-space:nowrap;cursor:pointer;flex:none;
  }
  .tab.active{border-color:rgba(69,211,203,.5);color:var(--cyan);background:#0f1d27}
  .tab .tdot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
  .tab.streaming .tdot{background:var(--green);animation:redpulse 1.6s infinite}
  .tab .tx{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;color:var(--faint)}
  .tab .tx:hover{background:var(--line);color:var(--text)}
  .tab .tx svg{width:10px;height:10px}
  #term{
    flex:1;min-height:0;overflow-y:auto;padding:12px 14px 18px;font-family:var(--mono);font-size:11.5px;line-height:1.62;
    scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
  }
  #term .empty{color:var(--faint);padding:26px 8px;text-align:center;font-family:var(--sans);font-size:12.5px}
  .ln{display:flex;gap:10px;min-width:0;word-break:break-word}
  .ln .ts{flex:none;color:#3d4c63;font-size:10px;padding-top:1.5px;user-select:none}
  .ln .lc{min-width:0;white-space:pre-wrap}
  .ln.tool .lc{color:var(--cyan)}
  .ln.tool .lc b{color:#8fe8e2;font-weight:600}
  .ln.out .lc{color:var(--faint);padding-left:14px}
  .ln.asst .lc{color:var(--text)}
  .ln.sys .lc{color:#4a5a73;font-style:italic}
  .ln.warn .lc{color:var(--amber)}
  .ln.err .lc{color:var(--red)}
  .ln.ok .lc{color:var(--green)}
  .caret{display:inline-block;width:7px;height:13px;background:var(--cyan);vertical-align:-2px;animation:blink 1s steps(1) infinite;margin-left:2px}
  @keyframes blink{50%{opacity:0}}
  #liveMeta{border-top:1px solid var(--line);padding:7px 14px;font-family:var(--mono);font-size:10px;color:var(--faint);display:flex;gap:14px;flex-wrap:wrap}
  #liveMeta b{color:var(--dim);font-weight:600}

  /* ---------- command palette ---------- */
  #palWrap{position:fixed;inset:0;z-index:100;background:rgba(5,8,13,.66);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 0}
  #palWrap.open{display:flex}
  #pal{width:min(560px,100%);background:#131b2d;border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
  #palIn{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
  #palIn svg{width:16px;height:16px;color:var(--faint);flex:none}
  #palInput{flex:1;background:none;border:none;color:var(--text);font:inherit;font-size:14.5px;min-height:52px;outline:none}
  #palInput::placeholder{color:var(--faint)}
  #palList{max-height:min(390px,48vh);overflow-y:auto;padding:6px}
  .pitem{width:100%;display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:9px;text-align:left;min-height:48px}
  .pitem.sel{background:#1c2740}
  .pitem .pico{width:15px;height:15px;color:var(--dim);flex:none}
  .pitem .pmain{min-width:0;flex:1}
  .pitem .pp{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pitem .pp mark{background:none;color:var(--cyan)}
  .pitem .pb{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pitem .pst{flex:none;font-size:9.5px;font-family:var(--mono);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--dim)}
  .pitem .pst.needs_input{color:var(--hot);border-color:rgba(255,93,59,.5)}
  .pitem .pst.working{color:var(--green);border-color:rgba(62,207,142,.4)}
  .pnone{padding:20px;text-align:center;color:var(--faint);font-size:12.5px}
  #palFoot{border-top:1px solid var(--line);padding:8px 14px;font-size:10.5px;color:var(--faint);display:flex;gap:14px}
  #palFoot kbd{font-family:var(--mono);background:var(--line);border-radius:4px;padding:0 5px;color:var(--dim)}

  /* ---------- toast ---------- */
  #toasts{position:fixed;left:16px;bottom:16px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:min(420px,90vw)}
  .toast{
    background:#17203a;border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:10px;
    padding:10px 14px;font-size:12px;color:var(--dim);box-shadow:0 14px 34px rgba(0,0,0,.5);
    animation:arrive .3s ease-out;
  }
  .toast code{font-family:var(--mono);color:var(--cyan);font-size:11px}
  .toast.warn{border-left-color:var(--amber)}

  /* ---------- phone ---------- */
  @media (max-width:920px){
    body{overflow:auto}
    #app{height:auto;min-height:100vh;min-height:100dvh}
    #main{display:block}
    #topbar{flex-wrap:wrap;gap:8px;padding:10px 12px}
    #topbar h1 span{display:none}
    .tiles{margin-left:0}
    #boardWrap{border-right:none}
    #board{flex-direction:column;overflow:visible;padding:12px 12px 120px} /* clearance for the collapsed sheet — nothing permanently hidden */
    .col{max-width:none;min-width:0;flex:none}
    .col-body{overflow:visible}

       ${tile(fmtTok(t.tokensToday),"tokens today",false,"tokensToday")}
       ${tile(fmtCost(t.estCostToday),"est cost today",false,"estCostToday")}
     </div>`;
}

============================================================ */
const COLS=[
 {id:"needs", name:"Needs You", icon:"alert", sub:"turn ended with a question — answer to unblock"},
 {id:"working", name:"Working", icon:"play", sub:"agent mid-turn · auto-moves on turn end"},
 {id:"waiting", name:"Waiting", icon:"pause", sub:"idle, resumable · auto-decays to Stale at 2h"},
 {id:"stale", name:"Stale", icon:"moon", sub:"no activity &gt; 2h · auto-transitioned, not dragged"},
];

function chipCls(s){ return s.contextPct>=85?"ctx-crit":s.contextPct>=70?"ctx-hi":""; }

function resumeMeta(s){
  // returns {main:{label,icon,action,cls}, items:[{key,label,desc,icon,enabled,reason,def}], tierNote}
  const host=s.host;
  const items=[
    {key:"attach", label:"Attach (tmux)", icon:"plug",
     desc:"Full fidelity — join the live process; nothing lost."},
    {key:"resume", label:"Resume (claude --resume)", icon:"refresh",
     desc:"Restores the conversation; env flags are NOT restored."},
    {key:"revive", label:"Revive (distill + fork)", icon:"fork",
     desc:"Distills the transcript, forks fresh on branch HEAD. Majority of context, not all."},
  ];
  for(const it of items){
    it.def = it.key===s.resumeTier;
    if(!s.worktreeOk){
      it.enabled=false;
      it.reason="worktree pruned Aug 18 — repair re-creates it from the branch first";
      continue;
    }
    if(it.key==="attach"){
      it.enabled = s.resumeTier==="attach";
      if(!it.enabled) it.reason="no live process on "+host+" — nothing to attach to";
    }else if(it.key==="resume"){
      it.enabled = s.resumeTier!=="revive";
      if(!it.enabled) it.reason="context "+s.contextPct+"% — will hit 'Prompt is too long'";
    }else{ // revive
      it.enabled = s.resumeTier==="revive";
      if(!it.enabled) it.reason="not needed — context "+s.contextPct+"% is resumable at higher fidelity";
    }
  }
  let main, tierNote;
  if(!s.worktreeOk){
    main={label:"Repair worktree", icon:"wrench", action:"repair", cls:"repair"};
    tierNote="<b>blocked:</b> worktree missing — repair re-creates it from the branch, then resume";
  }else if(s.resumeTier==="attach"){
    main={label:"Attach", icon:"plug", action:"attach"};
    tierNote="<b>attach:</b> process alive on "+esc(host)+" — full-fidelity tmux attach";
  }else if(s.resumeTier==="resume"){
    main={label:"Resume", icon:"refresh", action:"resume"};
    tierNote="<b>resume:</b> conversation restores; env flags do NOT";
  }else{
    main={label:"Revive", icon:"fork", action:"revive"};
    tierNote="<b>revive:</b> context "+s.contextPct+"% — resume would fail; distill + fork";
  }
  return {main, items, tierNote};
}

function renderBoard(movedId){
  const cols={needs:[],working:[],waiting:[],stale:[]};
  for(const s of FLEET.sessions) cols[colOf(s)].push(s);
  $("#board").innerHTML=COLS.map(c=>`
    <section class="col ${c.id}" data-col="${c.id}">
      <div class="col-head">
        <div class="ct">${ic(c.icon,"cic")}<h2>${c.name}</h2><span class="cnt">${cols[c.id].length}</span></div>
        <div class="csub">${c.sub}</div>
      </div>
      <div class="col-body">
        ${cols[c.id].length?cols[c.id].map(cardHTML).join(""):'<div class="col-empty">No sessions here right now.<br>Columns auto-transition — nothing is dragged.</div>'}
      </div>
    </section>`).join("");
  if(movedId){
    const el=$(`.card[data-id="${movedId}"]`);
    if(el) el.classList.add("arrive");
  }
  wireBoard();
}

function wireBoard(){
  $$(".card").forEach(card=>{
    const id=card.dataset.id, s=byId(id);
    // expand
    const mid=$(".card-mid",card);
    const tgl=()=>{state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);
      card.classList.toggle("expanded");mid.setAttribute("aria-expanded",card.classList.contains("expanded"));};
    mid.addEventListener("click",tgl);
    mid.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tgl();}});
    // live zone
    $("[data-live]",card).addEventListener("click",e=>{e.stopPropagation();pinLive(id);});
    // resume main + menu
    $(".rmain",card).addEventListener("click",e=>{e.stopPropagation();doResume(s,$(".rmain",card).dataset.act);});
    $(".rcaret",card).addEventListener("click",e=>{
      e.stopPropagation();
      const menu=$(".rmenu",card);
      const was=menu.classList.contains("open");
      closeMenus();
      if(!was){menu.classList.add("open");state.openMenu=menu;}
    });
    $$(".ritem",card).forEach(it=>it.addEventListener("click",e=>{
      e.stopPropagation();
      if(it.classList.contains("dis")){toast("Unavailable — "+$(".rd",it).textContent,"warn");return;}
      closeMenus();doResume(s,it.dataset.act);
    }));
  });
}
function closeMenus(){ $$(".rmenu.open").forEach(m=>m.classList.remove("open")); state.openMenu=null; }
document.addEventListener("click",()=>closeMenus());

function doResume(s,act){
  const cmds={
    attach:["Attach","<code>ssh "+s.host+" tmux attach -t "+s.project+"-"+s.branch.split("/").pop()+"</code> — full fidelity, live process"],
    resume:["Resume","<code>claude --resume "+s.session_id.slice(0,8)+"…</code> — conversation restores; env flags NOT restored"],
    revive:["Revive","distill transcript → fork fresh session on <code>"+esc(s.branch)+"</code> HEAD — majority of context preserved"],
    repair:["Repair","<code>git worktree add ~/.omnara/worktrees/… "+esc(s.branch)+"</code> — then resume unlocks"],
  };
  const c=cmds[act]||cmds.resume;
  toast("<b>"+c[0]+"</b> (mockup — no command run): "+c[1]);
}

/* ============================================================
   live pane
============================================================ */
function ensureBuffer(id){
  if(state.buffers[id]) return;
  state.buffers[id]=[];state.ptr[id]=0;state.clock[id]=new Date("2026-08-26T02:30:00");
  const sc=STREAMS[id];
  // prefill: dead/asking sessions show the whole tail at once; live ones show a few lines then stream
  const pre=sc.live?Math.min(4,sc.lines.length):sc.lines.length;
  for(let i=0;i<pre;i++) pushLine(id,false);
}
function nextLine(id){
  const sc=STREAMS[id];
  const i=state.ptr[id];
  if(sc.live){ return sc.lines[i%sc.lines.length]; }
  return i<sc.lines.length?sc.lines[i]:null;
}
function pushLine(id,scroll=true){
  const l=nextLine(id); if(!l) return false;
  state.ptr[id]++;
  const c=state.clock[id]; c.setSeconds(c.getSeconds()+2+Math.floor(Math.random()*8));
  const ts=c.toTimeString().slice(0,8);
  let html;
  if(l[0]==="tool"&&Array.isArray(l[1])) html="⏺ <b>"+esc(l[1][0])+"</b>("+esc(l[1][1])+")";
  else html=esc(l[1]);
  state.buffers[id].push({k:l[0],ts,html});
  if(state.buffers[id].length>200) state.buffers[id].shift();
  if(scroll&&state.active===id) renderTerm(true);
  return true;
}
function pinLive(id){
  ensureBuffer(id);
  if(!state.pinned.includes(id)){
    state.pinned.push(id);
    if(state.pinned.length>5){const drop=state.pinned.shift(); if(drop===state.active) state.active=null;}
  }
  state.active=id;
  renderTabs();renderTerm(true);renderBoardPins();
  if(matchMedia("(max-width:920px)").matches){state.sheetOpen=true;$("#livePane").classList.add("open");}
}
function unpin(id){
  state.pinned=state.pinned.filter(x=>x!==id);
  if(state.active===id) state.active=state.pinned[state.pinned.length-1]||null;
  renderTabs();renderTerm(true);renderBoardPins();
}
function renderBoardPins(){
  $$(".livezone").forEach(z=>{
    const id=z.closest(".card").dataset.id;
    z.classList.toggle("pinned",state.pinned.includes(id));
  });
}
function renderTabs(){
  $("#tabs").innerHTML=state.pinned.map(id=>{
    const s=byId(id), sc=STREAMS[id];
    return `<button class="tab ${state.active===id?"active":""} ${sc.live?"streaming":""}" data-tab="${id}" role="tab" aria-selected="${state.active===id}">
      <span class="tdot"></span>${esc(shortName(s))}
      <span class="tx" data-close aria-label="Unpin">${ic("x")}</span>
    </button>`;
  }).join("");
  $$("#tabs .tab").forEach(t=>{
    t.addEventListener("click",e=>{
      if(e.target.closest("[data-close]")){unpin(t.dataset.tab);return;}
      state.active=t.dataset.tab;renderTabs();renderTerm(true);
    });
  });
  const a=state.active?byId(state.active):null;
  $("#sheetTitle").textContent=a?("Live — "+a.project):"Live";
}
function renderTerm(scroll){
  const term=$("#term");
  if(!state.active){
    term.innerHTML=`<div class="empty">No session pinned.<br>Tap a card's <b>LIVE</b> edge to pin its transcript stream here — up to 5 tabs.</div>`;
    $("#liveMeta").innerHTML="";
    return;
  }
  const id=state.active, s=byId(id), sc=STREAMS[id];
  const near=term.scrollHeight-term.scrollTop-term.clientHeight<80;
  term.innerHTML=state.buffers[id].map(l=>
    `<div class="ln ${l.k}"><span class="ts">${l.ts}</span><span class="lc">${l.html}</span></div>`).join("")
    +(sc.live||sc.ask?`<div class="ln sys"><span class="ts"></span><span class="lc">${sc.live?"streaming":"awaiting your input"}<span class="caret"></span></span></div>`:"");
  if(scroll||near) term.scrollTop=term.scrollHeight;
  $("#liveMeta").innerHTML=
    `<span><b>${esc(s.project)}</b> · ${esc(s.branch)}</span><span>${esc(s.host)} · ${esc(s.model)}</span>`+
    `<span>ctx ${s.contextPct}% · ${fmtTok(s.tokens)} tok</span>`+
    `<span>${sc.live?"live stream (simulated)":"static tail — session idle"}</span>`;
}
/* stream ticker */
setInterval(()=>{
  for(const id of state.pinned){
    const sc=STREAMS[id];
    if(sc.live && Math.random()<0.75) pushLine(id, id===state.active);
  }
},1500);

/* ============================================================
   command palette (fuzzy)
============================================================ */
function fuzzy(q,hay){
  q=q.toLowerCase();hay=hay.toLowerCase();
  let qi=0,score=0,streak=0;
  for(let i=0;i<hay.length&&qi<q.length;i++){
    if(hay[i]===q[qi]){qi++;streak++;score+=1+streak*2;if(i===0||/[\s\-\/·]/.test(hay[i-1]))score+=6;}
    else streak=0;
  }
  return qi===q.length?score:-1;
}
function palRender(){
  const q=$("#palInput").value.trim();
  let items=FLEET.sessions.map(s=>{
    const hay=[s.project,s.branch,s.host,s.model,s.status,s.summary.now].join(" ");
    return {s,score:q?fuzzy(q,hay):1};
  }).filter(x=>x.score>=0);
  items.sort((a,b)=>b.score-a.score);
  state.palItems=items;
  state.palSel=Math.min(state.palSel,Math.max(0,items.length-1));
  $("#palList").innerHTML=items.length?items.map((x,i)=>{
    const s=x.s, col=colOf(s);
    return `<button class="pitem ${i===state.palSel?"sel":""}" data-i="${i}">
      ${ic(HOSTIC[s.host],"pico")}
      <span class="pmain"><span class="pp">${esc(s.project)}</span>
      <span class="pb">${esc(s.branch)} · ${esc(s.host)} · ${esc(s.summary.now.slice(0,54))}…</span></span>
      <span class="pst ${esc(s.status)}">${col==="stale"?"stale":esc(s.status.replace("_"," "))}</span>
    </button>`;
  }).join(""):'<div class="pnone">No session matches — try fewer letters.</div>';
  $$("#palList .pitem").forEach(b=>b.addEventListener("click",()=>palGo(+b.dataset.i)));
}
function palOpen(){
  state.palOpen=true;state.palSel=0;
  $("#palWrap").classList.add("open");
  $("#palInput").value="";palRender();
  setTimeout(()=>$("#palInput").focus(),20);
}
function palClose(){state.palOpen=false;$("#palWrap").classList.remove("open");}
function palGo(i){
  const it=state.palItems[i];if(!it)return;
  palClose();
  pinLive(it.s.session_id);
  const el=$(`.card[data-id="${it.s.session_id}"]`);
  if(el){el.scrollIntoView({behavior:"smooth",block:"center",inline:"center"});
    el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}
}
$("#palBtn").addEventListener("click",palOpen);
$("#palWrap").addEventListener("click",e=>{if(e.target.id==="palWrap")palClose();});
$("#palInput").addEventListener("input",()=>{state.palSel=0;palRender();});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();state.palOpen?palClose():palOpen();return;}
  if(!state.palOpen)return;
  if(e.key==="Escape")palClose();
  else if(e.key==="ArrowDown"){e.preventDefault();state.palSel=Math.min(state.palSel+1,state.palItems.length-1);palRender();}
  else if(e.key==="ArrowUp"){e.preventDefault();state.palSel=Math.max(state.palSel-1,0);palRender();}
  else if(e.key==="Enter"){e.preventDefault();palGo(state.palSel);}
});

/* ============================================================
   demo mode
============================================================ */
let demoTimer=null,demoTick=0;
$("#demoBtn").addEventListener("click",()=>{
  state.demo=!state.demo;
  $("#demoBtn").classList.toggle("on",state.demo);
  $("#demoBtn").setAttribute("aria-pressed",state.demo);
  if(state.demo){demoTimer=setInterval(demoStep,2000);toast("Demo mode <b>on</b> — numbers tick, statuses occasionally flip (simulated).");}
  else{clearInterval(demoTimer);toast("Demo mode off.");}
});
function demoStep(){
  demoTick++;
  // tick numerics on working sessions
  for(const s of FLEET.sessions){
    if(s.status!=="working"||s.stale)continue;
    const dt=800+Math.floor(Math.random()*4200);
    s.tokens+=dt;s.cost+=dt*4.7e-6;
    FLEET.totals.tokensToday+=dt;FLEET.totals.estCostToday+=dt*4.7e-6;
    if(Math.random()<0.3)s.msgs++;
    if(Math.random()<0.12)s.contextPct=Math.min(99,s.contextPct+1);
    const card=$(`.card[data-id="${s.session_id}"]`);
    if(card){
      $('[data-f="tok"]',card).textContent=fmtTok(s.tokens);
      $('[data-f="cost"]',card).textContent=fmtCost(s.cost);
      $('[data-f="msgs"]',card).textContent=s.msgs;
      $('[data-f="ctx"]',card).textContent=s.contextPct+"%";
    }
  }
  $('[data-tile="tokensToday"]').textContent=fmtTok(FLEET.totals.tokensToday);
  $('[data-tile="estCostToday"]').textContent=fmtCost(FLEET.totals.estCostToday);
  // occasionally flip a status (auto-transition demo)
  if(demoTick%5===0){
    const sage=byId("ccd6b7c8-6666-4fff-8aaa-000000000006");
    if(sage.status==="working"){sage.status="waiting";sage.idle="2m";sage.lastActivity="2m ago";}
    else{sage.status="working";sage.idle="0m";sage.lastActivity="just now";}
    FLEET.totals.needsYou=FLEET.sessions.filter(x=>x.status==="needs_input"&&!x.stale).length;
    $('[data-tile="needsYou"]').textContent=FLEET.totals.needsYou;
    renderBoard(sage.session_id);renderBoardPins();
    toast("<b>"+esc(sage.project)+"</b> auto-moved to "+(sage.status==="working"?"Working":"Waiting")+" (turn "+(sage.status==="working"?"started":"ended")+").");
  }
}
