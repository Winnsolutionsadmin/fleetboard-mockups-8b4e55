<!-- variant: g-terminal · thesis: the list stays a quiet iOS document while the session detail is a real terminal you are standing at, so approving is the same gesture as typing y at a prompt. · signature: the dark tmux pane — transcript colored by the fleet's own tag palette, a live tmux status bar built from model/ctx/cost, and the gate rendered as the prompt line with A/E/D keycaps above the keyboard. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>FleetBoard — Terminal</title>
<style>
:root{
  --ground:#f2f2f7; --paper:#fff; --ink:#101319; --soft:#6b7280; --faint:#a1a6b0;
  --line:#e4e4ea; --line-2:#eef0f4;
  --GM:#1f9e6b; --Ws:#4b5ee8; --P:#d97706;
  --p0:#dc2626; --p1:#ea580c; --p2:#2563eb; --p3:#6b7280;
  --mactop:#6a2bc4; --mini:#9e2790; --macbook:#b32d63;
  --term:#131a23; --term2:#1b2531; --term3:#26313f;
  --tink:#e9edf2; --tdim:#8796a9;
  --tgm:#4fd6a0; --tp0:#ff7b72; --tacc:#b39dfb; --tblue:#7cc4ff;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
  background:var(--ground); color:var(--ink);
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.4;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid #0a84ff;outline-offset:2px;border-radius:8px}
.screen{display:flex;flex-direction:column;height:100dvh;max-height:100dvh}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.pt{padding-top:var(--sat)}

/* ── light chrome header ─────────────────────────── */
.nav{
  background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
  padding-top:var(--sat);flex:none;
}
.nav-row{display:flex;align-items:center;gap:10px;padding:6px 14px;min-height:50px}
.mark{
  width:28px;height:28px;border-radius:7px;flex:none;background:var(--term);
  color:var(--tgm);font:600 12px/28px var(--mono);text-align:center;letter-spacing:-.5px;
}
.nav h1{font-size:17px;font-weight:700;letter-spacing:-.4px;white-space:nowrap}
.grow{flex:1;min-width:0}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;flex:none}
.iconbtn:active{background:var(--line-2)}
.back{display:flex;align-items:center;gap:2px;min-height:44px;padding-right:6px;color:#0a84ff;font-size:16px;font-weight:500}

/* ── machine picker ──────────────────────────────── */
.machines{display:flex;gap:5px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
.machines::-webkit-scrollbar{display:none}
.mchip{
  display:flex;align-items:center;gap:6px;flex:none;height:34px;padding:0 10px;
  border-radius:9px;background:#eceef3;font-size:13px;font-weight:600;color:#4b5160;
  white-space:nowrap;
}
.mchip[aria-pressed="true"]{background:var(--ink);color:#fff}
.mchip .dot{width:7px;height:7px;border-radius:4px;background:currentColor;opacity:.85}
.mchip .n{font:600 12px var(--mono);opacity:.62}
.mchip.off{opacity:.55}

/* ── search + sort ───────────────────────────────── */
.pad{padding:0 14px}
.search{
  display:flex;align-items:center;gap:8px;height:38px;padding:0 11px;margin:2px 0 14px;
  background:#e9e9ee;border-radius:10px;color:#8a8f99;
}
.search input{border:0;background:none;outline:none;width:100%;font-size:16px}
.sechead{display:flex;align-items:baseline;gap:8px;padding:0 4px 8px}
.sechead h2{font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--soft)}
.sort{margin-left:auto;font-size:13.5px;font-weight:600;color:#0a84ff;min-height:36px;display:flex;align-items:center;gap:3px}

/* ── the list card ───────────────────────────────── */
.card{background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(16,19,25,.06)}
.row{display:flex;gap:11px;padding:12px 13px;position:relative;width:100%;text-align:left;align-items:flex-start}
.row+.row{border-top:1px solid var(--line-2)}
.row:active{background:#f7f7fa}
.row.hot{background:#fff6f5}
.row.hot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px;background:var(--p0)}
.rbody{flex:1;min-width:0}
.rtitle{font-size:17px;font-weight:600;letter-spacing:-.35px;line-height:1.25;overflow-wrap:anywhere}
.rmeta{font:12.5px/1.35 var(--mono);color:var(--soft);margin-top:3px;overflow-wrap:anywhere}
.rmeta .sl{color:#c3c7d0}
.rtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center}
.rright{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:2px;min-width:42px}
.age{font:12.5px var(--mono);color:var(--faint)}
.unread{width:9px;height:9px;border-radius:5px;background:#0a84ff}

/* ── tags: text carries meaning, color reinforces ── */
.tag{
  display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;border-radius:5px;
  font:600 11.5px/1 var(--mono);letter-spacing:.2px;white-space:nowrap;
}
.tag.org{background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 26%,#fff)}
.tag.org b{width:6px;height:6px;border-radius:2px;background:var(--c)}
.tag.pri{background:var(--c);color:#fff}
.tag.pri.lo{background:#fff;color:var(--c);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 40%,#fff)}
.tag.host{background:#f4f4f7;color:#5c6270;box-shadow:inset 0 0 0 1px #e6e7ec}
.tag.host b{width:6px;height:6px;border-radius:3px;background:var(--c)}
.tag.needs{background:var(--p0);color:#fff;letter-spacing:.6px}
.tag.st{background:#f1f2f5;color:#6b7280}
.dots{display:inline-flex;gap:2.5px;align-items:center;height:19px}
.dots i{width:4px;height:4px;border-radius:2px;background:#a6acb8;animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.65}}

/* ── pinned ──────────────────────────────────────── */
.pin{background:var(--paper);border-radius:14px;padding:12px 13px;display:flex;gap:11px;box-shadow:0 1px 2px rgba(16,19,25,.06);align-items:flex-start;width:100%;text-align:left;margin-bottom:14px}
.pinlabel{display:flex;align-items:center;gap:5px;padding:0 4px 7px;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--soft)}

/* ── floating new pill ───────────────────────────── */
.fab{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--sab));z-index:40;
  display:flex;align-items:center;gap:8px;height:50px;padding:0 22px;border-radius:25px;
  background:var(--ink);color:#fff;font-size:16px;font-weight:600;
  box-shadow:0 6px 20px rgba(16,19,25,.28);
}
.fab:active{transform:translateX(-50%) scale(.97)}

/* ══ THE PANE — the only dark surface in the app ═══ */
.dhead{padding:0 14px 9px}
.dtitle{font-size:19px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.dtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center}
.pane{
  flex:1;min-height:0;margin:0 10px;border-radius:13px;background:var(--term);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 2px 14px rgba(11,16,22,.24);
}
.tbar{
  display:flex;align-items:center;gap:7px;padding:8px 11px;flex:none;
  background:var(--term2);border-bottom:1px solid #0d1219;
}
.tbar .tl{display:flex;gap:5px}
.tbar .tl i{width:9px;height:9px;border-radius:5px;background:#3a4655}
.tbar .path{font:11.5px var(--mono);color:var(--tdim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buf{flex:1;min-height:0;overflow-y:auto;padding:11px 11px 14px;font:12.5px/1.62 var(--mono);color:var(--tink);overscroll-behavior:contain}
.ln{display:flex;gap:7px;margin-bottom:9px;overflow-wrap:anywhere}
.ln .g{flex:none;width:11px;text-align:center;font-weight:700}
.ln .t{flex:1;min-width:0;overflow-wrap:anywhere}
.ln.usr .g{color:var(--tgm)} .ln.usr .t{color:#fff}
.ln.ast .g{color:var(--tacc)} .ln.ast .t{color:var(--tink)}
.ln.tool{color:var(--tdim);margin-bottom:6px}
.ln.tool .g{color:#5d6b7d}
.ln.tool .nm{color:var(--tblue)}
.ln.sys{color:#5d6b7d;margin:2px 0 10px}
.gate{margin-top:12px;padding-top:11px;border-top:1px dashed #303c4b}
.gate .q{display:flex;gap:7px}
.gate .q .g{color:var(--tp0);font-weight:700;flex:none;width:11px;text-align:center}
.gate .q .t{color:#fff;font-weight:600}
.cur{display:inline-block;width:7px;height:14px;background:var(--tp0);vertical-align:-2px;margin-left:4px;animation:cb 1.05s steps(1) infinite}
@keyframes cb{0%,49%{opacity:1}50%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
.status{
  flex:none;display:flex;align-items:center;gap:0;background:var(--term3);
  font:11px/1 var(--mono);color:#b6c2d1;height:24px;overflow:hidden;
}
.status .seg{padding:0 8px;height:24px;display:flex;align-items:center;white-space:nowrap}
.status .s0{background:var(--tgm);color:#0d1218;font-weight:700}
.status .s1{background:#33404f;color:#fff;font-weight:600}
.status .sp{flex:1;min-width:0}
.status .sr{color:#93a2b4;padding-right:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── keycaps: the gate answered like a key press ─── */
.keys{flex:none;display:flex;gap:8px;padding:11px 10px 8px}
.key{
  flex:1;min-height:52px;border-radius:11px;background:#fff;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 2px 0 var(--kd,#d7dae1),inset 0 0 0 1px var(--kb,#e2e4ea);
  font-size:15px;font-weight:650;letter-spacing:-.2px;color:var(--kc,var(--ink));
}
.key:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px var(--kb,#e2e4ea)}
.key .cap{font:700 10.5px var(--mono);opacity:.72;letter-spacing:.6px}
.key.ok{--kb:#1f9e6b;--kd:#15805a;--kc:#fff;background:var(--GM)}
.key.no{--kb:#dc2626;--kd:#b01c1c;--kc:#dc2626;background:#fff5f4}
.composer{flex:none;display:flex;gap:8px;align-items:flex-end;padding:4px 10px calc(10px + var(--sab));}
.composer .field{
  flex:1;min-height:44px;display:flex;align-items:center;padding:0 13px;border-radius:22px;
  background:#fff;box-shadow:inset 0 0 0 1px var(--line);font:13px var(--mono);color:#9aa0ab;
}
.send{width:44px;height:44px;border-radius:22px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}

/* ── overflow sheet ──────────────────────────────── */
.veil{position:fixed;inset:0;background:rgba(16,19,25,.32);z-index:60}
.sheet{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--sab));z-index:61;background:var(--paper);border-radius:15px;overflow:hidden;box-shadow:0 12px 40px rgba(16,19,25,.3)}
.sheet .st{padding:11px 14px;font-size:12.5px;color:var(--soft);border-bottom:1px solid var(--line-2);text-align:center}
.sheet button{display:flex;align-items:center;gap:11px;width:100%;min-height:52px;padding:0 16px;font-size:16.5px;text-align:left}
.sheet button+button{border-top:1px solid var(--line-2)}
.sheet button.danger{color:#dc2626}
.sheet .cancel{margin-top:8px;font-weight:650;justify-content:center;border-radius:15px;background:var(--paper);border-top:0}

/* ── new session + org ───────────────────────────── */
.fgroup{background:var(--paper);border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,19,25,.06)}
.flabel{padding:0 4px 7px;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--soft)}
.frow{display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 13px}
.frow+.frow{border-top:1px solid var(--line-2)}
.frow .k{font-size:15px;color:var(--soft);flex:none;width:74px}
.frow input,.frow textarea{flex:1;min-width:0;border:0;background:none;outline:none;font:13.5px var(--mono);color:var(--ink)}
.frow textarea{resize:none;min-height:76px;padding:9px 0;line-height:1.55}
.hosts{display:flex;gap:8px;padding:11px 13px}
.hostbtn{
  flex:1;min-height:66px;border-radius:11px;background:#f4f4f7;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;box-shadow:inset 0 0 0 1px #e6e7ec;
}
.hostbtn[aria-pressed="true"]{background:#fff;box-shadow:inset 0 0 0 2px var(--c);}
.hostbtn .hn{font-size:15px;font-weight:650}
.hostbtn .hs{font:10.5px var(--mono);color:var(--soft);text-align:center;padding:0 4px;line-height:1.25}
.hostbtn.dis{opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:11px 13px}
.chip{min-height:38px;padding:0 13px;border-radius:9px;background:#f4f4f7;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px #e6e7ec}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.primary{width:100%;min-height:52px;border-radius:13px;background:var(--ink);color:#fff;font-size:17px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px}
.hint{font:12px/1.45 var(--mono);color:var(--soft);padding:2px 4px 16px}

.task{background:var(--paper);border-radius:14px;margin-bottom:11px;overflow:hidden;box-shadow:0 1px 2px rgba(16,19,25,.06)}
.thead{display:flex;gap:10px;padding:12px 13px;width:100%;text-align:left;align-items:flex-start}
.tname{font-size:16px;font-weight:600;letter-spacing:-.3px;line-height:1.3}
.tmeta{font:11.5px var(--mono);color:var(--soft);margin-top:5px}
.sub{border-top:1px solid var(--line-2);padding:9px 13px 9px 15px;display:flex;gap:9px;align-items:center;font-size:14.5px}
.sub.hot{background:#fff6f5}
.sbox{width:17px;height:17px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1.5px #c9cdd6;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.sbox.done{background:var(--GM);box-shadow:none}
.sbox.hot{background:var(--p0);box-shadow:none}
.sstat{margin-left:auto;font:10.5px var(--mono);color:var(--soft);letter-spacing:.3px;text-transform:uppercase;flex:none}
.slink{display:flex;gap:8px;align-items:center;padding:10px 13px;border-top:1px solid var(--line-2);width:100%;text-align:left;background:#fbfbfd}
.slink .sn{font-size:14.5px;font-weight:550;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<script src="./data.js"></script>
<script>
(function(){
const F = window.FLEET, app = document.getElementById('app');
const E = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const org = id => F.orgs.find(o=>o.id===id) || {id:id,label:id,color:'#888'};
const pri = id => F.priorities.find(p=>p.id===id) || {id:id,label:id,color:'#888'};
const host = id => F.hosts.find(h=>h.id===id) || {id:id,label:id,color:'#888'};
const sess = id => F.sessions.find(s=>s.id===id);
const ico = {
  back:'<svg width="12" height="20" viewBox="0 0 12 20" fill="none" aria-hidden="true"><path d="M10 1 2 10l8 9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  more:'<svg width="21" height="21" viewBox="0 0 21 21" aria-hidden="true"><circle cx="10.5" cy="10.5" r="9.2" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".45"/><circle cx="6.4" cy="10.5" r="1.4" fill="currentColor"/><circle cx="10.5" cy="10.5" r="1.4" fill="currentColor"/><circle cx="14.6" cy="10.5" r="1.4" fill="currentColor"/></svg>',
  acct:'<svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><circle cx="13" cy="13" r="11.2" stroke="currentColor" stroke-width="1.5" opacity=".5"/><circle cx="13" cy="10.4" r="3.5" fill="currentColor" opacity=".72"/><path d="M5.6 21.4c1.5-3.4 4.2-5.1 7.4-5.1s5.9 1.7 7.4 5.1" stroke="currentColor" stroke-width="1.5" opacity=".72" stroke-linecap="round"/></svg>',
  search:'<svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><circle cx="6.4" cy="6.4" r="4.9" stroke="currentColor" stroke-width="1.7"/><path d="m10.2 10.2 3.2 3.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  pen:'<svg width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true"><path d="M11.6 1.9 15.1 5.4 5.6 14.9 1.4 15.6l.7-4.2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  pin:'<svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor" aria-hidden="true"><path d="M8.4.6 12.4 4.6l-1.5 1.5-.7-.2-2.6 2.6.3 2.3-1.2 1.2-2.6-2.6-3 2.3 2.3-3L.8 6.1 2 4.9l2.3.3L6.9 2.6l-.2-.7z"/></svg>',
  chev:'<svg width="8" height="13" viewBox="0 0 8 13" fill="none" aria-hidden="true"><path d="m1.4 1.4 5.2 5.1-5.2 5.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  up:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 14.5v-11M4 8.3 9 3.4l5 4.9" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
function tagOrg(id){const o=org(id);return `<span class="tag org" style="--c:${o.color}" title="${E(o.label)}"><b></b>${E(o.id)}</span>`;}
function tagPri(id){const p=pri(id);const lo=(id==='P2'||id==='P3');return `<span class="tag pri${lo?' lo':''}" style="--c:${p.color}" title="${E(p.label)}">${E(p.id)}</span>`;}
function tagHost(id){const h=host(id);return `<span class="tag host" style="--c:${h.color}"><b></b>${E(h.id)}</span>`;}
function tagState(s){
  if(s.status==='needs_you') return '<span class="tag needs">NEEDS YOU</span>';
  if(s.status==='working') return '<span class="dots" aria-label="working"><i></i><i></i><i></i></span>';
  return `<span class="tag st">${E(s.status)}</span>`;
}
function counts(){
  const c={all:F.sessions.length};
  F.hosts.forEach(h=>c[h.id]=F.sessions.filter(s=>s.host===h.id).length);
  return c;
}
const ST = { machine:'all', sort:'Recent', sheet:false, openTask:'86ey1a3c', newHost:'mactop', newOrg:'GM', newPri:'P1' };
const SORTS = ['Recent','Needs you','Priority'];
function agoMin(a){ if(a==='now') return 0; const n=parseFloat(a)||0; return a.endsWith('d')?n*1440:a.endsWith('h')?n*60:n; }
function visible(){
  let list = F.sessions.filter(s => ST.machine==='all' || s.host===ST.machine);
  const P = {P0:0,P1:1,P2:2,P3:3};
  if(ST.sort==='Needs you') list = list.slice().sort((a,b)=>(a.status==='needs_you'?0:1)-(b.status==='needs_you'?0:1) || agoMin(a.ago)-agoMin(b.ago));
  else if(ST.sort==='Priority') list = list.slice().sort((a,b)=>P[a.priority]-P[b.priority] || agoMin(a.ago)-agoMin(b.ago));
  else list = list.slice().sort((a,b)=>agoMin(a.ago)-agoMin(b.ago));
  return list;
}
function rowHTML(s, cls){
  const hot = s.status==='needs_you';
  return `<a class="row${hot?' hot':''}${cls||''}" href="#session/${s.id}">
    <div class="rbody">
      <div class="rtitle">${E(s.title)}</div>
      <div class="rmeta">${E(s.repo)} <span class="sl">|</span> ${E(s.branch)}</div>
      <div class="rtags">${tagOrg(s.org)}${tagPri(s.priority)}${tagHost(s.host)}${tagState(s)}</div>
    </div>
    <div class="rright">${s.unread?'<span class="unread" aria-label="unread"></span>':''}<span class="age">${E(s.ago)}</span></div>
  </a>`;
}
function screenList(){
  const c = counts(), list = visible(), p = sess(F.pinned);
  const nu = F.sessions.filter(s=>s.status==='needs_you').length;
  const mach = [{id:'all',label:'All',color:'#101319',live:true}].concat(F.hosts).map(h=>
    `<button class="mchip${h.live?'':' off'}" aria-pressed="${ST.machine===h.id}" data-m="${h.id}">
      <span class="dot" style="background:${h.id==='all'?'currentColor':h.color}"></span>${E(h.label)}
      <span class="n">${c[h.id]}</span>${h.live===false?'<span class="n" title="offline">off</span>':''}
    </button>`).join('');
  return `<div class="screen">
    <header class="nav">
      <div class="nav-row">
        <div class="mark">fb</div><h1>Sessions</h1>
        <span class="grow"></span>
        <span class="tag needs" style="height:22px">${nu} NEED YOU</span>
        <button class="iconbtn" aria-label="Account">${ico.acct}</button>
      </div>
      <div class="machines">${mach}</div>
    </header>
    <div class="scroll">
      <div class="pad" style="padding-top:12px">
        <div class="search">${ico.search}<input placeholder="Search sessions" aria-label="Search sessions"></div>
        <div class="pinlabel">${ico.pin} Pinned</div>
        ${p?`<a class="pin" href="#session/${p.id}">
          <div class="rbody"><div class="rtitle">${E(p.title)}</div>
          <div class="rmeta">${E(p.repo)} <span class="sl">|</span> ${E(p.branch)}</div>
          <div class="rtags">${tagOrg(p.org)}${tagPri(p.priority)}${tagHost(p.host)}${tagState(p)}</div></div>
          <div class="rright"><span class="age">${E(p.ago)}</span></div></a>`:''}
        <div class="sechead"><h2>All sessions</h2>
          <button class="sort" id="sortbtn">${E(ST.sort)} ${ico.chev}</button></div>
        <div class="card">${list.map(s=>rowHTML(s)).join('')}</div>
        <div class="hint" style="padding-top:12px">Tap a row to open its terminal. ${nu} session${nu===1?'':'s'} stopped at a prompt.</div>
        <div style="height:74px"></div>
      </div>
    </div>
    <a class="fab" href="#new">${ico.pen} New Session</a>
  </div>`;
}
function bufferHTML(s){
  const out = F.transcript.map(t=>{
    if(t.role==='user')      return `<div class="ln usr"><span class="g">❯</span><span class="t">${E(t.text)}</span></div>`;
    if(t.role==='assistant') return `<div class="ln ast"><span class="g">⏺</span><span class="t">${E(t.text)}</span></div>`;
    if(t.role==='tool')      return `<div class="ln tool"><span class="g">▸</span><span class="t"><span class="nm">${E(t.name)}</span>  ${E(t.text)}</span></div>`;
    if(t.role==='gate')      return `<div class="gate"><div class="q"><span class="g">❯</span><span class="t">${E(t.text)}<span class="cur"></span></span></div></div>`;
    return '';
  }).join('');
  return `<div class="ln sys">— session ${E(s.id)} attached · ${E(s.host)} · started 09:04 —</div>` + out;
}
function screenSession(id){
  const s = sess(id) || F.sessions[0];
  const h = host(s.host), gate = F.transcript.find(t=>t.role==='gate');
  const peers = F.sessions.filter(x=>x.host===s.host && x.id!==s.id).slice(0,2)
    .map((x,i)=>`<span class="seg">${i+2}:${E(x.id)}</span>`).join('');
  const keys = gate ? gate.options : ['Approve','Edit first','Deny'];
  const kc = {'Approve':['ok','A'],'Edit first':['','E'],'Deny':['no','D']};
  return `<div class="screen">
    <header class="nav">
      <div class="nav-row">
        <a class="back" href="#list">${ico.back} Sessions</a>
        <span class="grow"></span>
        <button class="iconbtn" id="morebtn" aria-label="More actions">${ico.more}</button>
      </div>
      <div class="dhead">
        <div class="dtitle">${E(s.title)}</div>
        <div class="dtags">${tagOrg(s.org)}${tagPri(s.priority)}${tagHost(s.host)}${tagState(s)}
          <span class="tag st">${E(s.repo)} | ${E(s.branch)}</span></div>
      </div>
    </header>
    <div class="pane">
      <div class="tbar"><span class="tl"><i></i><i></i><i></i></span>
        <span class="path">~/${E(s.repo)} — ${E(s.branch)}</span></div>
      <div class="buf" id="buf">${bufferHTML(s)}</div>
      <div class="status">
        <span class="seg s0">fleet</span><span class="seg s1">1:${E(s.id)}*</span>${peers}
        <span class="sp"></span>
        <span class="seg sr">${E(s.model)} · ${s.ctx}% ctx · $${s.cost.toFixed(2)} · ${E(h.label)}</span>
      </div>
    </div>
    <div class="keys">${keys.map(k=>{const m=kc[k]||['',k[0].toUpperCase()];
      return `<button class="key ${m[0]}"><span class="cap">[${m[1]}]</span>${E(k)}</button>`;}).join('')}</div>
    <div class="composer">
      <div class="field">type a message…</div>
      <button class="send" aria-label="Send">${ico.up}</button>
    </div>
    ${ST.sheet?`<div class="veil" id="veil"></div><div class="sheet">
      <div class="st">${E(s.title)}</div>
      <button>Hibernate session</button>
      <button>Open on Mac</button>
      <button class="danger">End session</button>
      <button class="cancel" id="cancel">Cancel</button></div>`:''}
  </div>`;
}
function screenNew(){
  const hb = F.hosts.map(h=>`<button class="hostbtn${h.live?'':' dis'}" style="--c:${h.color}"
      aria-pressed="${ST.newHost===h.id}" data-h="${h.id}" ${h.live?'':'disabled'}>
      <span class="hn">${E(h.label)}</span>
      <span class="hs">${h.live?h.sessions+' running':'offline since 6:40p'}</span></button>`).join('');
  const oc = F.orgs.map(o=>`<button class="chip" style="--c:${o.color}" aria-pressed="${ST.newOrg===o.id}" data-o="${o.id}">${E(o.id)} · ${E(o.label)}</button>`).join('');
  const pc = F.priorities.map(p=>`<button class="chip" style="--c:${p.color}" aria-pressed="${ST.newPri===p.id}" data-p="${p.id}">${E(p.id)} ${E(p.label)}</button>`).join('');
  const hl = host(ST.newHost);
  return `<div class="screen">
    <header class="nav"><div class="nav-row">
      <a class="back" href="#list">${ico.back} Sessions</a><span class="grow"></span>
      <h1 style="font-size:16px">New session</h1><span class="grow"></span>
      <span style="width:44px"></span></div></header>
    <div class="scroll"><div class="pad" style="padding-top:14px">
      <div class="flabel">Run it on</div>
      <div class="fgroup"><div class="hosts">${hb}</div></div>
      <div class="flabel">Where</div>
      <div class="fgroup">
        <div class="frow"><span class="k">Directory</span><input value="~/Projects/recruiting" aria-label="Directory"></div>
        <div class="frow"><span class="k">Branch</span><input value="offer-letter-1137" aria-label="Branch"></div>
        <div class="frow"><span class="k">Task id</span><input value="86ey1a3c" placeholder="optional" aria-label="Task id"></div>
      </div>
      <div class="flabel">Org — inferred from the repo</div>
      <div class="fgroup"><div class="chips">${oc}</div></div>
      <div class="flabel">Priority</div>
      <div class="fgroup"><div class="chips">${pc}</div></div>
      <div class="flabel">First prompt</div>
      <div class="fgroup"><div class="frow" style="align-items:flex-start">
        <textarea aria-label="First prompt">Draft the second offer letter from the template and stage it for approval.</textarea></div></div>
      <button class="primary">${ico.pen} Start on ${E(hl.label)}</button>
      <div class="hint" style="padding-top:10px">Opens a live terminal on ${E(hl.label)}. You will get the first gate on this phone.</div>
      <div style="height:24px"></div>
    </div></div></div>`;
}
function screenOrg(oid){
  const o = org(oid), tasks = (F.orgTasks[oid]||[]);
  const P = {P0:0,P1:1,P2:2,P3:3};
  const sorted = tasks.slice().sort((a,b)=>P[a.priority]-P[b.priority] || String(a.due).localeCompare(String(b.due)));
  const nu = tasks.reduce((n,t)=>n+(t.subtasks||[]).filter(s=>s.status==='needs you').length,0);
  const body = sorted.map(t=>{
    const open = ST.openTask===t.id, subs=t.subtasks||[];
    const hot = subs.some(s=>s.status==='needs you');
    const linked = F.sessions.filter(s=>s.task===t.id);
    return `<div class="task">
      <button class="thead" data-t="${t.id}">
        <div class="rbody"><div class="tname">${E(t.name)}</div>
          <div class="tmeta">${E(t.status)} · due ${E(t.due)} · ${subs.length} subtask${subs.length===1?'':'s'} · ${E(t.id)}</div>
          <div class="rtags" style="margin-top:8px">${tagPri(t.priority)}${tagOrg(oid)}${hot?'<span class="tag needs">NEEDS YOU</span>':''}</div></div>
        <div class="rright" style="justify-content:center;min-width:20px;color:#b9bdc7;transform:rotate(${open?90:0}deg)">${ico.chev}</div>
      </button>
      ${open?subs.map(s=>{const h=s.status==='needs you',d=s.status==='done';
        return `<div class="sub${h?' hot':''}"><span class="sbox${d?' done':''}${h?' hot':''}">${d?'✓':h?'!':''}</span>
          <span style="flex:1;min-width:0">${E(s.name)}</span><span class="sstat">${E(s.status)}</span></div>`;}).join(''):''}
      ${open?linked.map(s=>`<a class="slink" href="#session/${s.id}">${tagPri(s.priority)}<span class="sn">${E(s.title)}</span>
        <span class="age">${E(s.ago)}</span>${ico.chev}</a>`).join(''):''}
    </div>`;}).join('');
  return `<div class="screen">
    <header class="nav"><div class="nav-row">
      <a class="back" href="#list">${ico.back} Sessions</a><span class="grow"></span>
      <button class="iconbtn" aria-label="More">${ico.more}</button></div>
      <div class="dhead"><div class="dtitle">${E(o.label)}</div>
        <div class="dtags">${tagOrg(oid)}<span class="tag st">${tasks.length} tasks</span>
        ${nu?`<span class="tag needs">${nu} NEED YOU</span>`:''}</div></div></header>
    <div class="scroll"><div class="pad" style="padding-top:12px">
      <div class="flabel">Priority order</div>${body}<div style="height:24px"></div>
    </div></div></div>`;
}
function render(){
  const h = location.hash || '#list';
  if(h.startsWith('#session/')) app.innerHTML = screenSession(h.slice(9));
  else if(h === '#new') app.innerHTML = screenNew();
  else if(h.startsWith('#org/')) app.innerHTML = screenOrg(h.slice(5));
  else app.innerHTML = screenList();
  const buf = document.getElementById('buf'); if(buf) buf.scrollTop = buf.scrollHeight;
  wire();
}
function wire(){
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ST.machine=b.dataset.m;render();});
  document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{ST.newHost=b.dataset.h;render();});
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ST.newOrg=b.dataset.o;render();});
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ST.newPri=b.dataset.p;render();});
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ST.openTask=(ST.openTask===b.dataset.t?null:b.dataset.t);render();});
  const sb = document.getElementById('sortbtn');
  if(sb) sb.onclick=()=>{ST.sort=SORTS[(SORTS.indexOf(ST.sort)+1)%SORTS.length];render();};
  const mb = document.getElementById('morebtn'); if(mb) mb.onclick=()=>{ST.sheet=true;render();};
  const cx = document.getElementById('cancel'); if(cx) cx.onclick=()=>{ST.sheet=false;render();};
  const vl = document.getElementById('veil'); if(vl) vl.onclick=()=>{ST.sheet=false;render();};
}
window.addEventListener('hashchange',()=>{ST.sheet=false;render();});
render();
})();
</script>
</body>
</html>
