<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Sessions · Omnara Overlay</title>
<style>
  :root{
    --bg:#0a0c10;
    --panel:#10131a;
    --card:#151923;
    --card-2:#1a1f2b;
    --line:#232a39;
    --line-soft:#1c2230;
    --text:#e9edf4;
    --mut:#98a2b6;
    --dim:#5e6778;
    --hot:#ff5c38;                 /* the ONE hot accent — Needs You */
    --hot-soft:rgba(255,92,56,.13);
    --hot-line:rgba(255,92,56,.45);
    --work:#41d992;
    --work-soft:rgba(65,217,146,.12);
    --wait:#8fa3c4;
    --wait-soft:rgba(143,163,196,.12);
    --stale:#6a7383;
    --stale-soft:rgba(106,115,131,.10);
    --dead:#f4695c;
    --tier-attach:#41d992;
    --tier-resume:#7aa2ff;
    --tier-revive:#c99cff;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --r:14px;
    font-size:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom);
  }
  svg{display:block;flex:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;gap:12px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:rgba(10,12,16,.88);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line-soft);
  }
  .omnara-mark{
    width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(145deg,#1d2432,#12161f);
    border:1px solid var(--line);
    display:grid;place-items:center;
  }
  .tb-titles{min-width:0;flex:1}
  .tb-titles h1{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
  .tb-titles .sub{font-size:.72rem;color:var(--mut);display:flex;align-items:center;gap:5px;margin-top:1px}
  .tb-titles .sub .odot{width:6px;height:6px;border-radius:50%;background:var(--work)}
  .demo-toggle{
    display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 10px;
    font-size:.72rem;color:var(--mut);font-weight:600;letter-spacing:.03em;
  }
  .demo-toggle .track{
    width:40px;height:24px;border-radius:12px;background:var(--card-2);
    border:1px solid var(--line);position:relative;transition:background .2s,border-color .2s;flex:none;
  }
  .demo-toggle .knob{
    position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:var(--dim);transition:transform .2s,background .2s;
  }
  .demo-toggle[aria-pressed="true"] .track{background:var(--work-soft);border-color:var(--work)}
  .demo-toggle[aria-pressed="true"] .knob{transform:translateX(16px);background:var(--work)}

  /* ---------- fleet strip ---------- */
  .fleet{
    display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;
    padding:10px 16px 4px;
  }
  .fleet::-webkit-scrollbar{display:none}
  .node-chip{
    display:flex;align-items:center;gap:7px;flex:none;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px 6px 9px;font-size:.72rem;color:var(--mut);
  }
  .node-chip .ldot{width:8px;height:8px;border-radius:50%;flex:none}
  .node-chip[data-live="fresh"] .ldot{background:var(--work);box-shadow:0 0 6px rgba(65,217,146,.6)}
  .node-chip[data-live="stale"] .ldot{background:#e8b640}
  .node-chip[data-live="dead"] .ldot{background:var(--dead)}
  .node-chip b{color:var(--text);font-weight:600}
  .node-chip .age{color:var(--dim)}
  .node-chip[data-live="dead"]{border-color:rgba(244,105,92,.4)}
  .node-chip[data-live="dead"] .age{color:var(--dead);font-weight:600}
  .totals{
    display:flex;gap:14px;flex:none;align-items:center;margin-left:auto;
    font-size:.72rem;color:var(--mut);padding-right:2px;
  }
  .totals .t b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
  .totals .t.hot b{color:var(--hot)}

  /* ---------- segmented filter (phone) ---------- */
  .segbar{
    position:sticky;top:calc(55px + env(safe-area-inset-top));z-index:30;
    display:flex;gap:4px;margin:8px 16px 4px;padding:4px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
  }
  .seg{
    flex:1;min-height:44px;border-radius:9px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    font-size:.72rem;font-weight:600;color:var(--mut);
    transition:background .15s,color .15s;
  }
  .seg .cnt{font-size:.68rem;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
  .seg[aria-selected="true"]{background:var(--card-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
  .seg[data-k="needs"][aria-selected="true"]{box-shadow:inset 0 0 0 1px var(--hot-line);color:var(--hot)}
  .seg[data-k="needs"] .cnt.nonzero{color:var(--hot)}
  .seg[data-k="working"][aria-selected="true"]{color:var(--work)}

  /* ---------- board ---------- */
  .board{padding:8px 16px 40px;display:block}
  .col{display:none}
  .board[data-view="needs"]   .col[data-k="needs"],
  .board[data-view="working"] .col[data-k="working"],
  .board[data-view="waiting"] .col[data-k="waiting"],
  .board[data-view="stale"]   .col[data-k="stale"]{display:block}
  .col-head{display:none}
  .col-cards{display:flex;flex-direction:column;gap:12px}
  .empty{
    border:1px dashed var(--line);border-radius:var(--r);
    padding:28px 16px;text-align:center;color:var(--dim);font-size:.8rem;
  }

  /* ---------- card ---------- */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    overflow:hidden;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--dim)}
  .card[data-s="working"]::before{background:var(--work)}
  .card[data-s="needs"]::before{background:var(--hot)}
  .card[data-s="waiting"]::before{background:var(--wait)}
  .card[data-s="stale"]::before{background:var(--stale)}
  .card[data-s="needs"]{
    border-color:var(--hot-line);
    box-shadow:0 0 0 1px rgba(255,92,56,.12),0 4px 22px rgba(255,92,56,.10);
  }
  .card[data-s="stale"]{opacity:.68;filter:saturate(.75)}
  .card[data-s="stale"]:hover,.card[data-s="stale"]:focus-within{opacity:.92}

  .card-head{
    display:flex;align-items:center;gap:8px;
    padding:12px 14px 8px 16px;
  }
  .proj{font-weight:700;font-size:.95rem;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .host-chip{
    display:flex;align-items:center;gap:5px;flex:none;
    font-size:.7rem;color:var(--mut);
    background:var(--card-2);border:1px solid var(--line-soft);border-radius:999px;padding:3px 9px 3px 7px;
  }
  .host-chip.hostdead{border-color:rgba(244,105,92,.35)}
  .host-chip.hostdead .hname{color:var(--dead)}
  .st-ic{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px}
  .st-ic .lbl{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .card[data-s="working"] .st-ic{color:var(--work)}
  .card[data-s="needs"]   .st-ic{color:var(--hot)}
  .card[data-s="waiting"] .st-ic{color:var(--wait)}
  .card[data-s="stale"]   .st-ic{color:var(--stale)}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--work);position:relative;flex:none}
  .pulse-dot::after{
    content:"";position:absolute;inset:-4px;border-radius:50%;
    border:1.5px solid var(--work);opacity:.6;animation:pulse 2.2s ease-out infinite;
  }
  @keyframes pulse{0%{transform:scale(.55);opacity:.7}80%{transform:scale(1.25);opacity:0}100%{opacity:0}}

  .needs-banner,.warn-banner{
    margin:0 14px 0 16px;padding:6px 10px;border-radius:8px;
    font-size:.72rem;font-weight:600;display:flex;align-items:center;gap:7px;
  }
  .needs-banner{background:var(--hot-soft);color:var(--hot)}
  .warn-banner{background:rgba(201,156,255,.1);color:var(--tier-revive)}
  .warn-banner.repair{background:rgba(232,182,64,.1);color:#e8b640}

  .card-body{padding:10px 14px 8px 16px;cursor:pointer}
  .sumrow{display:flex;gap:8px;font-size:.8rem;padding:2px 0;min-width:0}
  .sumrow .k{
    flex:none;width:38px;font-size:.65rem;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:var(--dim);padding-top:2px;
  }
  .sumrow.now .k{color:var(--mut)}
  .sumrow .v{color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sumrow.nx .v,.sumrow.gl .v{color:var(--mut)}
  .card.expanded .sumrow .v{white-space:normal;overflow:visible}
  .detail{display:none;margin-top:8px;padding:9px 11px;background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;font-size:.72rem;color:var(--mut)}
  .card.expanded .detail{display:block}
  .detail .drow{display:flex;gap:6px;padding:1.5px 0}
  .detail .drow b{color:var(--text);font-weight:600;flex:none}
  .detail .sid{color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.65rem;word-break:break-all}
  .prov{display:flex;align-items:center;gap:5px;margin-top:6px;color:var(--dim);font-size:.66rem}
  .expand-hint{display:flex;justify-content:center;padding-top:4px;color:var(--dim)}
  .expand-hint svg{transition:transform .2s}
  .card.expanded .expand-hint svg{transform:rotate(180deg)}

  /* numerics */
  .nums{display:flex;flex-wrap:wrap;gap:6px;padding:2px 14px 10px 16px}
  .num{
    display:flex;align-items:center;gap:5px;
    background:var(--card-2);border:1px solid var(--line-soft);border-radius:8px;
    padding:4px 8px;font-size:.72rem;color:var(--mut);
    font-variant-numeric:tabular-nums;
  }
  .num b{color:var(--text);font-weight:600}
  .num.ctx-hi{border-color:rgba(201,156,255,.4)}
  .num.ctx-hi b{color:var(--tier-revive)}
  .num svg{color:var(--dim)}

  /* footer */
  .card-foot{
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    padding:0 14px 10px 16px;font-size:.68rem;color:var(--dim);
  }
  .fchip{
    display:flex;align-items:center;gap:4px;
    background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;
    padding:2.5px 7px;color:var(--mut);max-width:100%;
  }
  .fchip .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
  .fchip.model{text-transform:capitalize}
  .fchip.model.opus{color:#c9b8ff;border-color:rgba(201,184,255,.25)}
  .fchip.model.sonnet{color:#8fd8d2;border-color:rgba(143,216,210,.25)}
  .fmeta{display:flex;align-items:center;gap:4px}
  .fmeta.sumage{margin-left:auto}

  /* action row — thumb zone */
  .actions{
    display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;
    padding:10px 14px 12px 16px;border-top:1px solid var(--line-soft);
    background:rgba(255,255,255,.015);
  }
  .live-chip{
    display:flex;align-items:center;justify-content:center;gap:6px;
    min-height:44px;padding:0 14px;border-radius:10px;flex:none;
    border:1px solid var(--line);background:var(--card-2);
    font-size:.75rem;font-weight:700;letter-spacing:.04em;color:var(--text);
  }
  .live-chip:active{transform:scale(.97)}
  .live-chip .ldot{width:7px;height:7px;border-radius:50%;background:var(--work);flex:none}
  .card[data-s="needs"] .live-chip .ldot{background:var(--hot)}
  .card[data-s="waiting"] .live-chip .ldot,
  .card[data-s="stale"] .live-chip .ldot{background:var(--dim)}
  .live-chip .arr{color:var(--mut)}
  .btn-resume{
    flex:1 1 150px;min-width:0;min-height:44px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:.8rem;font-weight:700;letter-spacing:.02em;
    background:var(--card-2);border:1px solid var(--line);color:var(--text);
    position:relative;
  }
  .btn-resume:active{transform:scale(.98)}
  .card[data-s="needs"] .btn-resume{background:var(--hot);border-color:var(--hot);color:#180a06}
  .card[data-s="needs"] .btn-resume .tier{background:rgba(0,0,0,.22);color:#180a06;border-color:transparent}
  .btn-resume[disabled]{opacity:.45;cursor:not-allowed}
  .btn-resume[disabled]:active{transform:none}
  .btn-repair{
    flex:1 1 120px;min-width:0;min-height:44px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:.78rem;font-weight:700;
    background:rgba(232,182,64,.12);border:1px solid rgba(232,182,64,.45);color:#e8b640;
  }
  .btn-repair:active{transform:scale(.98)}
  .tier{
    font-size:.62rem;font-weight:800;letter-spacing:.08em;
    padding:2.5px 7px;border-radius:5px;border:1px solid;
  }
  .tier.attach{color:var(--tier-attach);border-color:rgba(65,217,146,.4);background:var(--work-soft)}
  .tier.resume{color:var(--tier-resume);border-color:rgba(122,162,255,.4);background:rgba(122,162,255,.1)}
  .tier.revive{color:var(--tier-revive);border-color:rgba(201,156,255,.4);background:rgba(201,156,255,.1)}

  /* tooltip */
  [data-tip]{position:relative}
  [data-tip]:hover::after,[data-tip]:focus-visible::after{
    content:attr(data-tip);
    position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
    background:#0d1017;border:1px solid var(--line);color:var(--text);
    font-size:.68rem;font-weight:500;letter-spacing:0;line-height:1.35;
    padding:7px 10px;border-radius:8px;white-space:normal;width:max-content;max-width:240px;
    box-shadow:var(--shadow);z-index:60;pointer-events:none;text-align:left;
  }

  /* ---------- toast ---------- */
  .toast-wrap{
    position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;
    width:max-content;max-width:92vw;pointer-events:none;
  }
  .toast{
    display:flex;align-items:center;gap:9px;
    background:#171c26;border:1px solid var(--line);border-radius:12px;
    padding:11px 16px;font-size:.8rem;font-weight:600;color:var(--text);
    box-shadow:var(--shadow);
    animation:toast-in .25s ease-out;
  }
  .toast.out{animation:toast-out .25s ease-in forwards}
  @keyframes toast-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes toast-out{to{opacity:0;transform:translateY(8px)}}
  .spin{animation:spin 1s linear infinite;color:var(--work)}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- phone modal ---------- */
  .overlay{
    position:fixed;inset:0;z-index:80;display:none;
    align-items:center;justify-content:center;
    background:rgba(5,6,9,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    padding:20px;
  }
  .overlay.open{display:flex}
  .phone{
    width:min(372px,94vw);height:min(760px,88vh);
    background:#05070b;border-radius:44px;
    border:1px solid #2a3244;
    box-shadow:0 0 0 6px #10141c,0 30px 80px rgba(0,0,0,.7);
    display:flex;flex-direction:column;overflow:hidden;position:relative;
    animation:phone-in .28s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes phone-in{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
  .p-status{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 26px 4px;font-size:.72rem;font-weight:700;color:var(--text);flex:none;
  }
  .p-island{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:96px;height:24px;border-radius:14px;background:#000;z-index:2;
  }
  .p-sicons{display:flex;gap:5px;align-items:center;color:var(--text)}
  .p-appbar{
    display:flex;align-items:center;gap:10px;flex:none;
    padding:10px 14px;border-bottom:1px solid var(--line-soft);
  }
  .p-back{min-width:34px;min-height:34px;display:grid;place-items:center;color:var(--mut);border-radius:9px}
  .p-back:active{background:var(--card-2)}
  .p-appttl{min-width:0;flex:1}
  .p-appttl .wm{font-size:.62rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .p-appttl .sess{font-size:.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p-appttl .meta{font-size:.66rem;color:var(--mut);display:flex;align-items:center;gap:5px;margin-top:1px}
  .p-stdot{width:7px;height:7px;border-radius:50%;flex:none}
  .p-goal{
    margin:10px 14px 0;padding:8px 11px;flex:none;
    background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;
    font-size:.7rem;color:var(--mut);display:flex;gap:7px;
  }
  .p-goal b{color:var(--text);font-weight:700;flex:none;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;padding-top:1px}
  .p-chat{flex:1;overflow-y:auto;padding:12px 14px 8px;display:flex;flex-direction:column;gap:9px}
  .p-sys{align-self:center;font-size:.64rem;color:var(--dim);display:flex;align-items:center;gap:5px;text-align:center;padding:2px 0}
  .bub{
    max-width:86%;padding:9px 12px;border-radius:15px;
    font-size:.78rem;line-height:1.42;
  }
  .bub.agent{align-self:flex-start;background:var(--card-2);border:1px solid var(--line-soft);border-bottom-left-radius:5px}
  .bub.agent.ask{border-color:var(--hot-line);background:var(--hot-soft)}
  .bub .who{font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
  .bub.ask .who{color:var(--hot)}
  .p-tool{
    align-self:flex-start;display:flex;align-items:center;gap:7px;
    font-size:.68rem;color:var(--mut);font-variant-numeric:tabular-nums;
    background:var(--panel);border:1px solid var(--line-soft);border-radius:999px;padding:5px 11px;
  }
  .typing{align-self:flex-start;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card-2);border:1px solid var(--line-soft);border-radius:15px;border-bottom-left-radius:5px}
  .typing .lbl{font-size:.68rem;color:var(--mut)}
  .typing .dots{display:flex;gap:3px}
  .typing .dots i{width:5px;height:5px;border-radius:50%;background:var(--mut);animation:tdot 1.2s ease-in-out infinite}
  .typing .dots i:nth-child(2){animation-delay:.15s}
  .typing .dots i:nth-child(3){animation-delay:.3s}
  @keyframes tdot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
  .p-input{
    flex:none;display:flex;gap:8px;align-items:center;
    padding:10px 14px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line-soft);
  }
  .p-field{
    flex:1;min-height:40px;border-radius:20px;display:flex;align-items:center;
    padding:0 15px;font-size:.76rem;color:var(--dim);
    background:var(--card-2);border:1px solid var(--line-soft);
  }
  .p-field.unblock{border-color:var(--hot-line);color:var(--hot);font-weight:600}
  .p-send{
    width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;
    background:var(--card-2);border:1px solid var(--line);color:var(--dim);
  }
  .p-mockline{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:110px;height:4px;border-radius:3px;background:#2a3244}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition:none !important}
  }

  /* ---------- desktop: expand to 4 kanban columns ---------- */
  @media (min-width:1024px){
    .segbar{display:none}
    .topbar{padding-left:24px;padding-right:24px}
    .fleet{padding:12px 24px 4px}
    .board{
      display:grid;grid-template-columns:repeat(4,1fr);gap:16px;
      padding:12px 24px 48px;align-items:start;
    }
    .col{display:block !important;min-width:0}
    .col-head{
      display:flex;align-items:center;gap:8px;

  if ((r = str.match(/(\d+)\s*h/))) m += +r[1] * 60;
  if ((r = str.match(/(\d+)\s*m/))) m += +r[1];
  return m;
}

  }

  return `
  <article class="card ${isExp ? "expanded" : ""}" data-s="${k}" data-id="${s.session_id}">
    <div class="card-head">
      <span class="proj">${esc(s.project)}</span>
      <span class="host-chip ${hostDead ? "hostdead" : ""}" data-tip="${hostDead ? "Host publisher DEAD — data may be very old" : "Host: " + s.host}" tabindex="0">
        ${HOST_ICON[s.host]}<span class="hname">${s.host}</span>
      </span>
      <span class="st-ic">${statusIcon}</span>
    </div>
    ${banner}
    <div class="card-body" data-act="expand" role="button" tabindex="0"
         aria-expanded="${isExp}" aria-label="Session summary — tap to expand">
      <div class="sumrow now"><span class="k">Now</span><span class="v">${esc(s.summary.now)}</span></div>
      <div class="sumrow nx"><span class="k">Next</span><span class="v">${esc(s.summary.next)}</span></div>
      <div class="sumrow gl"><span class="k">Goal</span><span class="v">${esc(s.summary.goal)}</span></div>
      <div class="detail">
        ${s.note ? `<div class="drow"><b>Note</b><span>${esc(s.note)}</span></div>` : ""}
        ${s.source ? `<div class="drow"><b>Source</b><span>${esc(s.source)}</span></div>` : ""}
        <div class="drow"><b>Session</b><span class="sid">${esc(s.session_id)}</span></div>
        <div class="prov">${I.doc}Summary derived from transcript · generated ${fmtSumAge(s.summaryAgeMin)} ago</div>
      </div>
      <div class="expand-hint" aria-hidden="true">${I.chevD}</div>
    </div>
    <div class="nums">${nums}</div>
    <div class="card-foot">
      <span class="fchip" data-tip="Branch / worktree">${I.branch}<span class="txt">${esc(s.branch)}</span></span>
      <span class="fchip model ${esc(s.model)}">${I.cpu}<span class="txt">${esc(s.model)}</span></span>
      <span class="fmeta">${I.clock}${esc(s.lastActivity)}</span>
      <span class="fmeta sumage" data-tip="Age of the AI summary itself — derived from transcript, not live">${I.doc}summary ${fmtSumAge(s.summaryAgeMin)} old</span>
    </div>
    <div class="actions">
      <button class="live-chip" data-act="live" aria-label="Open live view in Omnara app">
        <span class="ldot"></span>${I.eye}LIVE<span class="arr">${I.arrowR}</span>
      </button>
      ${actionMain}
    </div>
  </article>`;
}

function renderBoard(){
  const buckets = {needs:[], working:[], waiting:[], stale:[]};
  live.sessions.forEach(s => buckets[statusKey(s)].push(s));
  $("#board").innerHTML = COLS.map(k => `
    <section class="col" data-k="${k}">
      <div class="col-head"><span class="cdot"></span>${STATUS_META[k].label}<span class="ccount">${buckets[k].length}</span></div>
      <div class="col-cards">
        ${buckets[k].length
          ? buckets[k].map(cardHTML).join("")
          : `<div class="empty">No ${STATUS_META[k].label.toLowerCase()} sessions right now</div>`}
      </div>
    </section>`).join("");
  $("#board").dataset.view = view;
  renderSeg();
}

function renderAll(){ renderFleet(); renderBoard(); }

/* ============================== interactions ============================== */
$("#segbar").addEventListener("click", e => {
  const b = e.target.closest(".seg");
  if (!b) return;
  view = b.dataset.k;
  renderBoard();
});

$("#board").addEventListener("click", e => {
  const actEl = e.target.closest("[data-act]");
  if (!actEl) return;
  const card = actEl.closest(".card");
  const s = live.sessions.find(x => x.session_id === card.dataset.id);
  const act = actEl.dataset.act;
  if (act === "expand"){
    expanded.has(s.session_id) ? expanded.delete(s.session_id) : expanded.add(s.session_id);
    card.classList.toggle("expanded");
    $(".card-body", card).setAttribute("aria-expanded", card.classList.contains("expanded"));
  } else if (act === "live"){
    openLive(s);
  } else if (act === "resume"){
    toast(I.playCirc, `Omnara: resume on ${s.host} · ${s.resumeTier} tier (mock)`);
  } else if (act === "revive"){
    toast(I.bolt, `Omnara: revive on ${s.host} — distill + fork (mock)`);
  } else if (act === "repair"){
    toast(I.wrench, `Repair: re-create worktree from ${s.branch} on ${s.host} (mock)`);
  }
});
$("#board").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset.act === "expand"){
    e.preventDefault(); e.target.click();
  }
});

/* ============================== toast ============================== */
function toast(icon, msg, ms){
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = icon + `<span>${esc(msg)}</span>`;
  $("#toastWrap").appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 260); }, ms || 2200);
}

/* ============================== live view (phone modal) ============================== */
function openLive(s){
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = I.spinner + `<span>Opening in Omnara app…</span>`;
  $("#toastWrap").appendChild(t);
  setTimeout(() => {
    t.classList.add("out"); setTimeout(() => t.remove(), 260);
    phoneSession = s;
    $("#phone").innerHTML = phoneHTML(s);
    $("#overlay").classList.add("open");
    const chat = $("#pChat");
    if (chat) chat.scrollTop = chat.scrollHeight;
  }, 750);
}

function phoneHTML(s){
  const k = statusKey(s);
  const stColor = {working:"var(--work)", needs:"var(--hot)", waiting:"var(--wait)", stale:"var(--stale)"}[k];
  const stLabel = {working:"agent working", needs:"waiting on you", waiting:"turn ended · idle " + fmtDur(s._idleMin), stale:"stale · idle " + fmtDur(s._idleMin)}[k];

  let bubbles = `<div class="p-sys">${I.doc}Live transcript tail · summary ${fmtSumAge(s.summaryAgeMin)} old · derived from transcript</div>`;
  bubbles += `<div class="bub agent"><div class="who">${esc(s.model)} · ${esc(s.host)}</div>${esc(s.summary.now)}</div>`;
  if (k === "needs"){
    bubbles += `<div class="bub agent ask"><div class="who">Needs your input</div>${esc(s.summary.next)}</div>`;
  } else if (k === "working"){
    bubbles += `<div class="p-tool">${I.spinner}<span id="pToolLine">context ${Math.round(s._ctx)}% · ${fmtTokens(s.tokens)} tok · msg ${s.msgs}</span></div>`;
    bubbles += `<div class="typing"><span class="lbl">${esc(s.model)} is working</span><span class="dots"><i></i><i></i><i></i></span></div>`;
  } else {
    bubbles += `<div class="p-sys">${I.pause}Turn ended · last activity ${esc(s.lastActivity)}</div>`;
    bubbles += `<div class="bub agent"><div class="who">Next when resumed</div>${esc(s.summary.next)}</div>`;
  }

  return `
    <span class="p-island" aria-hidden="true"></span>
    <div class="p-status"><span>2:30</span><span class="p-sicons">${I.signal}${I.battery}</span></div>
    <div class="p-appbar">
      <button class="p-back" id="pBack" aria-label="Close live view">${I.chevL}</button>
      <div class="p-appttl">
        <div class="wm">Omnara</div>
        <div class="sess">${esc(s.project)} · ${esc(s.branch)}</div>
        <div class="meta"><span class="p-stdot" style="background:${stColor}"></span>${esc(stLabel)} · ${HOST_ICON[s.host]} ${esc(s.host)}</div>
      </div>
    </div>
    <div class="p-goal"><b>Goal</b><span>${esc(s.summary.goal)}</span></div>
    <div class="p-chat" id="pChat">${bubbles}</div>
    <div class="p-input">
      <div class="p-field ${k === "needs" ? "unblock" : ""}">${k === "needs" ? "Reply to unblock this session…" : "Message agent…"}</div>
      <button class="p-send" aria-label="Send (disabled in mockup)" disabled>${I.send}</button>
    </div>
    <span class="p-mockline" aria-hidden="true"></span>`;
}

function closeLive(){ $("#overlay").classList.remove("open"); phoneSession = null; }
$("#overlay").addEventListener("click", e => {
  if (e.target === $("#overlay") || e.target.closest("#pBack")) closeLive();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLive(); });

/* ============================== demo mode ============================== */
const DEMO_FLIPS = [
  () => { // gm-sage finishes its pass
    const s = live.sessions.find(x => x.project === "gm-sage");
    if (s.status === "working"){ s.status = "waiting"; s.lastActivity = "just now"; s._idleMin = 0; toast(I.pause, "gm-sage: turn ended — waiting"); }
    else { s.status = "working"; s.lastActivity = "just now"; s._idleMin = 0; toast(I.play, "gm-sage: hourly pass started"); }
  },
  () => { // attribution run pauses on a question, then resumes
    const s = live.sessions.find(x => x.branch === "analyze-google-yelp-conversions");
    if (s.status === "working"){ s.status = "needs_input"; s.lastActivity = "just now"; s._idleMin = 0; live.totals.needsYou++; toast(I.alert, "growingmindfully needs your input"); }
    else { s.status = "working"; s.lastActivity = "just now"; s._idleMin = 0; live.totals.needsYou--; toast(I.play, "growingmindfully: back to work"); }
  }
];

function demoTick(){
  tickN++;
  live.sessions.forEach(s => {
    const k = statusKey(s);
    if (k === "working"){
      const dTok = 1200 + Math.floor(Math.random() * 7800);
      s.tokens += dTok;
      s._cost += dTok * 4.6e-6;
      s._elapsedMin += 2/60 * 30; // ~1 min per 2 ticks feel
      if (Math.random() < .3) s.msgs++;
      if (Math.random() < .25) s._ctx = Math.min(99, s._ctx + .2);
      s.summaryAgeMin = Math.max(0, (Math.random() < .3 ? 0 : s.summaryAgeMin + .1));
      live.totals.tokensToday += dTok;
      live.totals.estCostToday += dTok * 4.6e-6;
    } else if (k === "needs"){
      s._idleMin += .5;
    }
  });
  for (const n of Object.values(live.nodes)) if (n.liveness !== "dead") n.publishAgeSec = 2 + Math.floor(Math.random() * 9);
  live.nodes.mactop.publishAgeSec += 2;
  if (tickN % 6 === 0) DEMO_FLIPS[(tickN / 6) % DEMO_FLIPS.length | 0]();
  renderAll();
  // keep phone view ticking if open on a working session
  if (phoneSession && statusKey(phoneSession) === "working"){
    const line = $("#pToolLine");
    if (line) line.textContent = `context ${Math.round(phoneSession._ctx)}% · ${fmtTokens(phoneSession.tokens)} tok · msg ${phoneSession.msgs}`;
  }
}

$("#demoToggle").addEventListener("click", () => {
  demo = !demo;
  $("#demoToggle").setAttribute("aria-pressed", demo);
  if (demo){
    demoTimer = setInterval(demoTick, 2000);
    toast(I.bolt, "Demo mode: simulating live rail updates");
  } else {
    clearInterval(demoTimer);
    toast(I.pause, "Demo mode off");
  }
});

/* ============================== boot ============================== */
renderAll();
// Desktop shows all columns; phone default lands on the hottest view.
</script>
</body>
</html>
